      );
    }

    // ============================================================
    // CLIENT PRESENTATION PRINT — A4 portrait, design directeur de création
    // ============================================================
    function ClientPresentationPrint({ inputs, sim, scenarios, clientLabel, totalVerseBrut, autreAV, presPrime, scenarioLvl, onClose }) {
      const isPER = inputs.produit === "per";
      const isCapi = inputs.produit === "capi";
      // Scénario « prime périodique majorée » repris de la présentation interactive (transmission)
      const primeCompar = (presPrime && !isCapi && Math.round(presPrime) !== Math.round(inputs.versementMensuel)) ? (() => {
        const pS = runSimulation({ ...inputs, versementMensuel: presPrime }, scenarioLvl || 'med');
        return { prime: presPrime, capitalDeces: pS.proj.capitalFin, taxe: pS.fisc.taxe, net: pS.fisc.direct, abattTotal: pS.fisc.abattTotal };
      })() : null;
      const useAutreAV = !isPER && !isCapi && autreAV && autreAV.active;
      const livretNom = isPER ? "PER + Réintégration" : isCapi ? "Compte à terme" : (useAutreAV ? "Assurance vie client" : (LIVRETS.find(p=>p.id===inputs.livretId)?.nom || "Livret"));
      // Comparateur « Assurance vie client » (autre AV) pour le PDF
      const avComp = useAutreAV ? (() => {
        const aI = { ...inputs, produit: 'av', allocation: [{ id: 1, type: 'fondsEuro', poids: 1, rendement: autreAV.rdt, sri: 1 }] };
        const aS = runSimulation(aI, 'med');
        const aR = rente(aS.proj.capitalFin, aS.proj.totVerseNet, aS.rdt, autreAV.plus8ans ? 8 : 0, inputs.situationFamiliale, aS.proj.totVerseBrut);
        return { renteMois: aR.nette / 12, succ: aS.fisc.direct };
      })() : null;
      const N = Math.round(inputs.dureeAnnees);
      // Ref pour le canvas Chart.js (page 2 print)
      const printChartRef = useRef(null);
      const printChartInst = useRef(null);
      const pessData = useMemo(() => projectionSeries(inputs, sim.rdtPess), [inputs, sim.rdtPess]);
      const medData  = useMemo(() => projectionSeries(inputs, sim.rdtMed),  [inputs, sim.rdtMed]);
      const optData  = useMemo(() => projectionSeries(inputs, sim.rdtOpt),  [inputs, sim.rdtOpt]);
      // Pour PER : la courbe « livret » = PER + Réintégration (médian + réductions capitalisées)
      const livretData = useMemo(() => {
        if (isPER) {
          const aux = perReinvestSeries(inputs, sim.rdtMed, inputs.tauxIR ?? 0.30);
          return medData.map((v, i) => v + (aux[i] || 0));
        }
        if (useAutreAV) return projectionSeries(inputs, autreAV.rdt);
        return livretSeries(inputs);
      }, [inputs, sim.rdtMed, medData, isPER, useAutreAV, autreAV]);
      const finalSolution = medData[medData.length - 1];
      const finalLivret = livretData[livretData.length - 1];
      const finalPess = pessData[pessData.length - 1];
      const finalOpt  = optData[optData.length - 1];
      // En PER : finalLivret > finalSolution (par construction), gain = finalLivret - finalSolution
      const gainEUR = isPER ? (finalLivret - finalSolution) : (finalSolution - finalLivret);
      const gainPCT = isPER
        ? (finalSolution > 0 ? gainEUR / finalSolution : 0)
        : (finalLivret > 0 ? gainEUR / finalLivret : 0);
      const r50 = (n) => Math.round(n / 50) * 50;
      const renteLivMois = r50(useAutreAV ? avComp.renteMois : (sim.livretRenteBrute || 0) / 12);
      const succSol = sim.fisc?.direct ?? 0;
      const succLiv = useAutreAV ? avComp.succ : (sim.livretFisc?.net ?? 0);

      const produitNomComplet = inputs.produit === "multi" ? "PER + Assurance-Vie" : isPER ? "PER" : isCapi ? "Capi PM" : `Assurance vie${inputs.cabinetNom ? ' · ' + inputs.cabinetNom : ''}`;
      const reductionImpotCumulee = isPER ? (sim.fiscPER?.ecoFiscEntree || 0) : 0;

      const today = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });

      // === CHART.JS (page 2 print) — réplique du graphique de Step5Presentation ===
      // Dessine sur le canvas printChartRef. Pas d'animation, pas de tooltip (print).
      useEffect(() => {
        if (!printChartRef.current || typeof Chart === 'undefined') return;
        if (printChartInst.current) printChartInst.current.destroy();
        const ctx = printChartRef.current.getContext('2d');
        const labels = Array.from({length: N + 1}, (_, i) => i);
        // Gradient fill sous la courbe médiane (solution)
        const gradSol = ctx.createLinearGradient(0, 0, 0, 360);
        gradSol.addColorStop(0, 'rgba(4, 120, 87, 0.20)');
        gradSol.addColorStop(0.7, 'rgba(4, 120, 87, 0.04)');
        gradSol.addColorStop(1, 'rgba(4, 120, 87, 0)');
        // End-labels plugin : étiquette le bout de chaque courbe avec son nom + valeur, anti-chevauchement
        const endLabels = {
          id: 'endLabels',
          afterDatasetsDraw(chart) {
            const { ctx, chartArea } = chart;
            const items = [];
            chart.data.datasets.forEach((dataset, i) => {
              if (dataset._noEndLabel) return;
              const meta = chart.getDatasetMeta(i);
              const lastPoint = meta.data[meta.data.length - 1];
              if (!lastPoint) return;
              const value = dataset.data[dataset.data.length - 1];
              const suffix = dataset._endLabelSuffix || dataset.label || '';
              const label = suffix ? `${fmtEURc(value)} · ${suffix}` : fmtEURc(value);
              const isSoft = !!dataset._endLabelSoft;
              ctx.save(); ctx.font = isSoft ? '600 9px Inter' : '700 11px Inter';
              const tw = ctx.measureText(label).width; ctx.restore();
              const padX = isSoft ? 5 : 7;
              const w = tw + padX * 2;
              const h = isSoft ? 16 : 20;
              const x = lastPoint.x + (isSoft ? 5 : 7);
              const yIdeal = lastPoint.y - h / 2;
              items.push({ label, x, yIdeal, w, h, padX, isSoft, bg: isSoft ? (dataset._endLabelBg || dataset.borderColor) : dataset.borderColor });
            });
            items.sort((a, b) => a.yIdeal - b.yIdeal);
            const margin = 2;
            for (let i = 0; i < items.length; i++) {
              items[i].y = i === 0 ? items[i].yIdeal : Math.max(items[i].yIdeal, items[i - 1].y + items[i - 1].h + margin);
            }
            if (items.length > 0) {
              const lastBottom = items[items.length - 1].y + items[items.length - 1].h;
              const over = lastBottom - chartArea.bottom;
              if (over > 0) {
                for (let i = items.length - 1; i >= 0; i--) {
                  items[i].y -= over;
                  if (i > 0 && items[i].y < items[i - 1].y + items[i - 1].h + margin) {
                    items[i - 1].y -= (items[i - 1].y + items[i - 1].h + margin - items[i].y);
                  }
                }
              }
            }
            items.forEach(it => {
              ctx.save();
              ctx.font = it.isSoft ? '600 9px Inter' : '700 11px Inter';
              ctx.fillStyle = it.bg;
              if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(it.x, it.y, it.w, it.h, it.isSoft ? 8 : 10); ctx.fill(); }
              else { ctx.fillRect(it.x, it.y, it.w, it.h); }
              ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
              ctx.fillText(it.label, it.x + it.padX, it.y + it.h / 2);
              ctx.restore();
            });
          },
        };
        // Repères (PDF) — pastilles À L'APLOMB de chaque année, décalées en rangées si collision
        const compAnnotation = {
          id: 'compAnnotation',
          afterDraw(chart) {
            const comps = (inputs.versementsComplementaires || []).filter(v => (Number(v.montant) || 0) > 0 && Math.round(Number(v.annee) || 0) >= 0 && Math.round(Number(v.annee) || 0) <= N);
            if (!comps.length) return;
            const { ctx, chartArea, scales } = chart;
            ctx.save();
            const hdr = comps.length > 1 ? 'VERS. COMPLÉMENTAIRES' : 'VERS. COMPLÉMENTAIRE';
            ctx.font = '700 5.5px Inter'; const hW = ctx.measureText(hdr).width + 11, hH = 9;
            const pW = 58, pH = 14, gap = 1;
            const bx = chartArea.left + 5, by = chartArea.top - 1;
            const metaTop = chart.getDatasetMeta(0), metaMed = chart.getDatasetMeta(1);
            const ptAt = (meta, idx) => (meta && meta.data && meta.data[Math.min(meta.data.length - 1, idx)]) || null;
            const curveTopPix = (idx) => {
              const cands = [ptAt(metaTop, idx), ptAt(metaMed, idx)].filter(Boolean).map(p => p.y);
              return cands.length ? Math.min(...cands) : chartArea.bottom;
            };
            const medPix = (idx) => { const p = ptAt(metaMed, idx); return p ? { x: p.x, y: p.y } : { x: scales.x.getPixelForValue(idx), y: chartArea.bottom }; };
            const sorted = comps.map(v => { const yr = Math.round(Number(v.annee) || 0); return { v, yr, xt: scales.x.getPixelForValue(yr) }; }).filter(o => isFinite(o.xt)).sort((a, b) => a.xt - b.xt);
            // pastille À L'APLOMB de son année, poussée dans l'espace vide EN HAUT ; empilée si années proches ; jamais sur la courbe
            const topY = chartArea.top + 1;
            const rects = [{ x: bx, y: by, w: hW, h: hH }];
            const hitR = (a, b) => !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
            const findRow = (x, startY, maxY) => { let yy = startY; while (yy <= maxY) { const r = { x, y: yy, w: pW, h: pH }; if (!rects.some(q => hitR(r, q))) return yy; yy += (pH + gap); } return null; };
            const placed = sorted.map(o => {
              const mp = medPix(o.yr);
              const px = Math.max(chartArea.left, Math.min(chartArea.right - pW, o.xt - pW / 2));
              const maxY = curveTopPix(o.yr) - pH - 4;
              let py = findRow(px, topY, Math.max(topY, maxY));
              if (py == null) py = topY;
              rects.push({ x: px, y: py, w: pW, h: pH });
              return { ...o, px, py, yv: mp.y };
            });
            ctx.fillStyle = '#b8924e';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, hW, hH, 5); ctx.fill(); } else ctx.fillRect(bx, by, hW, hH);
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = '700 5.5px Inter'; ctx.fillText(hdr, bx + hW / 2, by + hH / 2 + 0.5);
            placed.forEach(o => {
              const py = o.py;
              {
                ctx.strokeStyle = 'rgba(184,146,78,0.5)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(o.xt, py + pH); ctx.lineTo(o.xt, o.yv); ctx.stroke(); ctx.setLineDash([]);
                ctx.fillStyle = '#b8924e'; ctx.beginPath(); ctx.arc(o.xt, o.yv, 2.6, 0, Math.PI * 2); ctx.fill();
              }
              ctx.fillStyle = '#fff';
              if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(o.px, py, pW, pH, 4); ctx.fill(); } else ctx.fillRect(o.px, py, pW, pH);
              ctx.strokeStyle = '#b8924e'; ctx.lineWidth = 1.2;
              if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(o.px, py, pW, pH, 4); ctx.stroke(); } else ctx.strokeRect(o.px, py, pW, pH);
              ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillStyle = '#b8924e'; ctx.font = '800 7.5px Inter';
              ctx.fillText('+' + new Intl.NumberFormat('fr-FR').format(Number(o.v.montant) || 0) + ' €', o.px + pW / 2, py + 5.5);
              ctx.fillStyle = '#a07f3f'; ctx.font = '700 5px Inter';
              ctx.fillText('ANNÉE ' + o.v.annee, o.px + pW / 2, py + 11);
            });
            ctx.textAlign = 'left';
            ctx.restore();
          },
        };
        const datasets = [
          // Optimiste (borne haute du tunnel)
          { label: 'Optimiste', data: optData, borderColor: 'rgba(5,150,105,0.65)', backgroundColor: 'rgba(16,185,129,0.10)', borderDash: [5,4], borderWidth: 1.75, fill: 2, tension: 0.35, pointRadius: 0, _endLabelSoft: true, _endLabelBg: '#059669' },
          // Médian (courbe principale)
          { label: isPER ? 'PER seul' : 'Médian', data: medData, borderColor: '#047857', backgroundColor: gradSol, borderWidth: 4, fill: true, tension: 0.35, pointRadius: 0 },
          // Pessimiste (borne basse du tunnel + remplissage blanc sous)
          { label: 'Pessimiste', data: pessData, borderColor: 'rgba(180,83,9,0.65)', backgroundColor: '#ffffff', borderDash: [5,4], borderWidth: 1.75, fill: 3, tension: 0.35, pointRadius: 0, _endLabelSoft: true, _endLabelBg: '#b45309' },
          // Référence (livret / PER+Réintégration) — masquée en multi-projet (aucune comparaison)
          ...(inputs.produit === "multi" ? [] : [{ label: isPER ? 'PER + Réinvest.' : livretNom, data: livretData, borderColor: isPER ? '#0d9488' : '#a8a29e', borderDash: isPER ? [4,4] : [6,5], borderWidth: isPER ? 2.5 : 2, fill: false, tension: 0.35, pointRadius: 0, _endLabelBg: isPER ? '#0d9488' : '#78716c' }]),
        ];
        printChartInst.current = new Chart(ctx, {
          type: 'line',
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: 'index', intersect: false },
            /* padding right augmenté pour accueillir les end-labels longs (« PER + RÉINTÉGRATION ») */
            layout: { padding: { right: 195, top: 12, bottom: 8, left: 8 } },
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: {
              y: { ticks: { callback: v => fmtEURc(v), font: { family: 'Inter', size: 10, weight: '500' }, color: '#78716c', padding: 6 }, grid: { color: '#f5f5f4', drawBorder: false }, border: { display: false } },
              x: { ticks: { callback: function(v, i) { return i % Math.ceil(N/8) === 0 || i === N ? `An ${this.getLabelForValue(v)}` : ''; }, font: { family: 'Inter', size: 10, weight: '500' }, color: '#78716c', padding: 6 }, grid: { display: false }, border: { display: false } },
            },
          },
          plugins: [endLabels, compAnnotation],
        });
        return () => printChartInst.current?.destroy();
      }, [pessData, medData, optData, livretData, N, livretNom, isPER, inputs.versementsComplementaires]);

      // === Mini-chart SVG (page 2) ===
      // padR augmenté pour accueillir les étiquettes longues comme "PER + RÉINTÉGRATION".
      const chartW = 720, chartH = 240, padL = 38, padR = 160, padT = 16, padB = 30;
      const allValues = [...pessData, ...medData, ...optData, ...livretData];
      const yMin = 0, yMax = Math.max(...allValues) * 1.05;
      const xs = (i) => padL + (i / N) * (chartW - padL - padR);
      const ys = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (chartH - padT - padB);
      const buildPath = (data) => data.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xs(i).toFixed(1)} ${ys(v).toFixed(1)}`).join(' ');
      const pathPess = buildPath(pessData);
      const pathMed = buildPath(medData);
      const pathOpt = buildPath(optData);
      const pathLiv = buildPath(livretData);
      // Tunnel fill : opt en haut → pess en bas → fermé
      const pathTunnel = optData.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xs(i).toFixed(1)} ${ys(v).toFixed(1)}`).join(' ')
        + ' ' + pessData.slice().reverse().map((v, i) => `L ${xs(N - i).toFixed(1)} ${ys(v).toFixed(1)}`).join(' ') + ' Z';

      // === Calculs comparaison ===
      const Bar = ({ name, value, fmt = fmtEURc, max, isWin, color = "green" }) => (
        <div className="pres-bar-row">
          <span className={`nm ${isWin ? 'win' : ''}`}>{name}</span>
          <span className="pres-bar"><span className={color} style={{width: `${(value/Math.max(max,1))*100}%`}}></span></span>
          <span className="vl">{fmt(value)}</span>
        </div>
      );


      // === Donut allocation ===
      const allocBar = inputs.allocation;

      // === Hero number selon produit (la statistique signature) ===
      const heroCaption = isPER
        ? `Économie fiscale totale sur ${N} ans, calculée au taux marginal d'imposition de ${(inputs.tauxIR*100).toFixed(0)} %.`
        : isCapi
        ? `Capital brut à terme du contrat de capitalisation, trésorerie d'entreprise, scénario médian sur ${N} ans.`
        : `Capital supplémentaire à terme face au ${livretNom.toLowerCase()}, scénario médian sur ${N} ans.`;

      // === Ligne décorative Figara (trait + étoile compas rouge au centre) — réutilisable ===
      const FigaraRule = ({ style }) => (
        <div className="pres-figara-rule" style={style}>
          <div className="line"></div>
          <svg viewBox="0 0 32 32" fill="none">
            <polygon points="16,1 17,15 16,16 15,15" fill="#DC2626"/>
            <polygon points="31,16 17,17 16,16 17,15" fill="#DC2626"/>
            <polygon points="16,31 15,17 16,16 17,17" fill="#DC2626"/>
            <polygon points="1,16 15,15 16,16 15,17" fill="#DC2626"/>
            <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(45 16 16)"/>
            <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(135 16 16)"/>
            <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(225 16 16)"/>
            <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(315 16 16)"/>
            <circle cx="16" cy="16" r="0.8" fill="#DC2626"/>
          </svg>
          <div className="line"></div>
        </div>
      );

      return (
        <div className="pres-page">
          {/* TOOLBAR */}
          <div className="pres-toolbar no-print">
            <div style={{display:'flex', alignItems:'center', gap:'24px'}}>
              <span className="pres-brand" style={{display:'inline-flex', alignItems:'center', gap:'8px'}}>
                <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
                  <polygon points="16,1 17,15 16,16 15,15" fill="#DC2626"/>
                  <polygon points="31,16 17,17 16,16 17,15" fill="#DC2626"/>
                  <polygon points="16,31 15,17 16,16 17,17" fill="#DC2626"/>
                  <polygon points="1,16 15,15 16,16 15,17" fill="#DC2626"/>
                  <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(45 16 16)"/>
                  <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(135 16 16)"/>
                  <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(225 16 16)"/>
                  <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(315 16 16)"/>
                  <circle cx="16" cy="16" r="0.8" fill="#DC2626"/>
                </svg>
                Figara
              </span>
              <span className="pres-meta">3 PAGES · A4 PORTRAIT · PRÊT À IMPRIMER</span>
            </div>
            <div style={{display:'flex', gap:'10px'}}>
              <button className="pres-btn ghost" onClick={onClose}>← Retour</button>
              <button className="pres-btn primary" onClick={() => window.print()}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="6 9 6 2 18 2 18 9"/>
                  <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                  <rect x="6" y="14" width="12" height="8"/>
                </svg>
                Imprimer
              </button>
            </div>
          </div>

          <div className="sheets-stack">

            {/* ============== PAGE 1 — COVER PRO ============== */}
            <div className="pres-sheet pres-cover">
              {/* Photo panoramique bas de page */}
              <div className="pres-cover-photo-band">
                <img
                  src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=85"
                  alt=""

                  onError={(e) => {

              </div>

              {/* Mid — titre */}
              <div className="pres-cover-mid">
                <div className="pres-cover-eyebrow">Étude personnalisée</div>
                <h1 className="pres-cover-title">
                  Simulation<br/>
                  <em>{isPER ? "Plan d'Épargne Retraite" : isCapi ? "Contrat de Capitalisation Personne Morale" : "Assurance-Vie"}</em>
                </h1>
              </div>

              {/* Bloc méta — carte blanche, ombre, accent rouge */}
              <div className="pres-cover-meta-block">
                <div className="pres-cover-meta-grid">
                  <div>
                    <div className="pres-cover-meta-k">Préparé pour</div>
                    <div className="pres-cover-meta-v">{clientLabel || "Nouveau client"}</div>
                  </div>
                  <div>
                    <div className="pres-cover-meta-k">Date de l'étude</div>
                    <div className="pres-cover-meta-v">{today}</div>
                  </div>
                  <div>
                    <div className="pres-cover-meta-k">Conseiller</div>
                    <div className="pres-cover-meta-v">{inputs.conseillerNom || 'Votre conseiller'}{inputs.cabinetNom ? <><br/><em>{inputs.cabinetNom}</em></> : null}</div>
                  </div>
                  <div>
                    <div className="pres-cover-meta-k">Référence</div>
                    <div className="pres-cover-meta-v">{clientId(inputs)}</div>
                  </div>
                </div>
              </div>

              {/* Footer page 1 — pagination supprimée */}
            </div>

            {/* ============== PAGE 2 — DASHBOARD GRAPHIQUE ============== */}
            <div className="pres-sheet pres-spread">
              <div className="pres-spread-watermark">II</div>

              {/* Head — sans pagination (déplacée en bas) */}
              <div className="pres-spread-head">
                <div>
                  <div className="pres-spread-pretitle">Évolution · {N} ans · scénario médian</div>
                  <h2 className="pres-spread-title">Votre capital, <em>en perspective.</em></h2>
                </div>
              </div>

              {/* Ligne décorative Figara sous le titre */}
              <FigaraRule style={{margin:'4mm 0 0'}}/>

              {/* Hypothèses retenues — récap propre, aligné, dans l'ordre demandé */}
              {(() => {
                const nf = (x) => new Intl.NumberFormat('fr-FR').format(Math.round(x || 0));
                const frais = inputs.fraisSouscription || 0;
                const comps = (inputs.versementsComplementaires || []).filter(v => (Number(v.montant) || 0) > 0);
                const totalComp = comps.reduce((s, v) => s + (Number(v.montant) || 0), 0);
                const remiseEur = Math.max(0, (FRAIS_SOUSC_MAX - frais)) * totalVerseBrut;
                const remisePct = FRAIS_SOUSC_MAX > 0 ? Math.max(0, (FRAIS_SOUSC_MAX - frais)) / FRAIS_SOUSC_MAX * 100 : 0;
                const totalNet = totalVerseBrut * (1 - frais);
                // Détails (chips lisibles) — le total net est un hero à part
                const details = [
                  { k: 'Versement initial brut', v: nf(inputs.produit === "multi" ? versementsMulti(inputs).vi : inputs.versementInitial), u: '€', c: '#0f766e' },
                  ...(comps.length ? [{ k: 'Versements compl. bruts', v: nf(totalComp), u: '€', sub: comps.map(v => `${nf(Number(v.montant) || 0)} € · année ${v.annee}`).join('\n'), c: '#b8924e' }] : []),
                  { k: 'Versement mensuel brut', v: nf(inputs.produit === "multi" ? versementsMulti(inputs).vm : inputs.versementMensuel), u: '€/m', c: '#0369a1' },
                  { k: 'Durée', v: `${N}`, u: 'ans', c: '#1c2735' },
                  { k: 'Rendement médian', v: (sim.rdtMed * 100).toFixed(2).replace('.', ','), u: '%', c: '#047857' },
                  { k: "Frais d'entrée", v: (frais * 100).toFixed(2).replace('.', ','), u: '%', sub: remiseEur > 0 ? `Remise ${remisePct.toFixed(0)} % soit ${nf(remiseEur)} € d'économie` : null, c: '#b45309' },
                  ...(inputs.produit === "multi" && (sim.multi?.per?.fiscPER?.ecoFiscEntree || 0) > 0 ? [{ k: "Réduction d'impôt PER", v: nf(sim.multi.per.fiscPER.ecoFiscEntree), u: '€', c: '#6d28d9' }] : []),
                ];
                return (
                  <div className="pres-cmp-card" style={{ marginTop: '4mm', padding: '4mm 5mm 4.5mm' }}>
                    <div className="cmp-title">Hypothèses retenues</div>
                    {/* Détails — chips colorés, contenu centré */}
                    <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '3mm', marginTop: '3mm' }}>
                      {details.map((it, idx) => (
                        <div key={idx} style={{ flex: '0 0 30%', minWidth: '44mm', minHeight: '23mm', background: `${it.c}0d`, border: `1px solid ${it.c}44`, borderRadius: '2.5mm', padding: '2.6mm 3.5mm', textAlign: 'center', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center' }}>
                          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '6.4pt', letterSpacing: '0.16em', textTransform: 'uppercase', color: it.c, fontWeight: 700, lineHeight: 1.3 }}>{it.k}</div>
                          <div style={{ fontFamily: "'Fraunces','Playfair Display',serif", fontSize: '15pt', fontWeight: 700, color: '#0a0908', lineHeight: 1, fontVariantNumeric: 'tabular-nums', marginTop: '1.5mm', whiteSpace: 'nowrap' }}>
                            {it.v}<span style={{ fontSize: '8pt', fontWeight: 500, color: '#78716c', marginLeft: '1.5px' }}>{it.u}</span>
                          </div>
                          {it.sub && <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '5.8pt', fontWeight: 700, color: '#b45309', letterSpacing: '0.02em', marginTop: '1.5mm', whiteSpace: 'pre-line', lineHeight: 1.5, display: 'inline-block', textAlign: 'left' }}>{it.sub}</div>}
                        </div>
                      ))}
                    </div>
                    {/* HERO — Total net versé (EN BAS) */}
                    <div style={{ marginTop: '3.5mm', borderRadius: '2.5mm', background: 'linear-gradient(120deg,#065f46 0%,#047857 55%,#10b981 100%)', padding: '3mm 6mm', display: 'flex', alignItems: 'center', justifyContent: 'space-between', boxShadow: '0 3mm 8mm -6mm rgba(4,120,87,0.5)' }}>
                      <div>
                        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '7pt', letterSpacing: '0.24em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.85)', fontWeight: 700 }}>Total net versé</div>
                        <div style={{ fontSize: '7.5pt', color: 'rgba(255,255,255,0.7)', marginTop: '0.8mm' }}>net de frais d'entrée · investi réellement</div>
                      </div>
                      <div style={{ fontFamily: "'Fraunces','Playfair Display',serif", fontSize: '22pt', fontWeight: 800, color: '#fff', letterSpacing: '-0.02em', lineHeight: 1 }}>{nf(totalNet)}<span style={{ fontSize: '11pt', fontWeight: 600, opacity: 0.85, marginLeft: '2px' }}>€</span></div>
                    </div>
                  </div>
                );
              })()}

              {/* Chart Chart.js (canvas) — réplique du graphique de l'onglet Présentation */}
              <div className="pres-cmp-card" style={{marginTop:'4mm', padding:'4mm 5mm 5mm'}}>
                <div className="cmp-title">Évolution comparée · Capital & scenarii</div>
                <div style={{width:'100%', height:'42mm', position:'relative'}}>
                  <canvas ref={printChartRef}></canvas>
                </div>
                <div style={{display:'none'}}>
                <svg viewBox={`0 0 ${chartW} ${chartH}`} style={{width:'100%', height:'auto', maxHeight:'80mm'}}>
                  {/* Gridlines horizontales (montants — niveaux d'amplitude sur l'axe Y) */}
                  {[0.25, 0.5, 0.75, 1].map((p, i) => (
                    <g key={`gh-${i}`}>
                      <line x1={padL} y1={padT + (1-p)*(chartH-padT-padB)} x2={chartW-padR} y2={padT + (1-p)*(chartH-padT-padB)} stroke="rgba(10,9,8,0.08)" strokeWidth="0.5"/>
                      <text x={padL-6} y={padT + (1-p)*(chartH-padT-padB) + 3} textAnchor="end" fontSize="7.5" fill="#a8a29e" fontFamily="JetBrains Mono" letterSpacing="1">{fmtEURc(p*yMax)}</text>
                    </g>
                  ))}
                  {/* Gridlines verticales (années — séparateurs au niveau des labels d'années) */}
                  {[0, Math.floor(N/4), Math.floor(N/2), Math.floor(N*3/4), N].map((y, i) => (
                    <g key={`gv-${i}`}>
                      <line x1={xs(y)} y1={padT} x2={xs(y)} y2={chartH-padB} stroke="rgba(10,9,8,0.06)" strokeWidth="0.5" strokeDasharray="2 3"/>
                      <text x={xs(y)} y={chartH-padB+14} textAnchor="middle" fontSize="7.5" fill="#57534e" fontFamily="JetBrains Mono" letterSpacing="1.5" fontWeight="600">AN {y}</text>
                    </g>
                  ))}
                  {/* Axe X et Y (lignes plus marquées) */}
                  <line x1={padL} y1={padT} x2={padL} y2={chartH-padB} stroke="rgba(10,9,8,0.18)" strokeWidth="0.6"/>
                  <line x1={padL} y1={chartH-padB} x2={chartW-padR} y2={chartH-padB} stroke="rgba(10,9,8,0.18)" strokeWidth="0.6"/>
                  <path d={pathTunnel} fill="rgba(139, 111, 29, 0.08)" stroke="none"/>
                  <path d={pathOpt} fill="none" stroke="rgba(4, 120, 87, 0.55)" strokeWidth="1.2" strokeDasharray="3 3"/>
                  <path d={pathPess} fill="none" stroke="rgba(180, 83, 9, 0.55)" strokeWidth="1.2" strokeDasharray="3 3"/>
                  <path d={pathLiv} fill="none" stroke={isPER ? "rgba(13, 148, 136, 0.85)" : "rgba(120, 113, 108, 0.65)"} strokeWidth={isPER ? "1.6" : "1.2"} strokeDasharray={isPER ? "4 4" : "6 4"}/>
                  <path d={pathMed} fill="none" stroke="#0a0908" strokeWidth="2.6"/>
                  {[
                    { v: finalOpt, lbl: 'OPTIMISTE', color: 'rgba(4, 120, 87, 0.9)' },
                    { v: finalSolution, lbl: isPER ? 'PER SEUL' : 'MÉDIAN', color: '#0a0908', bold: true },
                    { v: finalPess, lbl: 'PESSIMISTE', color: 'rgba(180, 83, 9, 0.9)' },
                    { v: finalLivret, lbl: isPER ? 'PER + IR' : livretNom.toUpperCase(), color: isPER ? '#047857' : '#78716c', bold: isPER },
                  ].sort((a,b) => ys(a.v) - ys(b.v)).map((it, i, arr) => {
                    let y = ys(it.v);
                    if (i > 0) {
                      const prev = arr[i-1];
                      const prevY = (prev.__y || ys(prev.v));
                      if (y - prevY < 18) y = prevY + 18;
                    }
                    it.__y = y;
                    // Boîtes agrandies pour accueillir « PER + RÉINTÉGRATION » + lisibilité accrue des montants
                    const w = it.bold ? 150 : 145;
                    const h = it.bold ? 18 : 16;
                    return (
                      <g key={i}>
                        <line x1={xs(N)} y1={ys(it.v)} x2={xs(N)+4} y2={y} stroke={it.color} strokeWidth="0.6"/>
                        <rect x={xs(N)+5} y={y-h/2} width={w} height={h} rx={it.bold ? 1 : 0} fill={it.color}/>
                        <text x={xs(N)+9} y={y + (it.bold ? 4 : 3.5)} fontSize={it.bold ? 10 : 9} fill="#f7f3ed" fontWeight={it.bold ? 700 : 600} fontFamily="JetBrains Mono" letterSpacing={it.bold ? "0.3" : "0.5"}>{fmtEURc(it.v)} · {it.lbl}</text>
                      </g>
                    );
                  })}
                </svg>
                </div>
              </div>

              {/* 3 modules dashboard : Multiplicateur · Allocation · (Rente AV/PER ou Net après IS Capi) — espacement homogène */}
              <div className="pres-modules-row" style={{gridTemplateColumns:'1fr 1.1fr 1fr', marginTop:'2mm', marginBottom:'0'}}>
                {/* DONUT Multiplicateur — cercle agrandi + ligne Figara + chiffres plus gros */}
                {(() => {
                  // En mode PER : on affiche le multiplicateur avec ET sans réintégration
                  const multipleSeul = finalSolution / Math.max(1, totalVerseBrut);
                  const multipleReinv = finalLivret / Math.max(1, totalVerseBrut);  // finalLivret = PER + Réintégration en mode PER
                  if (isPER) {
                    const r = 34, c = 2 * Math.PI * r;
                    const pct1 = Math.min(100, Math.max(0, (multipleSeul - 1) / 2 * 100));
                    const pct2 = Math.min(100, Math.max(0, (multipleReinv - 1) / 2 * 100));
                    return (
                      <div className="pres-donut-card" style={{display:'flex', flexDirection:'column'}}>
                        <div className="dn-tag" style={{textAlign:'center'}}>Multiplicateur</div>
                        <FigaraRule style={{margin:'0 0 2mm'}}/>
                        {/* 2 donuts — label + donut dans la même colonne, côte à côte */}
                        <div style={{display:'flex', gap:'3mm', justifyContent:'center', alignItems:'center', marginTop:'0'}}>
                          {/* PER seul */}
                          <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:'1mm'}}>
                            <div style={{fontSize:'6.5pt', textTransform:'uppercase', letterSpacing:'0.10em', fontWeight:700, color:'#57534e', textAlign:'center', lineHeight:1}}>PER seul</div>
                            <svg width="54" height="54" viewBox="0 0 100 100" style={{display:'block'}}>
                              <g transform="rotate(-90 50 50)">
                                <circle cx="50" cy="50" r={r} fill="none" stroke="#f5f5f4" strokeWidth="9"/>
                                <circle cx="50" cy="50" r={r} fill="none" stroke="#57534e" strokeWidth="9" strokeLinecap="round" strokeDasharray={`${(pct1/100)*c} ${c}`}/>
                              </g>
                              <text x="50" y="50" textAnchor="middle" dominantBaseline="central"
                                fontFamily="Fraunces, 'Playfair Display', serif" fontSize="20" fontWeight="800" fill="#0a0908" letterSpacing="-0.5">×{multipleSeul.toFixed(2)}</text>
                            </svg>
                          </div>
                          {/* PER + IR */}
                          <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:'1mm'}}>
                            <div style={{fontSize:'6.5pt', textTransform:'uppercase', letterSpacing:'0.10em', fontWeight:700, color:'#047857', textAlign:'center', lineHeight:1}}>PER + IR</div>
                            <svg width="54" height="54" viewBox="0 0 100 100" style={{display:'block'}}>
                              <g transform="rotate(-90 50 50)">
                                <circle cx="50" cy="50" r={r} fill="none" stroke="#f5f5f4" strokeWidth="9"/>
                                <circle cx="50" cy="50" r={r} fill="none" stroke="#047857" strokeWidth="9" strokeLinecap="round" strokeDasharray={`${(pct2/100)*c} ${c}`}/>
                              </g>
                              <text x="50" y="50" textAnchor="middle" dominantBaseline="central"
                                fontFamily="Fraunces, 'Playfair Display', serif" fontSize="20" fontWeight="800" fill="#047857" letterSpacing="-0.5">×{multipleReinv.toFixed(2)}</text>
                            </svg>
                          </div>
                        </div>
                        <div className="dn-foot" style={{marginTop:'2mm', paddingTop:'2mm', textAlign:'center', fontSize:'6.5pt', lineHeight:1.4}}>
                          Pour <strong style={{color:'#0a0908'}}>{fmtEURc(totalVerseBrut)}</strong> versés :<br/>
                          PER : <strong style={{color:'#0a0908'}}>{fmtEURc(finalSolution)}</strong> · PER + IR : <strong style={{color:'#047857'}}>{fmtEURc(finalLivret)}</strong>
                        </div>
                      </div>
                    );
                  }
                  // AV / Capi : donut unique
                  const multiple = multipleSeul;
                  const pct = Math.min(100, Math.max(0, (multiple - 1) / 2 * 100));
                  const r = 44, c = 2 * Math.PI * r;
                  const dash = (pct / 100) * c;
                  return (
                    <div className="pres-donut-card">
                      <div className="dn-tag">Multiplicateur</div>
                      <FigaraRule style={{margin:'0 0 4mm'}}/>
                      <div style={{display:'flex', justifyContent:'center', margin:'2mm 0 2mm'}}>
                        <svg width="124" height="124" viewBox="0 0 124 124">
                          <g transform="rotate(-90 62 62)">
                            <circle cx="62" cy="62" r={r} fill="none" stroke="#f5f5f4" strokeWidth="10"/>
                            <circle cx="62" cy="62" r={r} fill="none" stroke="#047857" strokeWidth="10" strokeLinecap="round" strokeDasharray={`${dash} ${c}`}/>
                          </g>
                          <text x="62" y="58" textAnchor="middle" dominantBaseline="central"
                            fontFamily="Fraunces, 'Playfair Display', serif" fontSize="22" fontWeight="800" fill="#047857"
                            letterSpacing="-0.5">×{multiple.toFixed(2)}</text>
                          <text x="62" y="76" textAnchor="middle" dominantBaseline="central"
                            fontFamily="Inter, sans-serif" fontSize="8" fontWeight="600" fill="#78716c"
                            letterSpacing="0.3">capital versé</text>
                        </svg>
                      </div>
                      <div className="dn-foot">
                        Pour <strong style={{color:'#0a0908'}}>{fmtEURc(totalVerseBrut)}</strong> versés,<br/>vous récupérez <strong style={{color:'#047857'}}>{fmtEURc(finalSolution)}</strong>.
                      </div>
                    </div>
                  );
                })()}

                {/* DONUT Allocation + rendements */}
                {(() => {
                  const r = 28, c = 2 * Math.PI * r;
                  let cumulOffset = 0;
                  return (
                    <div className="pres-alloc-card">
                      <div className="al-tag">Allocation des supports</div>
                      <FigaraRule style={{margin:'0 0 4mm'}}/>
                      <div className="al-body">
                        <svg width="72" height="72" viewBox="0 0 72 72" style={{transform:'rotate(-90deg)'}}>
                          <circle cx="36" cy="36" r={r} fill="none" stroke="#f5f5f4" strokeWidth="9"/>
                          {allocBar.map((s, idx) => {
                            const seg = s.poids * c;
                            const offset = -cumulOffset;
                            cumulOffset += seg;
                            return <circle key={s.id} cx="36" cy="36" r={r} fill="none" stroke={SUPPORT_META[s.type].color} strokeWidth="9" strokeDasharray={`${seg} ${c}`} strokeDashoffset={offset} strokeLinecap="butt"/>;
                          })}
                        </svg>
                        <div className="al-supports">
                          {allocBar.map(s => (
                            <div key={s.id} className="al-supp-row">
                              <span className="lft"><span className="sw" style={{background: SUPPORT_META[s.type].color}}></span><span className="nm">{SUPPORT_META[s.type].label}</span></span>
                              <span className="pc">{(s.poids*100).toFixed(0)}<span className="unit">%</span></span>
                            </div>
                          ))}
                        </div>
                      </div>
                      {/* Bandeau Hypothèses de rendement avec SRI mis en valeur sur la même ligne */}
                      <div className="al-rdt">
                        <div className="al-rdt-tag" style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:'2mm'}}>
                          <span>Hypothèses de rendement</span>
                          <span style={{display:'inline-flex', alignItems:'baseline', gap:'2px', padding:'1mm 2mm', background:'#fafaf9', border:'0.5pt solid '+SRI_COLORS[Math.round(sim.sri)], borderRadius:'1.5mm'}}>
                            <span style={{fontSize:'5.5pt', color:'#57534e', fontWeight:600}}>SRI</span>
                            <span style={{fontFamily:"'Fraunces','Playfair Display',serif", fontSize:'10pt', fontWeight:800, color: SRI_COLORS[Math.round(sim.sri)], letterSpacing:'-0.01em'}}>{sim.sri.toFixed(1)}</span>
                            <span style={{fontSize:'6pt', color:'#78716c'}}>/7</span>
                          </span>
                        </div>
                        <div className="al-rdt-cells">
                          <div className="al-rdt-cell pess">
                            <div className="lab">Pess.</div>
                            <div className="val">{fmtPCT(sim.rdtPess).replace(' %','')}<span style={{fontSize:'7pt'}}>%</span></div>
                          </div>
                          <div className="al-rdt-cell med">
                            <div className="lab">Médian</div>
                            <div className="val">{fmtPCT(sim.rdtMed).replace(' %','')}<span style={{fontSize:'7pt'}}>%</span></div>
                          </div>
                          <div className="al-rdt-cell opt">
                            <div className="lab">Opt.</div>
                            <div className="val">{fmtPCT(sim.rdtOpt).replace(' %','')}<span style={{fontSize:'7pt'}}>%</span></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })()}

                {/* RENTE compteur (caché pour Capi PM — pas pertinent) */}
                {!isCapi ? (() => {
                  // Rente perpétuelle = capital × taux mensuel équivalent
                  const tm = sim.rdt > 0 ? (Math.pow(1 + sim.rdt, 1/12) - 1) : 0;
                  const renteSeulMois = finalSolution > 0 ? finalSolution * tm : 0;
                  const renteReinvMois = isPER && finalLivret > 0 ? finalLivret * tm : 0;
                  if (isPER) {
                    return (
                      <div className="pres-rente-card" style={{display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center'}}>
                        <div className="rt-tag" style={{textAlign:'center'}}>Rente à vie</div>
                        <FigaraRule style={{width:'100%', margin:'0 0 2mm'}}/>
                        {/* Deux blocs verticaux compacts — valeurs centrées */}
                        <div style={{display:'flex', flexDirection:'column', gap:'1.5mm', width:'100%', marginTop:'1mm'}}>
                          <div style={{padding:'1.5mm 2.5mm', border:'1px solid rgba(120,113,108,0.30)', borderRadius:'1.5mm', background:'rgba(245,245,244,0.45)', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'2mm'}}>
                            <div style={{fontSize:'6.5pt', textTransform:'uppercase', letterSpacing:'0.10em', fontWeight:700, color:'#57534e'}}>PER seul</div>
                            <div style={{fontFamily:"'Fraunces','Playfair Display',serif", fontSize:'13pt', fontWeight:800, color:'#0a0908', letterSpacing:'-0.02em', lineHeight:1}}>{fmtEUR(renteSeulMois)}<span style={{fontSize:'6.5pt', color:'#78716c', marginLeft:'1mm', fontWeight:500}}>/mois</span></div>
                          </div>
                          <div style={{padding:'1.5mm 2.5mm', border:'2px solid #047857', borderRadius:'1.5mm', background:'linear-gradient(180deg, rgba(236,253,245,0.65) 0%, #ffffff 100%)', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'2mm'}}>
                            <div style={{fontSize:'6.5pt', textTransform:'uppercase', letterSpacing:'0.10em', fontWeight:700, color:'#047857'}}>PER + IR</div>
                            <div style={{fontFamily:"'Fraunces','Playfair Display',serif", fontSize:'13pt', fontWeight:800, color:'#047857', letterSpacing:'-0.02em', lineHeight:1}}>{fmtEUR(renteReinvMois)}<span style={{fontSize:'6.5pt', color:'#047857', marginLeft:'1mm', fontWeight:500}}>/mois</span></div>
                          </div>
                        </div>
                        <div style={{marginTop:'2mm', paddingTop:'1.5mm', width:'100%', fontSize:'6.5pt', color:'#57534e', textAlign:'center', fontStyle:'italic', lineHeight:1.4, borderTop:'1px solid rgba(167,243,208,0.6)'}}>
                          Annuel : {fmtEUR(renteSeulMois*12)} vs <strong style={{color:'#047857', fontStyle:'normal'}}>{fmtEUR(renteReinvMois*12)}</strong> · Capital préservé
                        </div>
                      </div>
                    );
                  }
                  const renteMois = renteSeulMois;
                  const renteAn = renteMois * 12;
                  const rente20 = renteAn * 20;
                  return (
                    <div className="pres-rente-card" style={{display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center'}}>
                      <div className="rt-tag">Rente brute à vie</div>
                      <FigaraRule style={{width:'100%', margin:'0 0 4mm'}}/>
                      <div style={{marginTop:'5mm', textAlign:'center'}}>
