    // FISCALITÉ — barème progressif (imposition 2026 sur revenus 2025, impots.gouv.fr)
    // et calcul automatique des parts fiscales (quotient familial, tous cas usuels).
    // ============================================================
    const NC_BAREME_IR = [
      { max: 11600, taux: 0 },
      { max: 29579, taux: 0.11 },
      { max: 84577, taux: 0.30 },
      { max: 181917, taux: 0.41 },
      { max: Infinity, taux: 0.45 },
    ];
    // Plafonnement du quotient familial (art. 197-2 CGI) : l'avantage en impôt procuré par
    // les demi-parts qui s'ajoutent aux parts « de base » (1 célibataire / 2 couple) est
    // limité à ce montant PAR DEMI-PART. Sans ce plafond l'IR des foyers aisés avec enfants
    // était sous-estimé (≈ −15 %), ce qui gonflait mécaniquement l'économie d'impôt d'un PER.
    const NC_PLAFOND_DEMI_PART = 1807;
    // Plafond de déduction épargne retraite 2026 (PASS 2026 = 47 100 €) :
    // plancher = 10 % du PASS, plafond = 10 % de 8 PASS.
    const PER_PLAFOND_MIN = 4710, PER_PLAFOND_MAX = 37680;
    // Décote (art. 197 I-4 CGI) — imposition 2026 sur revenus 2025.
    // Son absence doublait l'IR affiché sur les revenus modestes.
    const NC_DECOTE_SEUIL_CELIB = 1982, NC_DECOTE_SEUIL_COUPLE = 3277;
    const NC_DECOTE_BASE_CELIB = 897, NC_DECOTE_BASE_COUPLE = 1483, NC_DECOTE_TAUX = 0.4525;
    // Impôt brut au barème pour un nombre de parts donné (sans plafonnement ni décote).
    function ncBaremeFoyer(rni, parts) {
      if (!(rni > 0) || !(parts > 0)) return 0;
      const qf = rni / parts;
      let impotPart = 0, prev = 0;
      for (const t of NC_BAREME_IR) { impotPart += Math.max(0, Math.min(qf, t.max) - prev) * t.taux; prev = t.max; }
      return impotPart * parts;
    }
    // Taux de remplacement net a la retraite (reference cabinet — salaries, carriere
    // complete, cf. references reversion-et-retraite) : proche SMIC > 70 %, salaires
    // moyens (2 000-3 000 net/mois) ~60 %, au-dela ~50 %, hauts revenus 45 %.
    const ncTauxRemplacement = (m) => (!(m > 0) ? 0 : m <= 2000 ? 0.70 : m <= 3000 ? 0.60 : m <= 5000 ? 0.50 : 0.45);
    // Pictos des objectifs / préconisations en synthèse : choisis par le contenu de la ligne.
    const NcPicto = ({ texte, c }) => {
      const t = (texte || "").toLowerCase();
      const stroke = { fill: "none", stroke: c, strokeWidth: 1.9, strokeLinecap: "round", strokeLinejoin: "round" };
      let path;
      if (/épargne mensuelle|epargne mensuelle|versements mensuels|capital/.test(t)) path = (<g {...stroke}><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 10c0-1.1 1.1-1.8 2.5-1.8s2.5.7 2.5 1.8-1.1 1.6-2.5 1.9c-1.4.3-2.5.8-2.5 1.9s1.1 1.8 2.5 1.8 2.5-.7 2.5-1.8"/></g>);
      else if (/locatif|immobilier|endettement|emprunt/.test(t)) path = (<g {...stroke}><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v8.5h11V10"/><path d="M10.5 18.5v-4.5h3v4.5"/></g>);
      else if (/pension|retraite|revenus complémentaires|info-retraite/.test(t)) path = (<g {...stroke}><circle cx="12" cy="12" r="4"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18"/></g>);
      else if (/assurance-vie|contrat|audit/.test(t)) path = (<g {...stroke}><path d="M12 4.5 5.5 7v5c0 4 2.8 6.6 6.5 7.5 3.7-.9 6.5-3.5 6.5-7.5V7L12 4.5Z"/><path d="m9.3 12 2 2 3.4-3.6"/></g>);
      else if (/per|tranche|fiscal|impôt|impot/.test(t)) path = (<g {...stroke}><path d="M17 7 7 17"/><circle cx="8.3" cy="8.3" r="1.9"/><circle cx="15.7" cy="15.7" r="1.9"/></g>);
      else if (/protéger|héritiers|protection|prévoyance/.test(t)) path = (<g {...stroke}><path d="M12 4.5 5.5 7v5c0 4 2.8 6.6 6.5 7.5 3.7-.9 6.5-3.5 6.5-7.5V7L12 4.5Z"/></g>);
      else path = (<g {...stroke}><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></g>);
      return (
        <span className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" style={{ background: `color-mix(in srgb, ${c} 11%, white)`, border: `1px solid color-mix(in srgb, ${c} 35%, white)` }}>
          <svg width="15" height="15" viewBox="0 0 24 24">{path}</svg>
        </span>
      );
    };
    // Taux d'epargne moyen des menages en France (INSEE : 18,3 % du revenu disponible
    // en 2025, 17,9 % debut 2026) — reference pedagogique affichee en synthese.
    const NC_EPARGNE_MOYENNE_FR = 0.18;
    const NC_BAREME_COLORS = ["#94a3b8", "#0f766e", "#b8924e", "#dc2626", "#7c2d12"];
    // Parts du foyer : 1 (ou 2 en couple) + 0,5 par enfant (1 à partir du 3e),
    // moitié pour la garde alternée ; veuf avec enfant à charge = régime des mariés ;
    // demi-parts supplémentaires (parent isolé case T, invalidité, carte du combattant).
    function ncCalcParts(d) {
      const couple = d.situation === "marie" || d.situation === "pacse";
      // Robuste aux anciens formats : on compte les enfants dès qu'ils existent,
      // et une charge absente/ancienne (« oui ») est traitée comme « à charge 100 % ».
      const enfants = (d.enfants && d.enfants.length) ? d.enfants : [];
      const chargeOf = (e) => { const c = e && e.charge; return (!c || c === "oui") ? "100" : c; };
      const pleins = enfants.filter(e => chargeOf(e) === "100" || chargeOf(e) === "majeur_rattache").length;
      const alternes = enfants.filter(e => chargeOf(e) === "alternee").length;
      const nonCharge = enfants.length - pleins - alternes;
      const detail = [];
      let base = couple ? 2 : 1;
      if (d.situation === "veuf" && (pleins + alternes) > 0) {
        base = 2; detail.push({ l: "Veuf(ve) avec enfant à charge — régime des mariés", p: 2 });
      } else {
        detail.push({ l: couple ? "Couple marié / pacsé" : "Célibataire, divorcé(e), veuf(ve) ou union libre", p: base });
      }
      let parts = base, rang = 0;
      const lPleins = enfants.filter(e => chargeOf(e) === "100" || chargeOf(e) === "majeur_rattache");
      const lAlternes = enfants.filter(e => chargeOf(e) === "alternee");
      for (let i = 0; i < pleins; i++) { rang++; const p = rang <= 2 ? 0.5 : 1; parts += p; detail.push({ l: `Enfant ${rang} à charge`, p }); }
      for (let i = 0; i < alternes; i++) { rang++; const p = rang <= 2 ? 0.25 : 0.5; parts += p; detail.push({ l: `Enfant ${rang} — garde alternée`, p }); }
      if (nonCharge > 0) detail.push({ l: `${nonCharge} enfant${nonCharge > 1 ? "s" : ""} non à charge (pas de part)`, p: 0 });
      // Demi-part supplémentaire par enfant à charge titulaire de la carte mobilité inclusion
      // « invalidité » (art. 195-2 CGI) — un quart de part seulement en garde alternée.
      const nomEnf = (e, i) => (e.prenom || "").trim() || `Enfant ${i + 1}`;
      lPleins.forEach((e, i) => { if (e.handicap === "oui") { parts += 0.5; detail.push({ l: `${nomEnf(e, i)} — situation de handicap (art. 195-2 CGI)`, p: 0.5 }); } });
      lAlternes.forEach((e, i) => { if (e.handicap === "oui") { parts += 0.25; detail.push({ l: `${nomEnf(e, i)} — handicap, garde alternée`, p: 0.25 }); } });
      const nbHandicap = enfants.filter(e => e.handicap === "oui" && chargeOf(e) !== "non").length;
      (d.demiParts || []).forEach(x => {
        if (x === "isole") {
          if (couple || (pleins + alternes) === 0) return; // case T réservée aux parents isolés avec enfant
          const p = pleins > 0 ? 0.5 : 0.25;
          parts += p; detail.push({ l: "Parent isolé (case T)", p });
        } else {
          const map = { invalide: "Invalidité (client ou conjoint)", charge_invalide: "Personne à charge invalide", combattant: "Carte du combattant / + de 74 ans" };
          parts += 0.5; detail.push({ l: map[x] || x, p: 0.5 });
        }
      });
      return { parts: Math.round(parts * 100) / 100, detail, nbEnfants: pleins + alternes, nbHandicap, couple };
    }
    // Impôt au barème : QF = RNI / parts → impôt par part → × parts. TMI = tranche du QF.
    function ncCalcIR(rni, parts, couple) {
      if (!rni || !parts) return null;
      const estCouple = couple === undefined ? parts >= 2 : !!couple;
      const qf = rni / parts;
      let impotPart = 0, tmi = 0, prev = 0;
      const tranches = [];
      for (const t of NC_BAREME_IR) {
        const dansTranche = Math.max(0, Math.min(qf, t.max) - prev);
        impotPart += dansTranche * t.taux;
        tranches.push({ de: prev, a: t.max, taux: t.taux, montant: dansTranche });
        if (qf > prev) tmi = t.taux;
        prev = t.max;
      }
      const impotQF = impotPart * parts;
      // Plafonnement du quotient familial : on compare l'impôt avec les parts réelles à
      // l'impôt calculé sur les seules parts de base ; l'écart (l'« avantage ») ne peut
      // dépasser 1 807 € par demi-part supplémentaire.
      const partsBase = estCouple ? 2 : 1;
      const demiPartsSupp = Math.max(0, Math.round((parts - partsBase) * 2 * 100) / 100);
      let impotPlaf = impotQF, plafonnement = 0;
      if (demiPartsSupp > 0) {
        const impotBase = ncBaremeFoyer(rni, partsBase);
        const avantage = impotBase - impotQF;
        const plafond = demiPartsSupp * NC_PLAFOND_DEMI_PART;
        if (avantage > plafond) { impotPlaf = impotBase - plafond; plafonnement = avantage - plafond; }
      }
      // Décote : elle s'applique après plafonnement, sur l'impôt issu du barème.
      const seuilDec = estCouple ? NC_DECOTE_SEUIL_COUPLE : NC_DECOTE_SEUIL_CELIB;
      const baseDec  = estCouple ? NC_DECOTE_BASE_COUPLE  : NC_DECOTE_BASE_CELIB;
      const decote = impotPlaf > 0 && impotPlaf < seuilDec
        ? Math.min(impotPlaf, Math.max(0, baseDec - NC_DECOTE_TAUX * impotPlaf))
        : 0;
      const impotFoyer = Math.round(Math.max(0, impotPlaf - decote));
      return { qf: Math.round(qf), impotPart: Math.round(impotPart), impotFoyer, tmi,
               tauxMoyen: rni > 0 ? impotFoyer / rni : 0, tranches,
               impotBrutQF: Math.round(impotQF), plafonnementQF: Math.round(plafonnement),
               decote: Math.round(decote), couple: estCouple };
    }
    // ===== Revenus locatifs : régimes fiscaux retenus dans le calcul =====
    // Chaque régime dit ce qui est réellement ajouté au revenu imposable.
    // L'hypothèse est toujours affichée à l'écran et peut être corrigée logement par logement.
    const NC_REG_LOC = {
      micro_foncier: { l: "Micro-foncier",        part: 0.70, note: "abattement forfaitaire 30 % — plafond 15 000 € de loyers bruts (art. 32 CGI)" },
      reel_foncier:  { l: "Foncier réel (2044)",  part: 0.70, note: "charges réelles déductibles — hypothèse 30 %, à corriger avec la 2044" },
      micro_bic:     { l: "Micro-BIC (LMNP)",     part: 0.50, note: "abattement forfaitaire 50 % — plafond 77 700 € (art. 50-0 CGI)" },
      reel_bic:      { l: "BIC réel (LMNP amort.)", part: 0.00, note: "amortissements : résultat imposable supposé nul — à corriger avec la liasse 2031" },
      exonere:       { l: "Non imposé",           part: 0.00, note: "exclu du calcul à votre demande" },
    };
    // Régime retenu par défaut selon nu / meublé / géré et les plafonds de micro.
    function ncRegimeLoc(l, loyerAnnuel, totalNuAnnuel) {
      if (l && l.regime && NC_REG_LOC[l.regime]) return l.regime;              // choix manuel du conseiller
      if (l && l.type === "meublee") {
        if (l.gere === "gere") return "reel_bic";                              // résidence gérée / bail commercial : réel + amortissements
        return loyerAnnuel > 77700 ? "reel_bic" : "micro_bic";
      }
      return totalNuAnnuel > 15000 ? "reel_foncier" : "micro_foncier";
    }
    // Détail complet du revenu net imposable : une ligne par revenu, avec la base saisie,
    // la méthode appliquée et le montant retenu. Sert à la fois au calcul et à l'affichage.
    function ncDetailRNI(d) {
      const lignes = [];
      const eur = (n) => new Intl.NumberFormat('fr-FR').format(Math.round(n || 0));
      const nomDe = (who) => who === "conjoint" ? "Conjoint" : (d.civilite === "Mme" ? "Madame" : "Monsieur");
      const per = (pd, who) => {
        if (!pd) return; const has = (v) => ((pd.activites) || []).includes(v);
        if (has("salarie")) {
          const sal = pd.actSalarie || {}; const coef = sal.statut === "cadre" ? 0.75 : 0.78; const m = ncInt(sal.montant);
          if (m) {
            const nbM = parseInt(sal.nbMois, 10) || 12;
            const brut = sal.periode === "mois" ? m * nbM : m;
            const net = (sal.mode === "brut" ? brut * coef : brut) * 0.9;
            lignes.push({ cat: "activite", label: `Salaire — ${nomDe(who)}`, brut,
              methode: `${sal.periode === "mois" ? `${eur(m)} €/mois × ${nbM} mois` : "montant annuel"} · ${sal.mode === "brut" ? `brut → net imposable × ${String(coef).replace(".", ",")} (${sal.statut === "cadre" ? "cadre" : "non-cadre"})` : "net déclaré"} · − 10 % frais professionnels`,
              net });
          }
          if (sal.variableQ === "oui" && sal.variableMode !== "dont") {
            const vb = sal.variableBrutNet || sal.mode;
            const kPerV = sal.variablePeriode === "mois" ? 12 : 1;
            const v0 = ncInt(sal.variableN1) * kPerV;
            if (v0) lignes.push({ cat: "activite", label: `Part variable / primes — ${nomDe(who)}`, brut: v0,
              methode: `${vb === "brut" ? `brut → net × ${String(coef).replace(".", ",")} · ` : "net · "}− 10 % frais professionnels`,
              net: (vb === "brut" ? v0 * coef : v0) * 0.9 });
          }
        }
        if (has("independant")) { const v = ncInt((pd.actIndependant || {}).n1); if (v) lignes.push({ cat: "activite", label: `Revenus d'indépendant — ${nomDe(who)}`, brut: v, methode: "bénéfice déclaré repris tel quel (pas d'abattement de 10 %)", net: v }); }
        if (has("chef")) { const a = ncMens((pd.actChef || {}).revenu, (pd.actChef || {}).periode) * 12; if (a) lignes.push({ cat: "activite", label: `Rémunération de dirigeant — ${nomDe(who)}`, brut: a, methode: "− 10 % frais professionnels (art. 62 CGI)", net: a * 0.9 }); }
        if (has("fonctionnaire")) { const a = ncMens((pd.actFonctionnaire || {}).revenu, (pd.actFonctionnaire || {}).periode) * 12; if (a) lignes.push({ cat: "activite", label: `Traitement de fonctionnaire — ${nomDe(who)}`, brut: a, methode: "− 10 % frais professionnels", net: a * 0.9 }); }
        if (has("retraite")) { const a = ncMens((pd.actRetraite || {}).revenu, (pd.actRetraite || {}).periode) * 12; if (a) lignes.push({ cat: "activite", label: `Pension de retraite — ${nomDe(who)}`, brut: a, methode: "− 10 % abattement pensions", net: a * 0.9 }); }
        if (has("autre")) { const a = ncMens((pd.actAutre || {}).revenu, (pd.actAutre || {}).periode) * 12; if (a) lignes.push({ cat: "activite", label: `Autres revenus d'activité — ${nomDe(who)}`, brut: a, methode: "repris tel quel (aucun abattement)", net: a }); }
      };
      per(d, "client");
      if (d.conjointQ === "oui") per(d.conjointRev, "conjoint");

      // — Revenus locatifs, logement par logement —
      const locs = (d.locatifs || []);
      const totalNu = locs.filter(l => l.type !== "meublee").reduce((s, l) => s + ncInt(l.loyer) * 12, 0)
        + (d.biens || []).filter(b => b.enLocationQ === "oui").reduce((s, b) => s + ncInt(b.loyer) * 12, 0);
      locs.forEach((l, i) => {
        const annuel = ncInt(l.loyer) * 12;
        // Résultat imposable réel saisi par le conseiller (2044 / 2031) : une saisie vide
        // laisse la place à l'estimation, mais un 0 ou un déficit saisis sont respectés.
        const saisi = l.imposable != null && String(l.imposable).trim() !== "" && String(l.imposable).trim() !== "-";
        const force = saisi ? ncInt(l.imposable) : null;
        if (!annuel && force == null) return;
        const reg = ncRegimeLoc(l, annuel, totalNu);
        const R = NC_REG_LOC[reg];
        lignes.push({
          cat: "foncier", locId: l.id, regime: reg, corrige: force != null,
          label: `${l.type === "meublee" ? (l.gere === "gere" ? "Meublé géré" : l.gere === "non_gere" ? "Meublé non géré" : "Meublé") : l.type === "nue" ? "Location nue" : "Location (type à préciser)"} — ${l.nom || "logement " + (i + 1)}`,
          brut: annuel,
          methode: force != null
            ? (force < 0
                ? `résultat déficitaire saisi (${R.l}) — imputé sur le revenu global dans la limite de 10 700 €/an`
                : `résultat imposable réel saisi (${R.l}) — l'abattement forfaitaire est ignoré`)
            : `${eur(ncInt(l.loyer))} €/mois × 12 · ${R.l} : ${R.note}`,
          net: force != null ? Math.max(force, -10700) : annuel * R.part,
        });
      });
      (d.biens || []).filter(b => b.enLocationQ === "oui" && ncInt(b.loyer)).forEach((b, i) => {
        const annuel = ncInt(b.loyer) * 12;
        const reg = totalNu > 15000 ? "reel_foncier" : "micro_foncier";
        lignes.push({ cat: "foncier", label: `Autre bien loué — ${b.nom || "bien " + (i + 1)} (étape 5)`, brut: annuel, regime: reg,
          methode: `${eur(ncInt(b.loyer))} €/mois × 12 · ${NC_REG_LOC[reg].l} (location nue supposée) : ${NC_REG_LOC[reg].note}`,
          net: annuel * NC_REG_LOC[reg].part });
      });

      if (d.mobiliersQ === "oui" && d.mobiliersExceptionnel !== "oui") {
        const v = ncInt(d.mobiliersN1);
        if (v) lignes.push({ cat: "mobilier", label: "Revenus mobiliers (dividendes, intérêts)", brut: v, methode: "repris tel quel — attention : le plus souvent au PFU 30 % hors barème", net: v });
      }
      if (d.pensionQ === "oui") {
        const p = ncMens(d.pensionPercue, d.pensionPeriode) * 12;
        const vv = ncMens(d.pensionVersee, d.pensionPeriode) * 12;
        if (p) lignes.push({ cat: "pension", label: "Pension alimentaire perçue", brut: p, methode: "− 10 % abattement", net: p * 0.9 });
        if (vv) lignes.push({ cat: "pension", label: "Pension alimentaire versée", brut: -vv, methode: "déduite du revenu global", net: -vv });
      }
      const total = Math.max(0, Math.round(lignes.reduce((s, x) => s + x.net, 0)));
      return { total, lignes: lignes.map(x => ({ ...x, brut: Math.round(x.brut), net: Math.round(x.net) })) };
    }

    // ===== Avantages fiscaux en place =====
    // Deux mécaniques très différentes, qu'on ne mélange pas :
    //  · « deduction » : le versement sort du revenu imposable AVANT le barème (PER, art. 163 quatervicies CGI)
    //    → l'économie vaut TMI × versement et change le quotient familial.
    //  · « reduction » : le montant s'impute sur l'impôt APRÈS le barème (Pinel, dons, emploi à domicile, Girardin…)
    //    → l'économie vaut l'euro pour l'euro, mais ne peut pas rendre l'impôt négatif (hors crédits d'impôt).
    const NC_REDUC_TYPES = [
      { v: "per",             l: "PER — versements déductibles", mode: "deduction", dureeDefaut: "recurrent", aide: "déduit du revenu imposable (plafond épargne retraite) — économie = TMI × versement" },
      { v: "immo_defisc",     l: "Immobilier défiscalisant (Pinel, Malraux, Denormandie…)", mode: "reduction", dureeDefaut: "limitee", dureeSuggeree: 9, aide: "réduction étalée sur l'engagement de location (6, 9 ou 12 ans)" },
      { v: "emploi_domicile", l: "Emploi à domicile", mode: "reduction", dureeDefaut: "recurrent", aide: "crédit d'impôt de 50 % des dépenses, plafonné — reconduit tant que l'emploi dure" },
      { v: "dons",            l: "Dons aux œuvres", mode: "reduction", dureeDefaut: "recurrent", aide: "66 % (ou 75 %) du don, dans la limite de 20 % du revenu imposable" },
      { v: "girardin",        l: "Girardin industriel", mode: "reduction", dureeDefaut: "limitee", dureeSuggeree: 1, aide: "one-shot : la réduction est acquise l'année suivant le versement, elle ne se reconduit pas" },
      { v: "autre",           l: "Autre réduction / crédit", mode: "reduction", dureeDefaut: "recurrent", aide: "" },
    ];
    const NC_REDUC_DEF = (v) => NC_REDUC_TYPES.find(x => x.v === v) || { v, l: v, mode: "reduction", dureeDefaut: "recurrent", aide: "" };
    // Calcul fiscal complet du foyer : revenu → déductions → barème → réductions → impôt net,
    // avec la projection de ce que devient l'impôt quand les avantages à durée limitée s'arrêtent.
    function ncCalcFisc(d, anRef) {
      const an = anRef || new Date().getFullYear();
      const pc = ncCalcParts(d);
      const parts = parseFloat((d.partsFiscales || "").replace(",", ".")) || pc.parts;
      const rniBrut = ncInt(d.rniFoyer) || ncDetailRNI(d).total;
      const actif = d.reductionsQ === "oui";
      const det = d.reductionsDetail || {};
      const lignes = (actif ? (d.reductionsTypes || []) : []).map(v => {
        const T = NC_REDUC_DEF(v), c = det[v] || {};
        const montant = ncInt(c.montant);
        const dureeType = c.dureeType || T.dureeDefaut;
        const duree = dureeType === "limitee" ? (ncInt(c.duree) || T.dureeSuggeree || 0) : null;
        return {
          code: v, libelle: T.l, mode: T.mode, montant, dureeType,
          dureeRestante: duree, anneeFin: duree > 0 ? an + duree - 1 : null,
          note: c.note || "",
        };
      });
      const saisiDetail = lignes.reduce((s, x) => s + x.montant, 0);
      // Anciens dossiers : un total global était saisi sans ventilation par nature.
      const legacy = actif && saisiDetail === 0 ? ncInt(d.reductionsMontant) : 0;
      const somme = (arr, mode) => arr.filter(x => x.mode === mode).reduce((s, x) => s + x.montant, 0);
      const impotDe = (ded, red) => {
        const r = ncCalcIR(Math.max(0, rniBrut - ded), parts, pc.couple);
        return { ir: r, bareme: r ? r.impotFoyer : 0, net: Math.max(0, (r ? r.impotFoyer : 0) - red) };
      };
      const deductions = somme(lignes, "deduction");
      const reductions = somme(lignes, "reduction") + legacy;
      const aujourdhui = impotDe(deductions, reductions);
      const sansRien = impotDe(0, 0);
      // Ce qui subsiste une fois tous les avantages à durée limitée arrivés à terme
      const perennes = lignes.filter(x => x.dureeType !== "limitee");
      const aTerme = impotDe(somme(perennes, "deduction"), somme(perennes, "reduction") + legacy);
      const expirent = lignes.filter(x => x.dureeType === "limitee" && x.montant > 0 && x.anneeFin);
      const annees = [...new Set(expirent.map(x => x.anneeFin))].sort((a, b) => a - b);
      const echeancier = annees.map(y => {
        const restant = lignes.filter(x => x.dureeType !== "limitee" || !x.anneeFin || x.anneeFin > y);
        const apres = impotDe(somme(restant, "deduction"), somme(restant, "reduction") + legacy);
        return {
          annee: y,
          avantagesPerdus: expirent.filter(x => x.anneeFin === y).map(x => ({ code: x.code, libelle: x.libelle, montant: x.montant, mode: x.mode })),
          montantPerdu: expirent.filter(x => x.anneeFin === y).reduce((s, x) => s + x.montant, 0),
          impotApres: apres.net, surcout: apres.net - aujourdhui.net,
        };
      });
      return {
        parts, rniBrut, deductions, baseImposable: Math.max(0, rniBrut - deductions),
        ir: aujourdhui.ir, impotBareme: aujourdhui.bareme, reductions, impotNet: aujourdhui.net,
        tmi: aujourdhui.ir ? aujourdhui.ir.tmi : 0,
        tauxMoyen: rniBrut > 0 ? aujourdhui.net / rniBrut : 0,
        gainDeduction: sansRien.bareme - aujourdhui.bareme,
        gainTotal: sansRien.net - aujourdhui.net,
        impotSansAvantage: sansRien.net,
        impotATerme: aTerme.net, surcoutATerme: aTerme.net - aujourdhui.net,
        lignes, legacy, echeancier,
        prochaineExpiration: echeancier.length ? echeancier[0] : null,
      };
    }
    // ============================================================
    // SYNTHÈSE D'AUDIT — moteur narratif
    // Le dossier brut ne parle pas au client. Ce moteur en tire :
    //   1. un résumé de la situation en quelques phrases,
    //   2. les forces (ce qui est déjà en place et qu'il faut préserver),
    //   3. les faiblesses (les angles morts du dossier),
    //   4. et surtout des PROBLÉMATIQUES : constat → conséquence chiffrée →
    //      préconisation. C'est la conséquence chiffrée qui donne au client
    //      l'envie de trouver une solution.
    // ============================================================
    function ncSynthese(d) {
      const an = new Date().getFullYear();
      const S = ncCalcEndettement(d);
      const F = ncCalcFisc(d, an);
      const P = ncCalcParts(d);
      const eur = (n) => new Intl.NumberFormat('fr-FR').format(Math.round(n || 0)) + " €";
      const pc = (x) => Math.round((x || 0) * 100) + " %";

      // ——— Identité et famille ———
      const civ = d.civilite === "Mme" ? "Madame" : "Monsieur";
      const prenomC = (d.prenom || "").trim();
      const nomC = [civ, prenomC, (d.nom || "").trim()].filter(Boolean).join(" ");
      const cj = d.conjoint || {};
      const civJ = cj.civilite === "Mme" ? "Madame" : "Monsieur";
      const prenomJ = (cj.prenom || "").trim();
      const nomJ = prenomJ ? `${civJ} ${prenomJ}` : (d.conjointQ === "oui" ? civJ : "votre conjoint");
      const marie = d.situation === "marie", pacse = d.situation === "pacse", unionLibre = d.situation === "union_libre";
      const enCouple = marie || pacse || unionLibre;
      const divorce = d.situation === "divorce";
      const recomposee = enCouple && (d.enfants || []).some(e => e.filiation && e.filiation !== "commun");
      const age = ncAgeDate(d.dateNaissance);
      // Capacité d'emprunt de référence : TOUJOURS la durée maximale autorisée par la
      // règle des 75 ans (25 ans si possible, sinon 20, sinon 75 − âge). Une seule
      // durée dans toute la synthèse — cohérence entre chiffres du dossier et analyse.
      const dureeMax = age == null ? 25 : (age + 25 <= 75 ? 25 : age + 20 <= 75 ? 20 : Math.max(5, 75 - age));
      const tauxMax = dureeMax >= 25 ? 0.04 : 0.039;
      const pvMax = (mens, mois, ta) => { const t = ta / 12; return mens > 0 ? mens * (1 - Math.pow(1 + t, -mois)) / t : 0; };
      const capMax = Math.round(pvMax(S.dispo35, dureeMax * 12, tauxMax));
      // Capacité en INVESTISSEMENT LOCATIF — méthode cabinet : 80 % des loyers du bien
      // financé (rendement 3,90 %) s'ajoutent aux revenus, l'endettement reste ≤ 35 %.
      // m ≤ 0,35·(revenus + 0,8·loyer) − charges ; loyer = 3,90 %·M/12 ; M = m·F
      // ⇒ M = dispo35·F / (1 − 0,35 · 0,8 · (3,90 %/12) · F)
      const fMax = pvMax(1, dureeMax * 12, tauxMax);
      const capLocMax = Math.round((S.dispo35 * fMax) / Math.max(0.2, 1 - 0.35 * 0.8 * (0.039 / 12) * fMax));
      // RÈGLE CABINET PER : le levier fiscal n'est réel que si les versements sont
      // déduits à 30 % — il faut qu'au moins ~5 000 € de revenus soient effectivement
      // taxés dans la tranche à 30 %. Une TMI « à 30 % » sur quelques euros ne suffit pas.
      const qfSyn = ((F.ir || {}).qf) || 0;
      const dans30 = F.tmi > 0.30 ? 999999 : (F.tmi === 0.30 ? Math.max(0, Math.round((qfSyn - 29579) * (F.parts || 1))) : 0);
      const perPertinent = dans30 >= 5000;
      const ageJ = ncAgeDate(cj.dateNaissance);
      const enfants = (d.enfantsQ === "oui" ? (d.enfants || []) : []).filter(e => e.charge !== "non");
      const nbEnf = enfants.length;
      const agesEnf = enfants.map(e => an - ncInt(e.annee)).filter(a => a >= 0 && a < 60);
      const plusJeune = agesEnf.length ? Math.min(...agesEnf) : null;
      const enfantHandicap = enfants.some(e => e.handicap === "oui");
      const situationLib = marie ? "marié(e)" : pacse ? "pacsé(e)" : unionLibre ? "en union libre" : divorce ? "divorcé(e)" : d.situation === "veuf" ? "veuf(ve)" : "célibataire";

      // ——— Revenus, charges, patrimoine ———
      const revC = S.revActiviteClient, revJ = S.revActiviteConjoint;
      const revFoyer = S.totalRevenus, chFoyer = S.totalCharges;
      const taux = S.taux;
      const locataire = d.logement === "locataire";
      const proprio = d.logement === "proprietaire";
      const loyerRP = locataire ? ncInt(d.loyer) : 0;
      const av = d.avoirsQ === "oui" ? (d.avoirs || []) : [];
      const parType = (t) => av.filter(a => a.type === t).reduce((s, a) => s + ncInt(a.valeur), 0);
      const livrets = parType("livrets"), avVie = parType("av"), per = parType("per") ;
      const epargne = S.epargneConstituee;
      const moisCharges = chFoyer > 0 ? epargne / chFoyer : null;
      const cibleP = ncInt(d.epargnePrecaution) || Math.round(chFoyer * 3);
      const CAP_EP = { "<100": 80, "100-300": 200, "300-500": 400, "500-1000": 750, ">1000": 1200 };
      const capEpargne = d.capaciteEpargne === "libre" ? ncInt(d.capaciteEpargneLibre) : (CAP_EP[d.capaciteEpargne] || 0);
      const partImmo = S.actifTotal > 0 ? S.actifImmo / S.actifTotal : 0;
      const estTNS = ((d.activites || []).some(v => v === "independant" || v === "chef"))
        || (d.conjointQ === "oui" && (((d.conjointRev || {}).activites) || []).some(v => v === "independant" || v === "chef"));
      const objectifs = d.objectifs || [];
      const aObj = (v) => objectifs.includes(v);

      const forces = [], faiblesses = [], problematiques = [];
      const pb = (o) => { if (o) problematiques.push(o); };

      // ———————————————————————————————————————————————
      // 1. DISPARITÉ DE REVENUS DANS LE COUPLE + SCÉNARIO DÉCÈS
      //    Le cas d'école : un revenu porte le foyer, sa disparition le fait basculer.
      // ———————————————————————————————————————————————
      const deuxRevenus = enCouple && (revC > 0 || revJ > 0);
      const hautEstClient = revC >= revJ;
      const haut = { n: hautEstClient ? nomC : nomJ, r: hautEstClient ? revC : revJ };
      const bas = { n: hautEstClient ? nomJ : nomC, r: hautEstClient ? revJ : revC };
      const partHaut = revFoyer > 0 ? haut.r / revFoyer : 0;
      const revenuApres = Math.max(0, revFoyer - haut.r);
      const soldeApres = revenuApres - chFoyer;
      const disparite = bas.r === 0 ? 99 : haut.r / bas.r;
      if (deuxRevenus && enCouple && haut.r > 0 && partHaut >= 0.6 && (disparite >= 1.6 || bas.r === 0)) {
        const aCharge = 1 + nbEnf;
        const anneesACouvrir = plusJeune != null ? Math.max(5, 25 - plusJeune) : 10;
        const capitalPrev = Math.round(haut.r * 12 * anneesACouvrir / 1000) * 1000;
        pb({
          code: "disparite_revenus_deces", priorite: "haute", famille: "Prévoyance & protection de la famille",
          // Formulation cabinet : factuelle et diplomatique — on ne dit jamais qu'« un seul
          // revenu porte le foyer » (le conjoint au revenu moindre pourrait mal le vivre).
          // Et toute projection de décès reste prudente : les charges incluent souvent un
          // crédit couvert par une assurance emprunteur qui peut le solder (quotités à vérifier).
          titre: `Sécuriser l'équilibre des revenus du foyer`,
          constat: `Les revenus de ${haut.n} s'élèvent à ${eur(haut.r)}/mois, ceux de ${bas.n} à ${bas.r > 0 ? `${eur(bas.r)}/mois` : "—"}. `
            + `Les revenus du foyer sont donc de ${eur(revFoyer)}/mois, pour ${eur(chFoyer)} de charges fixes`
            + (taux != null ? ` — soit ${pc(taux)} d'endettement` : "")
            + (nbEnf > 0 ? `, avec ${nbEnf} enfant${nbEnf > 1 ? "s" : ""} à charge` : "") + ".",
          consequence: `En cas de décès de ${haut.n}, le foyer perdrait ${eur(haut.r)}/mois : il resterait ${eur(revenuApres)} pour `
            + `${aCharge} personne${aCharge > 1 ? "s" : ""} face à ${eur(chFoyer)} de charges actuelles — `
            + (soldeApres < 0
                ? `soit un déficit de ${eur(Math.abs(soldeApres))} par mois en l'état.`
                : `soit ${eur(soldeApres)} de reste à vivre, sans plus aucune marge d'épargne ni de sécurité.`)
            + ` À nuancer selon les assurances emprunteur : si les crédits sont assurés sur la tête de ${haut.n} (quotités à vérifier), ils seraient soldés au décès et les charges d'autant réduites.`,
          enjeu: `Maintenir le niveau de vie du foyer pendant ${anneesACouvrir} ans`,
          preconisation: `Utiliser la capacité d'emprunt du foyer (${eur(capMax)} sur ${dureeMax} ans) pour un investissement immobilier locatif, `
            + `assuré en décès sur la tête de ${haut.n}. Le montage travaille dans les deux scénarios : `
            + `EN CAS DE VIE, le locataire et l'effort d'épargne remboursent le crédit et construisent un capital pour la retraite et les études des enfants ; `
            + `EN CAS DE DÉCÈS, l'assurance décès emprunteur solde le crédit et laisse à ${bas.n} un bien libre de toute dette, `
            + `qui produit un loyer venant remplacer une partie du revenu perdu.`,
          solutions: [
            `Investissement locatif à crédit — capacité ${eur(capMax)} / ${dureeMax} ans, assurance décès emprunteur 100 % sur ${haut.n}`,
            `Contrat de prévoyance (temporaire décès) — capital de l'ordre de ${eur(capitalPrev)} pour couvrir ${eur(haut.r)}/mois pendant ${anneesACouvrir} ans`,
            `Assurance-vie avec clause bénéficiaire au profit de ${bas.n} — capital disponible hors succession (art. 990 I CGI)`,
            enCouple && !marie ? `Sécuriser juridiquement ${bas.n} : ${pacse ? "testament (le partenaire pacsé n'hérite de rien sans testament)" : "testament — le concubin est un tiers, taxé 60 %"}` : `Vérifier la donation au dernier vivant et les clauses bénéficiaires`,
          ].filter(Boolean),
          chiffres: [
            { l: "Revenu perdu au décès", v: eur(haut.r) + "/mois" },
            { l: "Reste à vivre du survivant", v: eur(soldeApres) + "/mois" },
            { l: "Capacité d'emprunt mobilisable", v: eur(capMax) + ` / ${dureeMax} ans` },
          ],
        });
      }

      // ———————————————————————————————————————————————
      // 2. LOCATAIRE AVEC CAPACITÉ D'EMPRUNT INUTILISÉE
      // ———————————————————————————————————————————————
      if (locataire && capMax >= 50000) {
        const perte25 = loyerRP * 12 * 25;
        pb({
          code: "locataire_capacite_inutilisee", priorite: "haute", famille: "Constitution de patrimoine",
          titre: "Locataire : un loyer qui ne construit aucun patrimoine",
          constat: `Vous êtes locataire pour ${eur(loyerRP)} par mois et votre taux d'endettement s'établit à ${taux != null ? pc(taux) : "—"}, `
            + `très en deçà du plafond bancaire de 35 %. La capacité d'emprunt disponible est de ${eur(capMax)} sur ${dureeMax} ans.`,
          consequence: `Sur les vingt-cinq prochaines années, ce loyer représente ${eur(perte25)} versés à un tiers, sans aucune contrepartie patrimoniale. `
            + `À l'inverse, la même mensualité affectée à un crédit immobilier aurait constitué un actif de plusieurs centaines de milliers d'euros, `
            + `en partie financé par un locataire s'il s'agit d'un investissement locatif.`,
          enjeu: "Transformer une charge en actif",
          preconisation: `Arbitrer entre l'acquisition de la résidence principale et l'investissement locatif. `
            + `L'investissement locatif présente l'avantage d'être financé en partie par le loyer perçu et l'économie d'impôt, `
            + `tout en laissant la mobilité professionnelle intacte, et il est assuré en cas de décès et d'invalidité.`,
          solutions: [
            `Investissement locatif — mensualité disponible ${eur(S.dispo35)}, capacité ${eur(capMax)} / ${dureeMax} ans`,
            "Acquisition de la résidence principale si le projet de vie est stabilisé sur la zone",
            epargne < 20000 ? "Constituer l'apport et les frais de notaire (7 à 8 % dans l'ancien) avant le montage" : "Apport disponible : arbitrer entre apport et conservation de l'épargne de précaution",
          ],
          chiffres: [
            { l: "Loyer versé sur 25 ans", v: eur(perte25) },
            { l: "Capacité d'emprunt", v: eur(capMax) + ` / ${dureeMax} ans` },
            { l: "Mensualité disponible", v: eur(S.dispo35) + "/mois" },
          ],
        });
      }

      // ———————————————————————————————————————————————
      // 3. ÉPARGNE DE PRÉCAUTION INSUFFISANTE
      // ———————————————————————————————————————————————
      if (chFoyer > 0 && moisCharges != null && moisCharges < 3) {
        const manque = Math.max(0, cibleP - epargne);
        pb({
          code: "precaution_insuffisante", priorite: epargne < chFoyer ? "haute" : "moyenne", famille: "Sécurité financière",
          titre: "Épargne de précaution en dessous du seuil de sécurité",
          constat: `L'épargne disponible s'élève à ${eur(epargne)} pour ${eur(chFoyer)} de charges mensuelles, `
            + `soit ${moisCharges.toFixed(1).replace('.', ',')} mois de charges couvertes. La règle de place est de 3 à 6 mois.`,
          consequence: `Un imprévu courant — panne de voiture, sinistre, arrêt de travail, perte d'emploi — se financerait par un crédit à la consommation `
            + `à 6 ou 8 %, ou par la revente d'un placement au mauvais moment. C'est le premier facteur d'échec des stratégies patrimoniales : `
            + `un projet long terme interrompu au bout de deux ans parce que la trésorerie a manqué.`,
          enjeu: `Reconstituer ${eur(manque)} de trésorerie`,
          preconisation: `Sécuriser en priorité ${eur(cibleP)} sur des supports immédiatement disponibles (livret A, LDDS, LEP si éligible), `
            + `avant d'engager tout placement bloqué ou tout investissement à crédit. `
            + (capEpargne > 0 ? `Avec une capacité d'épargne de ${eur(capEpargne)} par mois, l'objectif est atteint en ${Math.ceil(manque / capEpargne)} mois.` : `Définir ensemble une capacité d'épargne mensuelle dédiée.`),
          solutions: [
            `Versement programmé sur livret réglementé jusqu'à ${eur(cibleP)}`,
            "Vérifier l'éligibilité au LEP (taux bonifié, sous condition de revenu fiscal de référence)",
            "Ne débloquer les projets long terme qu'une fois le socle constitué",
          ],
          chiffres: [
            { l: "Épargne disponible", v: eur(epargne) },
            { l: "Cible de précaution", v: eur(cibleP) },
            { l: "À reconstituer", v: eur(manque) },
          ],
        });
      }

      // ———————————————————————————————————————————————
      // 4. LIQUIDITÉS DORMANTES
      // ———————————————————————————————————————————————
      if (livrets > 0 && chFoyer > 0 && livrets > Math.max(cibleP * 1.5, chFoyer * 6)) {
        const dormant = Math.round(livrets - cibleP);
        const perteInflation = Math.round(dormant * 0.015);
        pb({
          code: "liquidites_dormantes", priorite: "moyenne", famille: "Rendement de l'épargne",
          titre: "Trop de liquidités sur les livrets — un capital qui perd de la valeur",
          constat: `${eur(livrets)} sont placés sur des livrets réglementés, alors que le besoin de précaution est estimé à ${eur(cibleP)}. `
            + `L'excédent, soit ${eur(dormant)}, dort sur des supports plafonnés et non capitalisants.`,
          consequence: `Rémunérés en dessous de l'inflation, ces ${eur(dormant)} perdent environ ${eur(perteInflation)} de pouvoir d'achat par an, `
            + `soit ${eur(perteInflation * 10)} sur dix ans. Un placement diversifié — hypothèse de rendement 4 % net — aurait produit sur la même durée `
            + `de l'ordre de ${eur(dormant * 0.48)} de gains.`,
          enjeu: "Faire travailler l'excédent de trésorerie",
          preconisation: `Conserver ${eur(cibleP)} de précaution, et redéployer ${eur(dormant)} sur une allocation adaptée à l'horizon et au profil : `
            + `assurance-vie multisupport (fiscalité dégressive, capital disponible, transmission hors succession), `
            + (F.tmi >= 0.30 ? `PER pour la part retraite (versement déductible à ${pc(F.tmi)}), ` : "")
            + `PEA pour la poche actions (exonération d'impôt après 5 ans, hors prélèvements sociaux).`,
          solutions: [
            avVie === 0 ? "Ouvrir une assurance-vie pour prendre date (l'antériorité fiscale démarre à l'ouverture)" : "Renforcer l'assurance-vie existante",
            F.tmi >= 0.30 ? `Versement PER — économie d'impôt immédiate au taux marginal de ${pc(F.tmi)}` : "PEA pour la poche long terme",
            "Mise en place de versements programmés pour lisser les points d'entrée",
          ],
          chiffres: [
            { l: "Liquidités excédentaires", v: eur(dormant) },
            { l: "Perte de pouvoir d'achat / an", v: eur(perteInflation) },
            { l: "Manque à gagner sur 10 ans", v: eur(dormant * 0.48) },
          ],
        });
      }

      // ———————————————————————————————————————————————
      // 5. RETRAITE NON PRÉPARÉE
      // ———————————————————————————————————————————————
      const odRet = (d.objectifsDetail || {}).retraite || {};
      const pensionEst = ncInt(odRet.pension) + (d.conjointQ === "oui" ? ncInt(odRet.pensionConj) : 0);
      if ((age != null && age >= 40 && per === 0) || (aObj("retraite") && per === 0)) {
        const revAct = revC + revJ;
        const pensionProj = pensionEst > 0 ? pensionEst : Math.round(revAct * 0.55);
        const perteRet = Math.max(0, revAct - pensionProj);
        const capitalCible = perteRet > 0 ? Math.round(perteRet * 12 / 0.04 / 1000) * 1000 : 0;
        const horizon = age != null ? Math.max(3, 64 - age) : 20;
        pb({
          code: "retraite_non_preparee", priorite: age != null && age >= 45 ? "haute" : "moyenne", famille: "Retraite",
          titre: "Aucun dispositif retraite en place",
          constat: `Le foyer perçoit ${eur(revAct)} de revenus d'activité par mois et ne dispose d'aucun contrat retraite dédié${perPertinent ? " (PER)" : ""}`
            + (age != null ? `, à ${horizon} ans du départ estimé.` : "."),
          consequence: `Le taux de remplacement moyen se situe entre 50 et 60 % pour un salarié du privé, et souvent moins pour un indépendant. `
            + `La pension projetée serait de l'ordre de ${eur(pensionProj)} par mois, soit une baisse de revenu de ${eur(perteRet)} par mois `
            + `— ${eur(perteRet * 12)} par an, à un moment où les charges ne diminuent pas dans les mêmes proportions.`,
          enjeu: `Compenser ${eur(perteRet)} de revenu mensuel à la retraite`,
          preconisation: `Combler l'écart suppose de constituer un capital de l'ordre de ${eur(capitalCible)} (règle de retrait à 4 %) `
            + `ou des revenus locatifs équivalents. `
            + (perPertinent
                ? `Le PER est ici doublement efficace : chaque versement est déduit du revenu imposable (art. 163 quatervicies CGI) à ${pc(F.tmi)}, l'État finance donc ${pc(F.tmi)} de l'effort d'épargne.`
                : `Privilégier l'assurance-vie et l'immobilier locatif, disponibles et souples.`),
          solutions: [
            perPertinent ? `PER — versement déductible, économie d'impôt de ${pc(F.tmi)} sur chaque euro versé` : "Assurance-vie multisupport en versements programmés",
            `Investissement locatif à crédit — le loyer rembourse, le capital reste (capacité ${eur(capMax)} / ${dureeMax} ans)`,
            capEpargne > 0 ? `Affecter tout ou partie des ${eur(capEpargne)} de capacité d'épargne mensuelle à l'horizon retraite` : "Chiffrer la capacité d'épargne mensuelle mobilisable",
          ],
          chiffres: [
            { l: "Baisse de revenu estimée", v: eur(perteRet) + "/mois" },
            { l: "Capital à constituer", v: eur(capitalCible) },
            { l: "Horizon", v: horizon + " ans" },
          ],
        });
      }

      // ———————————————————————————————————————————————
      // 6. TNS SANS PRÉVOYANCE
      // ———————————————————————————————————————————————
      const prevQ = ((d.objectifsDetail || {}).prevoyance || {}).couvertureQ;
      if (estTNS && prevQ !== "oui") {
        pb({
          code: "tns_sans_prevoyance", priorite: "haute", famille: "Prévoyance & protection de la famille",
          titre: "Travailleur non salarié sans couverture prévoyance confirmée",
          constat: `Le foyer tire ses revenus d'une activité indépendante ou de dirigeant, régime dans lequel les prestations obligatoires `
            + `en cas d'arrêt de travail sont faibles, différées et plafonnées.`,
          consequence: `Un arrêt de travail de plusieurs mois supprime tout ou partie de ${eur(Math.max(revC, revJ))} de revenu mensuel, `
            + `alors que les charges du foyer — ${eur(chFoyer)} par mois — continuent de courir. En invalidité, la perte devient définitive.`,
          enjeu: "Sécuriser le revenu professionnel",
          preconisation: `Mettre en place un contrat de prévoyance individuel couvrant les trois risques : incapacité temporaire (indemnités journalières `
            + `avec franchise courte), invalidité permanente (rente) et décès (capital et rente d'éducation). `
            + `Dans le cadre Madelin, les cotisations sont déductibles du résultat professionnel.`,
          solutions: [
            "Contrat de prévoyance Madelin — indemnités journalières, rente d'invalidité, capital décès",
            nbEnf > 0 ? `Rente d'éducation pour ${nbEnf} enfant${nbEnf > 1 ? "s" : ""} à charge` : "Capital décès au profit du conjoint",
            "Audit du contrat existant : franchise, définition de l'invalidité (professionnelle ou fonctionnelle), exclusions",
          ],
          chiffres: [
            { l: "Revenu à couvrir", v: eur(Math.max(revC, revJ)) + "/mois" },
            { l: "Charges incompressibles", v: eur(chFoyer) + "/mois" },
          ],
        });
      }

      // ———————————————————————————————————————————————
      // 7. IMPÔT ÉLEVÉ SANS AUCUN LEVIER
      // ———————————————————————————————————————————————
      if (F.impotNet >= 2000 && F.deductions === 0 && F.reductions === 0) {
        // Plafond épargne retraite 2026 (art. 163 quatervicies CGI) : 10 % des revenus
        // professionnels, plancher 10 % du PASS (4 710 €), plafond 10 % de 8 PASS (37 680 €).
        // PASS 2026 = 47 100 €. Hors report des plafonds non utilisés des 3 années antérieures.
        const versPer = Math.min(Math.max(Math.round(F.rniBrut * 0.10 / 100) * 100, PER_PLAFOND_MIN), PER_PLAFOND_MAX);
        const gain = Math.round(versPer * F.tmi);
        pb({
          code: "fiscalite_sans_levier", priorite: F.impotNet >= 5000 ? "haute" : "moyenne", famille: "Fiscalité",
          titre: `${eur(F.impotNet)} d'impôt sur le revenu, sans aucun dispositif d'optimisation`,
          constat: `Le foyer déclare ${eur(F.rniBrut)} de revenu net imposable pour ${F.parts} part${F.parts > 1 ? "s" : ""}, `
            + `soit une tranche marginale à ${pc(F.tmi)} et un impôt net de ${eur(F.impotNet)}. Aucune déduction ni réduction n'est aujourd'hui utilisée.`,
          consequence: `Sur dix ans, à situation constante, ce sont ${eur(F.impotNet * 10)} d'impôt versés sans contrepartie patrimoniale, `
            + `alors qu'une partie pouvait alimenter l'épargne du foyer.`,
          enjeu: `Récupérer jusqu'à ${eur(gain)} par an`,
          preconisation: perPertinent
            ? `Le plafond de déduction PER disponible permet un versement de l'ordre de ${eur(versPer)} `
              + `(10 % des revenus professionnels), qui génère une économie d'impôt immédiate de ${eur(gain)} à ${pc(F.tmi)} `
              + `(art. 163 quatervicies CGI) — l'épargne reste la propriété du client, elle change simplement de poche. `
              + `À combiner avec l'immobilier locatif, qui produit du déficit foncier ou de l'amortissement en LMNP.`
            : `L'optimisation passera d'abord par l'immobilier locatif (déficit foncier au réel, amortissement en LMNP) et par l'assurance-vie.`,
          solutions: perPertinent ? [
            `Versement PER de ${eur(versPer)} — économie d'impôt ${eur(gain)}`,
            "Immobilier locatif au réel — intérêts, charges et travaux déductibles, déficit foncier imputable jusqu'à 10 700 €/an",
            "LMNP au réel — amortissement du bien, revenus locatifs peu ou pas fiscalisés",
          ] : [
            "Immobilier locatif au réel — intérêts, charges et travaux déductibles, déficit foncier imputable jusqu'à 10 700 €/an",
            "LMNP au réel — amortissement du bien, revenus locatifs peu ou pas fiscalisés",
          ],
          chiffres: [
            { l: "Impôt net actuel", v: eur(F.impotNet) },
            { l: "Tranche marginale", v: pc(F.tmi) },
            { l: "Économie potentielle", v: eur(gain) + "/an" },
          ],
        });
      }

      // ———————————————————————————————————————————————
      // 8. AVANTAGE FISCAL QUI S'ÉTEINT
      // ———————————————————————————————————————————————
      (F.echeancier || []).forEach(e => {
        if (e.surcout <= 0) return;
        pb({
          code: "avantage_fiscal_expire", priorite: e.surcout >= 1500 ? "haute" : "moyenne", famille: "Fiscalité",
          titre: `Un avantage fiscal s'éteint fin ${e.annee} : +${eur(e.surcout)} d'impôt`,
          constat: `${e.avantagesPerdus.map(a => a.libelle).join(", ")} produi${e.avantagesPerdus.length > 1 ? "sent" : "t"} son effet pour la dernière fois en ${e.annee}, `
            + `pour ${eur(e.montantPerdu)} par an.`,
          consequence: `À compter de ${e.annee + 1}, l'impôt du foyer passe mécaniquement de ${eur(F.impotNet)} à ${eur(e.impotApres)}, `
            + `soit ${eur(e.surcout)} de plus chaque année, sans que les revenus aient augmenté.`,
          enjeu: `Préparer le relais avant ${e.annee}`,
          preconisation: `Anticiper dès maintenant le dispositif de remplacement, en privilégiant un levier récurrent plutôt qu'un nouveau one-shot : `
            + `PER (déduction annuelle reconductible) ou immobilier locatif au réel (charges et amortissements durables).`,
          solutions: [
            "PER — déduction du revenu imposable, reconductible chaque année",
            "Immobilier locatif au réel / LMNP — effet fiscal étalé sur toute la durée de détention",
            "Réexaminer le dispositif arrivant à terme (revente, requalification, engagement de conservation)",
          ],
          chiffres: [
            { l: "Dernière année d'effet", v: String(e.annee) },
            { l: "Surcoût annuel", v: "+" + eur(e.surcout) },
          ],
        });
      });

      // ———————————————————————————————————————————————
      // 9. PROTECTION DU SURVIVANT NON ORGANISÉE
      // ———————————————————————————————————————————————
      if (marie && d.ddvQ !== "oui") {
        pb({
          code: "protection_conjoint", priorite: recomposee ? "haute" : "moyenne", famille: "Transmission",
          titre: recomposee ? "Famille recomposée sans donation au dernier vivant" : "Pas de donation au dernier vivant confirmée",
          constat: `Le couple est marié${recomposee ? " avec au moins un enfant d'une autre union" : ""} et la donation au dernier vivant `
            + `${d.ddvQ === "nsp" ? "n'a pas pu être confirmée" : "n'a pas été mise en place"}.`,
          consequence: recomposee
            ? `En présence d'un enfant non commun, le conjoint survivant est limité au quart en pleine propriété, sans aucune option d'usufruit (art. 757 C. civ.) : `
              + `il ne peut ni conserver l'usufruit du logement familial, ni percevoir les revenus du patrimoine, dont ${eur(S.actifImmo)} d'immobilier.`
            : `Sans elle, le conjoint survivant est cantonné aux droits légaux (art. 757 C. civ.) et doit choisir dans l'urgence, `
              + `sans pouvoir adapter son option à sa situation du moment. Le patrimoine concerné représente ${eur(S.patrimoineNet)} net.`,
          enjeu: "Sécuriser le conjoint survivant",
          preconisation: `Signer une donation au dernier vivant chez le notaire : elle rouvre les trois options (quotité disponible ordinaire en pleine propriété, `
            + `un quart en pleine propriété plus trois quarts en usufruit, ou usufruit de la totalité — art. 1094-1 C. civ.), choisies au décès. `
            + `Coût modique, et aucun coût fiscal : le conjoint est exonéré de droits de succession (art. 796-0 bis CGI).`,
          solutions: ["Rendez-vous notaire — donation au dernier vivant", "Mise à jour des clauses bénéficiaires d'assurance-vie", "Vérification de la cohérence avec le régime matrimonial"],
          chiffres: [{ l: "Patrimoine net concerné", v: eur(S.patrimoineNet) }],
        });
      }
      if ((pacse || unionLibre) && d.testamentQ !== "oui") {
        pb({
          code: "protection_partenaire", priorite: "haute", famille: "Transmission",
          titre: unionLibre ? "Concubin sans testament : il n'hérite de rien" : "Partenaire de PACS sans testament : il n'hérite de rien",
          constat: `Le couple vit ${unionLibre ? "en union libre" : "sous le régime du PACS"} et aucun testament n'a été ${d.testamentQ === "nsp" ? "confirmé" : "rédigé"}.`,
          consequence: `${unionLibre ? "Le concubin" : "Le partenaire pacsé"} n'a aucune vocation successorale légale : au décès, il ne recueille rien `
            + `et ${unionLibre ? "serait taxé à 60 % après un abattement de 1 594 € sur tout legs" : "devrait quitter le logement si le bien revient aux héritiers réservataires"}. `
            + `Le patrimoine du foyer, ${eur(S.patrimoineNet)} net, reviendrait intégralement aux héritiers légaux.`,
          enjeu: "Donner une existence juridique au survivant",
          preconisation: `Rédiger un testament (olographe ou authentique) au profit du partenaire, dans la limite de la quotité disponible en présence d'enfants, `
            + `et adosser une assurance-vie désignant le partenaire — capital versé hors succession (art. 990 I CGI)`
            + `${unionLibre ? ", seule voie efficace face aux 60 % de droits" : ", le partenaire pacsé étant lui exonéré de droits"}.`,
          solutions: ["Testament chez le notaire, enregistré au fichier central", "Assurance-vie avec clause bénéficiaire nominative", unionLibre ? "Examiner l'opportunité d'un PACS ou d'un mariage" : "Vérifier la convention de PACS et le sort du logement"],
          chiffres: [{ l: "Patrimoine exposé", v: eur(S.patrimoineNet) }],
        });
      }

      // ———————————————————————————————————————————————
      // 10. PATRIMOINE CONCENTRÉ SUR L'IMMOBILIER
      // ———————————————————————————————————————————————
      // RÈGLE CABINET (à ne jamais retransgresser) : ne JAMAIS parler de concentration
      // immobilière quand le client n'a que sa résidence principale — quel que soit le
      // pourcentage. Le sujet n'existe que si RP + LOCATIF avec une épargne insuffisante.
      if (S.actifTotal >= 100000 && (d.locatifs || []).length > 0 && revFoyer > 0 && epargne < revFoyer * 3) {
        pb({
          code: "concentration_immobiliere", priorite: "moyenne", famille: "Allocation d'actifs",
          titre: "Bâtir le volet financier aux côtés de l'immobilier locatif",
          constat: `Le patrimoine immobilier travaille — résidence principale et locatif pour ${eur(S.actifImmo)} — mais l'épargne financière ne suit pas encore : ${eur(epargne)}, soit moins de trois mois de revenus.`,
          consequence: `Sans poche financière, un imprévu ou les droits de succession devraient être absorbés par la vente d'un bien. `
            + `L'assurance-vie apporte ce complément : disponibilité, fiscalité dégressive, transmission hors succession (abattement 152 500 € par parent et par enfant).`,
          enjeu: "Constituer une épargne financière disponible, sans vendre l'immobilier",
          preconisation: `Poursuivre la dynamique immobilière ET développer la poche financière en parallèle : versements programmés sur une assurance-vie, complétés d'un PER selon la TMI.`,
          solutions: ["Assurance-vie multisupport en versements programmés", "PER selon la TMI", "Poursuite de la stratégie immobilière locative"],
          chiffres: [{ l: "Immobilier", v: eur(S.actifImmo) }, { l: "Financier", v: eur(epargne) }],
        });
      }

      // ———————————————————————————————————————————————
      // 11. ÉTUDES DES ENFANTS NON FINANCÉES
      // ———————————————————————————————————————————————
      const lignesEtudes = (((d.objectifsDetail || {}).etudes || {}).lignes) || [];
      const budgetEtudes = lignesEtudes.reduce((s, x) => s + ncInt(x.budget), 0);
      const enfantsJeunes = enfants.filter(e => { const a = an - ncInt(e.annee); return a >= 0 && a < 18; }).length;
      if (enfantsJeunes > 0 && (budgetEtudes === 0 || epargne < budgetEtudes * 0.3)) {
        const cout = enfantsJeunes * 40000;
        const cible = budgetEtudes > 0 ? budgetEtudes : cout;
        const ansRestants = plusJeune != null ? Math.max(1, 18 - plusJeune) : 10;
        pb({
          code: "etudes_non_financees", priorite: "moyenne", famille: "Études des enfants",
          titre: `Les études de ${enfantsJeunes} enfant${enfantsJeunes > 1 ? "s" : ""} ne sont pas financées`,
          constat: `${enfantsJeunes} enfant${enfantsJeunes > 1 ? "s sont mineurs" : " est mineur"} et l'épargne dédiée est `
            + `${budgetEtudes > 0 ? `chiffrée à ${eur(budgetEtudes)} mais non constituée` : "inexistante à ce stade"}.`,
          consequence: `Le coût moyen d'un cycle d'études supérieures hors du domicile familial se situe entre 30 000 et 50 000 € par enfant, `
            + `soit environ ${eur(cible)} pour le foyer. Non anticipé, il se finance par un crédit étudiant, une ponction sur l'épargne retraite `
            + `ou une aide familiale improvisée — au moment précis où les revenus commencent à baisser.`,
          enjeu: `Constituer ${eur(cible)} d'ici ${ansRestants} ans`,
          preconisation: `Mettre en place un effort d'épargne dédié de l'ordre de ${eur(Math.round(cible / (ansRestants * 12)))} par mois, `
            + `sur un support disponible et sécurisé à l'approche de l'échéance. `
            + `Un investissement locatif dont le crédit s'achève au moment des études constitue l'autre voie : le loyer devient alors le budget étudiant.`,
          solutions: [
            `Versements programmés de ${eur(Math.round(cible / (ansRestants * 12)))} par mois sur assurance-vie`,
            "Investissement locatif calé sur l'horizon des études — le loyer finance ensuite le logement étudiant",
            "Contrat de capitalisation ou assurance-vie au nom de l'enfant avec pacte adjoint",
          ],
          chiffres: [{ l: "Besoin estimé", v: eur(cible) }, { l: "Horizon", v: ansRestants + " ans" }, { l: "Effort mensuel", v: eur(Math.round(cible / (ansRestants * 12))) + "/mois" }],
        });
      }

      // ———————————————————————————————————————————————
      // 12. ENDETTEMENT AU-DELÀ DU SEUIL BANCAIRE
      // ———————————————————————————————————————————————
      if (taux != null && taux > 0.35) {
        const exces = Math.round(chFoyer - revFoyer * 0.35);
        pb({
          code: "endettement_excessif", priorite: "haute", famille: "Structure budgétaire",
          titre: `Taux d'endettement à ${pc(taux)} — au-delà du plafond bancaire`,
          constat: `Les charges de crédit et de logement représentent ${eur(chFoyer)} pour ${eur(revFoyer)} de revenus retenus, soit ${pc(taux)}.`,
          consequence: `Aucun nouveau financement ne sera accordé en l'état : tout projet immobilier, locatif ou de trésorerie est bloqué. `
            + `Le reste à vivre s'établit à ${eur(revFoyer - chFoyer)} par mois, ce qui laisse peu de marge en cas d'imprévu.`,
          enjeu: `Ramener ${eur(exces)} de mensualités sous le seuil`,
          preconisation: `Restructurer le passif : regroupement de crédits, allongement de durée, remboursement anticipé des crédits à la consommation `
            + `les plus coûteux, renégociation de l'assurance emprunteur. L'objectif est de retrouver une capacité d'emprunt avant d'envisager tout investissement.`,
          solutions: ["Regroupement / rachat de crédits", "Remboursement anticipé des crédits conso à taux élevé", "Renégociation de l'assurance emprunteur (loi Lemoine, résiliation à tout moment)"],
          chiffres: [{ l: "Taux d'endettement", v: pc(taux) }, { l: "Excédent de mensualités", v: eur(exces) + "/mois" }, { l: "Reste à vivre", v: eur(revFoyer - chFoyer) + "/mois" }],
        });
      }

      // ———————————————————————————————————————————————
      // 13. ASSURANCE EMPRUNTEUR NON RENÉGOCIÉE
      // ———————————————————————————————————————————————
      const bienNonRenego = (proprio && d.rpCreditQ === "oui" && d.rpAssurRenegociee === "non" ? 1 : 0)
        + (d.locatifs || []).filter(l => l.creditQ === "oui" && l.assurQ === "non").length
        + (d.biens || []).filter(b => b.creditQ === "oui" && b.assurQ === "non").length;
      if (bienNonRenego > 0) {
        const crdTot = S.passif;
        const gainAn = Math.round(crdTot * 0.002);
        pb({
          code: "assurance_emprunteur", priorite: "moyenne", famille: "Optimisation des charges",
          titre: `${bienNonRenego} crédit${bienNonRenego > 1 ? "s" : ""} dont l'assurance emprunteur n'a jamais été renégociée`,
          constat: `Le foyer supporte ${eur(crdTot)} de capital restant dû, avec des contrats d'assurance groupe souscrits à l'origine auprès de la banque prêteuse.`,
          consequence: `L'assurance groupe est en moyenne 2 à 3 fois plus chère qu'un contrat individuel à garanties équivalentes. `
            + `Sur la durée résiduelle des prêts, l'économie non captée se chiffre couramment à plusieurs milliers d'euros — de l'ordre de ${eur(gainAn)} par an.`,
          enjeu: "Récupérer du pouvoir d'achat sans rien changer d'autre",
          preconisation: `Faire jouer la loi Lemoine : résiliation et substitution possibles à tout moment, sans frais, à garanties au moins équivalentes. `
            + `Cette économie améliore mécaniquement le taux d'endettement et donc la capacité d'emprunt pour les projets à venir.`,
          solutions: ["Étude comparative de délégation d'assurance", "Substitution loi Lemoine (sans frais, à tout moment)", "Réinjecter l'économie dans l'épargne programmée"],
          chiffres: [{ l: "Capital restant dû", v: eur(crdTot) }, { l: "Économie annuelle estimée", v: eur(gainAn) }],
        });
      }

      // ———————————————————————————————————————————————
      // 14. ENFANT EN SITUATION DE HANDICAP
      // ———————————————————————————————————————————————
      if (enfantHandicap) {
        pb({
          code: "enfant_handicap", priorite: "haute", famille: "Transmission",
          titre: "Un enfant en situation de handicap : protection à organiser sur le long terme",
          constat: `Le foyer compte ${P.nbHandicap} enfant${P.nbHandicap > 1 ? "s" : ""} en situation de handicap, ouvrant droit à une demi-part supplémentaire (art. 195-2 CGI).`,
          consequence: `La question qui se pose est celle de l'après : qui prendra le relais financièrement lorsque les parents ne seront plus là ? `
            + `Une transmission classique laisserait un capital sans organisation de gestion, et pourrait remettre en cause certaines prestations sociales.`,
          enjeu: "Assurer un revenu à vie et une gestion pérenne",
          preconisation: `Combiner les outils dédiés : rente survie et épargne handicap (abattement spécifique, exonération de droits jusqu'à 152 500 € `
            + `entre non-parents proches), assurance-vie avec clause bénéficiaire démembrée, et testament organisant la gestion des capitaux. `
            + `Une donation graduelle ou résiduelle peut sécuriser la transmission au second degré.`,
          solutions: ["Contrat rente survie / épargne handicap", "Clause bénéficiaire d'assurance-vie sur mesure", "Testament et mandat de protection future — rendez-vous notaire"],
          chiffres: [],
        });
      }

      // ———————————————————————————————————————————————
      // 15. ÉPARGNE TRÈS DÉSÉQUILIBRÉE ENTRE LES CONJOINTS
      // ———————————————————————————————————————————————
      if (enCouple && epargne >= 50000) {
        const parDet = { client: 0, conjoint: 0, commun: 0 };
        av.forEach(a => { const k = a.titulaire === "conjoint" ? "conjoint" : a.titulaire === "client" ? "client" : "commun"; parDet[k] += ncInt(a.valeur); });
        const nominatif = parDet.client + parDet.conjoint;
        if (nominatif > 0 && (parDet.client === 0 || parDet.conjoint === 0) && nominatif >= epargne * 0.7) {
          const detenteur = parDet.client > 0 ? nomC : nomJ;
          const autre = parDet.client > 0 ? nomJ : nomC;
          pb({
            code: "epargne_desequilibree", priorite: "moyenne", famille: "Équilibre du couple",
            titre: "L'épargne financière est détenue par une seule personne du couple",
            constat: `${eur(nominatif)} d'épargne sont détenus au nom de ${detenteur}, et rien au nom de ${autre}.`,
            consequence: `En cas de décès, de séparation ou de blocage temporaire des comptes, ${autre} se retrouve sans ressource financière immédiatement mobilisable. `
              + `Sur le plan fiscal, un seul des deux plafonds de versement (PER, PEA, abattements d'assurance-vie) est utilisé.`,
            enjeu: "Rééquilibrer et doubler les enveloppes",
            preconisation: `Ouvrir des enveloppes au nom de ${autre} : assurance-vie (abattement de 152 500 € par bénéficiaire), PEA (un par personne), `
              + `PER (plafond de déduction individuel). Le couple double ainsi ses plafonds et sécurise chacun des deux membres.`,
            solutions: ["Assurance-vie au nom du conjoint le moins doté", "PEA individuel (un plafond par personne)", "PER individuel — plafond de déduction propre"],
            chiffres: [{ l: "Épargne nominative", v: eur(nominatif) }],
          });
        }
      }

      // ———————————————————————————————————————————————
      // 16. TRANSMISSION APRÈS 70 ANS
      // ———————————————————————————————————————————————
      if (age != null && age >= 66 && age < 71 && S.patrimoineNet >= 200000) {
        pb({
          code: "fenetre_990i", priorite: "haute", famille: "Transmission",
          titre: `Fenêtre fiscale à ne pas manquer : les versements avant 70 ans`,
          constat: `À ${age} ans, avec ${eur(S.patrimoineNet)} de patrimoine net, il reste ${71 - age} an${71 - age > 1 ? "s" : ""} pour verser sur assurance-vie `
            + `sous le régime le plus favorable.`,
          consequence: `Les versements effectués avant 70 ans bénéficient d'un abattement de 152 500 € par bénéficiaire (art. 990 I CGI). `
            + `Après 70 ans, l'abattement tombe à 30 500 € global, tous bénéficiaires confondus (art. 757 B CGI) — la différence peut représenter `
            + `plusieurs dizaines de milliers d'euros de droits.`,
          enjeu: "Verser avant l'anniversaire des 70 ans",
          preconisation: `Alimenter les contrats d'assurance-vie existants ou en ouvrir de nouveaux avant 70 ans, en calibrant les clauses bénéficiaires `
            + `sur le nombre de bénéficiaires visés — chacun disposant de son propre abattement de 152 500 €.`,
          solutions: ["Versements sur assurance-vie avant 70 ans", "Rédaction sur mesure des clauses bénéficiaires", "Donation en nue-propriété en complément (abattement 100 000 € par enfant, tous les 15 ans)"],
          chiffres: [{ l: "Abattement avant 70 ans", v: "152 500 € / bénéficiaire" }, { l: "Après 70 ans", v: "30 500 € global" }],
        });
      }

      // Problématique cabinet systématique dès que la capacité d'emprunt existe :
      // l'immobilier locatif, l'assurance-vie et le PER doivent avoir une part belle
      // dans chaque dossier (doctrine Universel Patrimoine).
      if (capMax >= 80000 && (taux == null || taux < 0.35)) {
        problematiques.push({
          titre: proprio && d.rpCreditQ !== "oui"
            ? "Prolonger la dynamique immobilière et construire le volet financier"
            : "Mettre la capacité d'emprunt et l'épargne au travail",
          priorite: "moyenne",
          constat: (proprio && d.rpCreditQ !== "oui"
            ? `La résidence principale est intégralement payée${age != null ? ` à ${age} ans` : ""} — un cap que beaucoup n'atteignent qu'à la retraite. `
            : "")
            + `La capacité d'emprunt du foyer est intacte : ${eur(capMax)} finançables sur ${dureeMax} ans pour un achat classique, et jusqu'à ≈ ${eur(capLocMax)} en investissement locatif (80 % des loyers comptés en revenus).`,
          consequence: `C'est quand on est crédible auprès des banques et en bonne santé qu'il faut mettre les choses en place : `
            + `l'assurance emprunteur d'un crédit locatif protège les héritiers (au décès, le crédit est soldé, le bien reste), `
            + `pendant que l'assurance-vie et le PER construisent le capital retraite et la transmission (abattement 152 500 € par parent et par enfant).`,
          enjeu: "Continuer sur cette lancée : immobilier locatif, assurance-vie, PER",
          preconisation: `Mobiliser la capacité d'emprunt sur un investissement immobilier locatif financé à crédit, et bâtir en parallèle le volet financier : `
            + `versements réguliers sur une assurance-vie${perPertinent ? ` et sur un PER (déduction à la TMI de ${pc(F.tmi)})` : ""}.`,
          solutions: perPertinent ? ["Investissement immobilier locatif à crédit", "Assurance-vie", "PER"] : ["Investissement immobilier locatif à crédit", "Assurance-vie"],
          chiffres: [
            { l: "Capacité RP / rés. secondaire", v: eur(capMax) + ` / ${dureeMax} ans` },
            { l: "Capacité en locatif", v: "≈ " + eur(capLocMax) + ` / ${dureeMax} ans` },
            { l: "Mensualité mobilisable", v: eur(S.dispo35) + "/mois" },
            { l: "Abattement assurance-vie", v: "152 500 € / parent / enfant" },
          ],
        });
      }

      // ———————————————————————————————————————————————
      // FORCES
      // ———————————————————————————————————————————————
      if (taux != null && taux <= 0.30 && chFoyer > 0) forces.push({ t: "Endettement maîtrisé", d: `${pc(taux)} de taux d'endettement, largement sous le plafond bancaire de 35 % : la capacité de financement est intacte.` });
      if (capMax >= 80000) forces.push({ t: "Capacité d'emprunt disponible", d: `${eur(capMax)} finançables sur ${dureeMax} ans pour une résidence principale ou secondaire — et jusqu'à ≈ ${eur(capLocMax)} pour un investissement locatif.` });
      if (moisCharges != null && moisCharges >= 3) forces.push({ t: "Épargne de précaution constituée", d: `${eur(epargne)}, soit ${moisCharges.toFixed(1).replace('.', ',')} mois de charges couverts : les projets long terme peuvent être engagés sereinement.` });
      if (proprio && d.rpCreditQ !== "oui") forces.push({ t: `Résidence principale payée${age != null ? ` à ${age} ans` : ""}`, d: `${eur(ncInt(d.rpValeur))} d'actif net acquis, sans aucun crédit — une position rare${age != null && age <= 55 ? " à cet âge" : ""}. La dynamique est excellente : la prolonger par l'immobilier locatif serait vivement recommandé.` });
      if (proprio && d.rpCreditQ === "oui") forces.push({ t: "Propriétaire de la résidence principale", d: `${eur(ncInt(d.rpValeur))} de valeur estimée, dont ${eur(ncInt(d.rpCrd))} restant dus — le socle patrimonial est posé.` });
      if (marie && d.ddvQ === "oui") forces.push({ t: "Conjoint protégé", d: "Donation au dernier vivant en place : le survivant choisira son option au moment du décès (art. 1094-1 C. civ.)." });
      if ((pacse || unionLibre) && d.testamentQ === "oui") forces.push({ t: "Testament rédigé", d: `Le ${unionLibre ? "concubin" : "partenaire"} est désigné, ce qui lui donne une vocation successorale qu'il n'aurait pas légalement.` });
      if (per > 0) forces.push({ t: "Retraite déjà amorcée", d: `${eur(per)} sur un PER — le dispositif est ouvert, il reste à calibrer les versements sur le plafond disponible.` });
      if (avVie > 0) forces.push({ t: "Assurance-vie ouverte", d: `${eur(avVie)} placés : l'antériorité fiscale court et l'outil de transmission est en place (art. 990 I CGI).` });
      if (S.actifTotal > 0 && partImmo > 0.2 && partImmo < 0.75 && S.actifTotal >= 100000) forces.push({ t: "Patrimoine diversifié", d: `${pc(partImmo)} d'immobilier et ${pc(1 - partImmo)} de financier : l'allocation est équilibrée entre rendement et liquidité.` });
      if (capEpargne >= 300) forces.push({ t: "Capacité d'épargne réelle", d: `${eur(capEpargne)} par mois mobilisables — de quoi financer un projet structurant sans dégrader le train de vie.` });
      if (S.ppMensuels > 0) forces.push({ t: "Discipline d'épargne", d: `${eur(S.ppMensuels)} de versements programmés déjà en place : l'effort est automatisé.` });
      if (F.deductions > 0 || F.reductions > 0) forces.push({ t: "Fiscalité déjà optimisée", d: `${eur(F.gainTotal)} d'économie d'impôt générée cette année par les dispositifs en place.` });
      if (deuxRevenus && bas.r > 0 && disparite < 1.4) forces.push({ t: "Deux revenus équilibrés", d: `${eur(revC)} et ${eur(revJ)} : la disparition d'un revenu ne ferait pas basculer le foyer, la structure est robuste.` });
      if (S.patrimoineNet >= 300000) forces.push({ t: "Patrimoine net significatif", d: `${eur(S.patrimoineNet)} d'actif net.` });

      // ———————————————————————————————————————————————
      // FAIBLESSES (le miroir court des problématiques, plus quelques angles morts)
      // ———————————————————————————————————————————————
      if (locataire) faiblesses.push({ t: "Locataire", d: `${eur(loyerRP)} par mois de loyer, aucun patrimoine immobilier constitué.` });
      if (moisCharges != null && moisCharges < 3) faiblesses.push({ t: "Épargne de précaution insuffisante", d: `${eur(epargne)} seulement, soit ${moisCharges.toFixed(1).replace('.', ',')} mois de charges (3 à 6 recommandés).` });
      if (revFoyer * 12 > 100000 && epargne < revFoyer * 6) faiblesses.push({ t: "Épargne très faible au regard des revenus", d: `${eur(epargne)} d'épargne pour ${eur(revFoyer)} de revenus mensuels — à ce niveau de revenus, moins de six mois d'épargne est une anomalie${age != null && age >= 45 ? ", d'autant plus à " + age + " ans" : ""}.` });
      if (deuxRevenus && partHaut >= 0.6 && disparite >= 1.6) faiblesses.push({ t: "Disparité de revenus dans le couple", d: `${pc(partHaut)} des revenus du foyer reposent sur ${haut.n}.` });
      if (per === 0) faiblesses.push({ t: "Aucun dispositif retraite en place", d: "pas de PER : ni préparation de complément de revenu, ni déduction fiscale." });
      if (avVie === 0) faiblesses.push({ t: "Pas d'assurance-vie", d: "Ni antériorité fiscale, ni outil de transmission hors succession." });
      if (estTNS && prevQ !== "oui") faiblesses.push({ t: "Prévoyance TNS non confirmée", d: "Le revenu professionnel n'est pas sécurisé en cas d'arrêt de travail." });
      if (taux != null && taux > 0.35) faiblesses.push({ t: "Endettement supérieur à 35 %", d: `${pc(taux)} — plus aucun financement accessible en l'état.` });
      if (F.impotNet >= 2000 && F.deductions === 0 && F.reductions === 0) faiblesses.push({ t: "Fiscalité subie", d: `${eur(F.impotNet)} d'impôt à ${pc(F.tmi)} de tranche marginale, sans aucun levier activé.` });
      if (marie && d.ddvQ !== "oui") faiblesses.push({ t: "Conjoint insuffisamment protégé", d: recomposee ? "Famille recomposée sans donation au dernier vivant : quart en pleine propriété seulement." : "Pas de donation au dernier vivant confirmée." });
      if ((pacse || unionLibre) && d.testamentQ !== "oui") faiblesses.push({ t: unionLibre ? "Concubin sans droits" : "Partenaire sans droits", d: "Sans testament, le survivant n'hérite de rien." });
      if (S.actifTotal >= 100000 && age != null && age >= 50 && (d.locatifs || []).length > 0 && revFoyer > 0 && epargne < revFoyer * 3) faiblesses.push({ t: "Succession à préparer — épargne faible face au locatif", d: `arbitrer quelques biens locatifs vers l'assurance-vie (abattement 152 500 € par parent et par enfant) peut éviter de très lourds droits de succession — arbitrage d'optimisation.` });
      if (livrets > 0 && chFoyer > 0 && livrets > Math.max(cibleP * 1.5, chFoyer * 6)) faiblesses.push({ t: "Liquidités dormantes", d: `${eur(livrets)} sur livrets, rémunérés sous l'inflation.` });
      if (bienNonRenego > 0) faiblesses.push({ t: "Assurance emprunteur d'origine", d: `${bienNonRenego} crédit${bienNonRenego > 1 ? "s" : ""} jamais renégocié${bienNonRenego > 1 ? "s" : ""} — surcoût structurel.` });
      if (enfantsJeunes > 0 && budgetEtudes === 0 && epargne < 15000 * enfantsJeunes) faiblesses.push({ t: "Études des enfants non provisionnées", d: `${enfantsJeunes} enfant${enfantsJeunes > 1 ? "s" : ""} mineur${enfantsJeunes > 1 ? "s" : ""}, aucune épargne dédiée.` });
      if (S.ppMensuels === 0 && (revC > 0 || revJ > 0)) faiblesses.push({ t: "Absence totale d'épargne mensuelle", d: `aucun versement programmé — une petite épargne régulière sur une longue durée permettra d'atteindre un capital significatif : 200 €/mois avec une hypothèse de rendement de 4 % pendant 20 ans représentent ${eur(Math.round(200 * ((Math.pow(1 + 0.04 / 12, 240) - 1) / (0.04 / 12))))}.` });
      if (divorce && (d.ddvAncienneQ === "oui" || d.ddvAncienneQ === "nsp")) faiblesses.push({ t: "Dispositions successorales obsolètes", d: "Donation antérieure révoquée de plein droit par le divorce (art. 265 C. civ.) — schéma à reconstruire." });

      // ———————————————————————————————————————————————
      // RÉSUMÉ NARRATIF
      // ———————————————————————————————————————————————
      // Résumé en PUCES synthétiques : un fait par ligne, le chiffre d'abord —
      // pas de longues phrases (demande expresse du cabinet). t = null → ligne
      // d'identité affichée en grande serif ; sinon {t: libellé, d: fait court}.
      // ÉTAT DES LIEUX pur : une information par tuile, lisible d'un coup d'œil.
      // Règle du cabinet : le résumé CONSTATE, il n'analyse pas — la capacité d'emprunt,
      // les déséquilibres de revenus et toute lecture critique relèvent des points forts /
      // points de vigilance / problématiques, jamais de l'état des lieux.
      const phrases = [];
      phrases.push({ t: null, d:
        `${nomC}${age != null ? `, ${age} ans` : ""}`
        + (enCouple && d.conjointQ === "oui" ? ` avec ${nomJ}${ageJ != null ? `, ${ageJ} ans` : ""}` : "")
        + (nbEnf > 0 ? `, ${nbEnf} enfant${nbEnf > 1 ? "s" : ""} à charge${enfantHandicap ? " dont un en situation de handicap" : ""}` : ", sans enfant à charge")
        + ` — ${F.parts} part${F.parts > 1 ? "s" : ""} fiscale${F.parts > 1 ? "s" : ""}.`
      });
      // Trois lignes d'identification : état civil, adresse, composition du foyer.
      // (Les données chiffrées vivent dans « Les chiffres du dossier », pas ici.)
      {
        const REGIMES = { communaute_acquets: "communauté réduite aux acquêts", separation: "séparation de biens", communaute_universelle: "communauté universelle", participation_acquets: "participation aux acquêts", autre: d.regimeAutre || "contrat particulier" };
        const etatCivil = `${situationLib.charAt(0).toUpperCase()}${situationLib.slice(1)}${marie && d.regime ? ` — régime : ${REGIMES[d.regime] || d.regime}` : ""}${marie ? ` · donation au dernier vivant : ${d.ddvQ === "oui" ? "oui" : d.ddvQ === "non" ? "non" : "à vérifier"}` : (pacse || unionLibre) ? ` · testament : ${d.testamentQ === "oui" ? "oui" : d.testamentQ === "non" ? "non" : "à vérifier"}` : ""}`;
        phrases.push({ info: true, t: "État civil", d: etatCivil });
        if (d.adresseQ === "oui" && (d.adresse || d.ville)) phrases.push({ info: true, t: "Adresse", d: [d.adresse, [d.codePostal, d.ville].filter(Boolean).join(" ")].filter(Boolean).join(", ") });
        if ((d.tel || "").trim() || (d.email || "").trim()) phrases.push({ info: true, t: "Contact", d: [(d.tel || "").trim(), (d.email || "").trim()].filter(Boolean).join(" · ") });
        const enfListe = (d.enfantsQ === "oui" ? (d.enfants || []) : []).map(e => `${(e.prenom || "enfant").trim()}${e.annee ? ` (${new Date().getFullYear() - ncInt(e.annee)} ans)` : ""}`);
