        phrases.push({ info: true, t: "Composition du foyer", d: enfListe.length ? `${enfListe.length} enfant${enfListe.length > 1 ? "s" : ""} : ${enfListe.join(", ")}` : "Sans enfant à charge" });
      }
      if (objectifs.length) {
        const libs = objectifs.map(v => { const o = NC_OBJECTIFS.find(x => x.v === v); return o ? o.l : v; });
        phrases.push({ t: "Objectifs exprimés", c: "#b8924e", list: libs, sub: d.objectifPrio ? `priorité : ${(NC_OBJECTIFS.find(x => x.v === d.objectifPrio) || {}).l || d.objectifPrio}` : "", large: true });
      }
      // Objectifs recommandés par le cabinet : formulés en langage client, chiffrés,
      // tirés du dossier (règles cabinet) — présentés VERTICALEMENT.
      {
        const conseils = [];
        // 1. Effort d'épargne sous la moyenne française (INSEE ≈ 18 % du revenu disponible).
        const effortM = S.ppMensuels || 0;
        const pctEffort = revFoyer > 0 ? effortM / revFoyer : null;
        if (pctEffort != null && pctEffort < NC_EPARGNE_MOYENNE_FR) {
          conseils.push(`Augmenter votre épargne mensuelle, actuellement à ${effortM > 0 ? pc(pctEffort) : "0 %"} contre 18 % en moyenne pour les Français`);
        }
        // 2. Capacité d'endettement disponible non utilisée (même seuil que le point fort).
        if (capMax >= 80000) {
          conseils.push("Utiliser votre capacité d'endettement pour préparer votre retraite et protéger vos héritiers");
        }
        // 3. Baisse de revenus au passage à la retraite (taux de remplacement cabinet).
        {
          const estRetraite = (d.activites || []).includes("retraite");
          const estRetraiteJ = (((d.conjointRev || {}).activites) || []).includes("retraite");
          let pension = 0, actifs = 0;
          if (!estRetraite && revC > 0) { pension += revC * ncTauxRemplacement(revC); actifs += revC; }
          if (!estRetraiteJ && revJ > 0) { pension += revJ * ncTauxRemplacement(revJ); actifs += revJ; }
          const baisse = actifs - pension;
          if (actifs > 0 && baisse > 300) {
            conseils.push(`Pension de retraite estimée autour de ${eur(Math.round(pension))}/mois — la création de revenus complémentaires pour pallier cette baisse est vivement recommandée`);
          }
        }
        // Complément éventuel par les enjeux des problématiques hautes (sans doublonner).
        if (conseils.length < 3) {
          problematiques.filter(p => p.priorite === "haute").map(p => p.enjeu || p.titre).filter(Boolean)
            .forEach(e => { if (conseils.length < 4 && !conseils.includes(e)) conseils.push(e); });
        }
        if (conseils.length) phrases.push({ t: "Objectifs recommandés par le cabinet", c: "#0f766e", list: conseils.slice(0, 4), large: true });
      }
      // Préconisations : les solutions du cabinet, distinctes des objectifs.
      {
        const precos = [];
        precos.push(avVie > 0 ? `Audit du contrat d'assurance-vie existant : vérifier qu'il correspond à votre profil de risque et que son rendement et sa gestion donnent satisfaction — sinon, arbitrage ou optimisation du contrat recommandé${age != null && age >= 65 ? " (versements avant l'anniversaire des 70 ans, art. 990 I CGI)" : ""}` : "Ouverture d'un contrat d'assurance-vie");
        if (capMax >= 80000) precos.push("Réalisation d'un investissement immobilier locatif, financé à crédit, afin de protéger les héritiers et préparer des revenus futurs à la retraite");
        if (revC > 0 || revJ > 0) precos.push({ txt: "Création de votre espace personnel sur info-retraite.fr pour obtenir l'estimation officielle de votre pension", href: "https://www.info-retraite.fr", linkLabel: "Ouvrir info-retraite.fr ↗" });
        // PER : TOUJOURS en dernier — et une SEULE mention dans toute la synthèse
        // quand le levier fiscal n'est pas réel (règle cabinet des 5 000 € à 30 %).
        if (perPertinent) {
          precos.push(per > 0 ? `Versements sur le PER existant — déduction à votre TMI de ${pc(F.tmi)}` : `L'ouverture d'un PER est vivement conseillée — déduction des versements à votre TMI de ${pc(F.tmi)}`);
        } else if (F.tmi === 0.30) {
          precos.push("Et seulement pour finir : ouverture d'un PER (plan d'épargne retraite) dès que 5 000 € de vos revenus auront basculé dans une tranche à 30 %, afin de profiter pleinement du levier fiscal");
        } else {
          precos.push("L'ouverture d'un PER est vivement conseillée à partir du moment où votre TMI passe à 30 %");
        }
        if (precos.length) phrases.push({ t: "Préconisations", c: "#6d28d9", list: precos, large: true });
      }

      // Tri par priorité : les sujets « haute » ouvrent l'entretien.
      const ordre = { haute: 0, moyenne: 1 };
      const rang = (x) => (ordre[x] === undefined ? 2 : ordre[x]);
      problematiques.sort((a, b) => rang(a.priorite) - rang(b.priorite));

      return {
        resume: phrases, forces, faiblesses, problematiques,
        chiffresCles: {
          revenusMensuels: revFoyer, chargesMensuelles: chFoyer, tauxEndettement: taux,
          capaciteEmprunt20: S.cap20, capaciteEmpruntMax: capMax, capaciteLocativeMax: capLocMax, dureeEmpruntMax: dureeMax, epargne, patrimoineNet: S.patrimoineNet,
          impotNet: F.impotNet, tmi: F.tmi,
          revenuClient: revC, revenuConjoint: revJ, partRevenuPrincipal: partHaut,
        },
      };
    }
    // Graphique : positionnement du quotient familial sur les tranches du barème
    function NcGraphBareme({ qf }) {
      const axisMax = Math.max(100000, Math.min(250000, (qf || 0) * 1.35));
      const W = 600, H = 84, barY = 30, barH = 26;
      const x = (v) => Math.min(W, (v / axisMax) * W);
      let prev = 0;
      const fmt = (n) => n >= 1000 ? Math.round(n / 1000) + " k€" : n + " €";
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: 110 }}>
          {NC_BAREME_IR.map((t, i) => {
            const de = prev; const a = Math.min(t.max, axisMax); prev = t.max;
            if (de >= axisMax) return null;
            const filled = qf > de;
            const fillTo = Math.min(qf, a);
            return (
              <g key={i}>
                <rect x={x(de)} y={barY} width={Math.max(0, x(a) - x(de))} height={barH} fill={NC_BAREME_COLORS[i]} opacity="0.18" />
                {filled && <rect x={x(de)} y={barY} width={Math.max(0, x(fillTo) - x(de))} height={barH} fill={NC_BAREME_COLORS[i]} opacity="0.9" />}
                <text x={x(de) + 4} y={barY + barH + 14} fontSize="9" fill="#78716c" fontFamily="Inter, sans-serif">{(t.taux * 100).toFixed(0)} %</text>
                {i > 0 && <text x={x(de)} y={barY - 6} fontSize="8.5" fill="#a8a29e" textAnchor="middle" fontFamily="Inter, sans-serif">{fmt(de)}</text>}
                {i > 0 && <line x1={x(de)} y1={barY - 3} x2={x(de)} y2={barY + barH + 3} stroke="#d6d3d1" strokeWidth="1" strokeDasharray="2,2" />}
              </g>
            );
          })}
          {qf > 0 && (
            <g>
              <line x1={x(qf)} y1={barY - 12} x2={x(qf)} y2={barY + barH + 4} stroke="#1c1917" strokeWidth="2" />
              <circle cx={x(qf)} cy={barY - 14} r="3" fill="#1c1917" />
              <text x={Math.min(x(qf) + 6, W - 120)} y={barY - 16} fontSize="10" fontWeight="700" fill="#1c1917" fontFamily="Inter, sans-serif">QF : {new Intl.NumberFormat('fr-FR').format(Math.round(qf))} € / part</text>
            </g>
          )}
        </svg>
      );
    }

    const NC_ETAPES = [

    function NouveauClientModal({ inputs, upd, onClose, niveauInitial }) {
      const [niveau, setNiveau] = useState(niveauInitial || (inputs.audit ? "complet" : "rapide"));
      const [touched, setTouched] = useState(false);
      const [etape, setEtape] = useState(1);
      const [visited, setVisited] = useState(() => new Set([1]));
      // Taille de la fenêtre : confort de saisie.
      // "auto" = grand format d'office pour l'étude patrimoniale complète, format compact pour la fiche rapide.
      // Dès que le conseiller clique Agrandir / Réduire, son choix est mémorisé d'une session à l'autre.
      const [grandPref, setGrandPref] = useState(() => { try { return localStorage.getItem('figara_audit_taille') || "auto"; } catch { return "auto"; } });
      const grand = grandPref === "auto" ? niveau === "complet" : grandPref === "1";
      const toggleGrand = () => { const n = grand ? "0" : "1"; setGrandPref(n); try { localStorage.setItem('figara_audit_taille', n); } catch {} };
      const [d, setD] = useState(() => ({
        nom: inputs.clientNom || "", prenom: inputs.clientPrenom || "",
        tel: inputs.clientTel || "", email: inputs.clientEmail || "",
        ...JSON.parse(JSON.stringify(AUDIT_DEFAUT)),
        ...migrateAudit(inputs.audit ? JSON.parse(JSON.stringify(inputs.audit)) : null),
      }));
      const set = (k, v) => setD(p => ({ ...p, [k]: v }));
      const setAct = (key, field, v) => setD(p => ({ ...p, [key]: { ...(p[key] || {}), [field]: v } }));
      const setObj = (key, field, v) => setD(p => ({ ...p, objectifsDetail: { ...p.objectifsDetail, [key]: { ...(p.objectifsDetail[key] || {}), [field]: v } } }));
      // Lignes internes à un objectif (un enfant, un objectif libre…)
      const objLignes = (key) => ((d.objectifsDetail[key] || {}).lignes) || [];
      const majObjLignes = (key, fn) => setD(p => {
        const o = p.objectifsDetail[key] || {};
        return { ...p, objectifsDetail: { ...p.objectifsDetail, [key]: { ...o, lignes: fn(o.lignes || []) } } };
      });
      const setObjLigne = (key, id, field, v) => majObjLignes(key, ls => ls.map(x => x.id === id ? { ...x, [field]: v } : x));
      const addObjLigne = (key, item) => majObjLignes(key, ls => [...ls, { id: ls.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1, ...item }]);
      const delObjLigne = (key, id) => majObjLignes(key, ls => ls.filter(x => x.id !== id));
      // Bascule d'un objectif : si l'objectif décoché était l'objectif prioritaire, la priorité est effacée.
      // Le dernier objectif coché passe EN TÊTE : son bloc de chiffrage apparaît juste
      // sous les cartes, sans que le conseiller ait à scroller pour le trouver.
      const toggleObjectif = (v) => setD(p => {
        const cur = p.objectifs || [];
        const nx = cur.includes(v) ? cur.filter(x => x !== v) : [v, ...cur];
        return { ...p, objectifs: nx, objectifPrio: nx.includes(p.objectifPrio) ? p.objectifPrio : "" };
      });
      const setList = (key, id, field, v) => setD(p => ({ ...p, [key]: p[key].map(x => x.id === id ? { ...x, [field]: v } : x) }));
      const addList = (key, item) => setD(p => ({ ...p, [key]: [...p[key], { id: (p[key].reduce((m,x)=>Math.max(m,x.id),0)) + 1, ...item }] }));
      const rmList = (key, id) => setD(p => ({ ...p, [key]: p[key].filter(x => x.id !== id) }));
      // Conteneur scrollable du corps du modal : remonté en haut à CHAQUE changement
      // d'étape (sinon on arrive sur la nouvelle étape au milieu de la page, là où
      // le scroll de l'étape précédente s'était arrêté).
      // Fiche placement ouverte en pop-up (id de l'avoir, ou null)
      const [ficheAvoir, setFicheAvoir] = useState(null);
      // Fenêtre des hypothèses de la capacité d'emprunt (synthèse)
      const [hypoOpen, setHypoOpen] = useState(false);
      // Garde-fou étape 6 → 7 : la capacité d'épargne est LE sujet essentiel —
      // si elle n'est pas renseignée au moment de passer à la synthèse, une
      // fenêtre bloque le passage et pose la question.
      const [capGateOpen, setCapGateOpen] = useState(false);
      const capRenseignee = !!(d.capaciteEpargne && (d.capaciteEpargne !== "libre" || ncInt(d.capaciteEpargneLibre) > 0));
      // Autocomplétion adresse via l'API officielle geo.api.gouv.fr (gratuite, sans clé) :
      // code postal complet → ville(s) proposée(s) ; ville tapée → communes puis codes postaux.
      const [villeSug, setVilleSug] = useState([]);
      const [cpSug, setCpSug] = useState([]);
      const villeTimer = useRef(null);
      const saisirCp = (cp) => {
        set("codePostal", cp); setCpSug([]);
        if (/^\d{5}$/.test(cp.trim())) {
          fetch(`https://geo.api.gouv.fr/communes?codePostal=${cp.trim()}&fields=nom&format=json`)
            .then(r => r.json())
            .then(cs => { const noms = (cs || []).map(c => c.nom); setVilleSug(noms.length > 1 ? noms.slice(0, 8) : []); if (noms.length === 1) set("ville", noms[0]); })
            .catch(() => setVilleSug([]));
        } else setVilleSug([]);
      };
      const saisirVille = (v) => {
        set("ville", v); setVilleSug([]);
        if (villeTimer.current) clearTimeout(villeTimer.current);
        if ((v || "").trim().length >= 3) {
          villeTimer.current = setTimeout(() => {
            fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(v.trim())}&fields=nom,codesPostaux&boost=population&limit=5`)
              .then(r => r.json())
              .then(cs => {
                const c = (cs || []).find(x => x.nom.toLowerCase() === v.trim().toLowerCase()) || (cs || [])[0];
                if (c && c.codesPostaux && c.codesPostaux.length) setCpSug(c.codesPostaux.slice(0, 10)); else setCpSug([]);
              })
              .catch(() => setCpSug([]));
          }, 450);
        } else setCpSug([]);
      };
      const scrollRef = useRef(null);

      // est par ailleurs inhibé pendant 900 ms après un changement d'étape) — garantit
      // d'arriver EN HAUT de chaque étape quoi qu'il se soit monté dans la page.
      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = 0;
        const t1 = setTimeout(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, 200);
        const t2 = setTimeout(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, 500);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, [etape, niveau]);
      const goEtapeRaw = (n) => { try { window.__ncStepTs = Date.now(); } catch (e) {} setEtape(n); setVisited(p => new Set([...p, n])); };
      const goEtape = (n) => { if (n === 7 && !capRenseignee) { setCapGateOpen(true); return; } goEtapeRaw(n); };
      // Export du dossier complet en JSON — fichier destiné à l'analyse par le skill
      // « analyse-etude-patrimoniale » (Claude) ou à l'archivage. Contient tout ce qui
      // a été saisi dans l'audit (objet d), avec un en-tête de format versionné.
      const exporterDossier = () => {
        try {
          const payload = { format: "figara-audit", version: 1, build: "v77", exporteLe: new Date().toISOString(), dossier: d };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const aEl = document.createElement("a");
          const nomFic = [(d.nom || "").trim(), (d.prenom || "").trim()].filter(Boolean).join("-").replace(/[^\wÀ-ÿ-]+/g, "_") || "dossier";
          aEl.href = url;
          aEl.download = `etude-patrimoniale-${nomFic}-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(aEl); aEl.click(); aEl.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
        } catch (e) { console.warn("export dossier", e); }
      };
      // Alias stables vers les micro-composants module (même référence à chaque render)
      const Chip = NcChip, Chips = NcChips, MultiChips = NcMultiChips, OuiNon = NcOuiNon, L = NcL, Txt = NcTxt, Eur = NcEur, EurSigne = NcEurSigne, Q = NcQ, Bloc = NcBloc, Tuiles = NcTuiles, SousSection = NcSousSection, ObjCarte = NcObjCarte, ObjBloc = NcObjBloc, Icone = NcIcone;
      const EurQuick = NcEurQuick, Details = NcDetails, Banque = NcBanque, Slider = NcSlider, BanqueSelect = NcBanqueSelect, Select = NcSelect;
      // Quotités d'assurance emprunteur : à renseigner sur chaque crédit dès que le foyer
      // est en couple — déterminant pour toute projection de décès (le crédit peut être
      // soldé par l'assurance selon la répartition).
      const QUOTITE_OPTS = [
        { v: "100_100", l: "100 % sur chaque tête" },
        { v: "100_client", l: `100 % ${d.civilite === "Mme" ? "Madame" : "Monsieur"}` },
        { v: "100_conjoint", l: `100 % ${d.civilite === "Mme" ? "Monsieur" : "Madame"}` },
        { v: "50_50", l: "50 / 50" },
        { v: "70_30", l: "70 / 30" },
        { v: "30_70", l: "30 / 70" },
        { v: "nsp", l: "À vérifier" },
      ];
      // Banques déjà citées dans le dossier (banque principale, conjoint, crédits) :
      // proposées en pastilles partout où une banque est demandée — plus de re-saisie.
      const banquesConnues = useMemo(() => {
        const out = [];
        const push = (x) => { const t = (x || "").trim(); if (t && !out.some(y => y.toLowerCase() === t.toLowerCase())) out.push(t); };

        (d.locatifs || []).forEach(l => push(l.banque));
        (d.biens || []).forEach(b => push(b.banque));
        (d.credits || []).forEach(c => push(c.banque));

      }, [d]);

      const marie = d.situation === "marie";
      const pacse = d.situation === "pacse";
      const unionLibre = d.situation === "union_libre";
      const enCouple = marie || pacse || unionLibre;
      // Régime matrimonial → mode de saisie de la détention des placements (étape 5) :
      //  • communauté réduite aux acquêts : le nom sur le compte ne détermine pas la propriété
      //    (présomption de communauté, art. 1402 C. civ.) → on ne demande QUE l'origine des fonds.
      //  • communauté universelle : tout est commun sauf clause d'exclusion → une seule question,
      //    « épargne commune / propre Monsieur / propre Madame ».
      //  • autres régimes (séparation, participation, PACS, union libre) : saisie complète inchangée.
      const regimeCommunaute = marie && d.regime === "communaute_acquets";
      const regimeUniverselle = marie && d.regime === "communaute_universelle";
      const cliEstMme = d.civilite === "Mme";
      // Famille recomposée : au moins un enfant qui n'est pas issu du couple actuel.
      // C'est le cas où la donation au dernier vivant devient déterminante (art. 757 C. civ.).
      const recomposee = enCouple && (d.enfants || []).some(e => e.filiation && e.filiation !== "commun");
      const divorce = d.situation === "divorce";
      const nomOk = d.nom.trim().length > 0;
      const prenomOk = d.prenom.trim().length > 0;
      const ageClient = ncAgeDate(d.dateNaissance);
      const aDesEnfants = d.enfantsQ === "oui" && d.enfants.length > 0;
      const obj = (v) => (d.objectifs || []).includes(v);
      const objDef = (v) => NC_OBJECTIFS.find(x => x.v === v) || NC_OBJECTIFS[0];
      const nbObj = (d.objectifs || []).length;
      // La prévoyance n'est proposée que si le foyer compte un travailleur non salarié :
      // un salarié est déjà couvert par le régime obligatoire et la prévoyance collective d'entreprise.
      const estTNS = ((d.activites || []).some(v => v === "independant" || v === "chef"))
        || (d.conjointQ === "oui" && (((d.conjointRev && d.conjointRev.activites) || []).some(v => v === "independant" || v === "chef")));
      const anRef = new Date().getFullYear();
      // Total des loyers nus du foyer : détermine le basculement micro-foncier → réel (plafond 15 000 €)
      const totalNuAnnuel = (d.locatifs || []).filter(l => l.type !== "meublee").reduce((s, l) => s + ncInt(l.loyer) * 12, 0)
        + (d.biens || []).filter(b => b.enLocationQ === "oui").reduce((s, b) => s + ncInt(b.loyer) * 12, 0);
      const synth = useMemo(() => ncCalcEndettement(d), [d]);
      // Synthèse narrative : résumé, forces, faiblesses et problématiques chiffrées (étape 7).
      const syn = useMemo(() => { try { return ncSynthese(d); } catch (e) { console.warn('synthèse', e); return null; } }, [d]);
      // TMI trouvée par le simulateur fiscal — cochée automatiquement dans le dossier
      // tant que le conseiller ne l'a pas corrigée à la main (tmiManuel).
      // La base retenue est le revenu APRÈS déductions (PER) : c'est elle qui détermine la TMI.
      const irAuto = useMemo(() => ncCalcFisc(d, anRef).ir, [d]);
      useEffect(() => {
        if (niveau === "complet" && irAuto && !d.tmiManuel && d.tmi !== irAuto.tmi) set("tmi", irAuto.tmi);
      }, [irAuto ? irAuto.tmi : null, d.tmiManuel, niveau]);

      const valider = () => {
        if (!nomOk || !prenomOk) { setTouched(true); if (niveau === "complet") goEtape(1); return; }
        upd("clientType", "particulier");
        upd("clientNom", d.nom.trim().toUpperCase());
        upd("clientPrenom", d.prenom.trim());
        upd("clientTel", d.tel.trim());
        upd("clientEmail", d.email.trim());
        if (niveau === "complet") {
          // Répercussions utiles sur la simulation
          upd("situationFamiliale", (marie || pacse) ? "couple" : "celibataire");
          if (ageClient) upd("ageSouscripteur", ageClient);
          if (d.tmi != null) upd("tauxIR", d.tmi);
          const nbEnfants = d.enfants.filter(e => (e.prenom || "").trim() || e.annee).length;
          if (nbEnfants > 0) upd("nbBeneficiaires", nbEnfants);
          const { nom, prenom, tel, email, ...audit } = d;
          // Opportunités commerciales structurées (exploitables par un CRM depuis
          // la table simulations → inputs.audit.opportunites)
          // Synthèse narrative calculée une fois : elle alimente à la fois les opportunités
          // (chaque problématique est une piste de travail pour le CRM) et le bloc narratif.
          const nar = (() => { try { return ncSynthese(d); } catch (e) { console.warn('synthèse narrative', e); return null; } })();
          const opportunites = [];
          (nar ? nar.problematiques : []).forEach(q => {
            opportunites.push({
              type: "problematique_audit", code: q.code, priorite: q.priorite, famille: q.famille,
              titre: q.titre, constat: q.constat, consequence: q.consequence, enjeu: q.enjeu,
              preconisation: q.preconisation, solutions: q.solutions,
              chiffres: (q.chiffres || []).map(c => ({ libelle: c.l, valeur: c.v })),
            });
          });
          if (d.logement === "proprietaire" && d.rpCreditQ === "oui" && d.rpAssurRenegociee === "non") {
            opportunites.push({
              type: "assurance_pret_a_renegocier", bien: "residence_principale",
              assureurActuel: d.rpAssurAssureur || null, cotisationMensuelle: d.rpAssurCotisation || null,
              capitalRestantDu: d.rpCrd || null, mensualite: d.rpMensualite || null,
              tauxCredit: d.rpTaux || null, dureeRestanteAnnees: d.rpDureeRestante || null,
              banque: d.rpBanque || null, note: d.rpAssurNote || null,
            });
          }
          (d.locatifs || []).forEach((l, i) => {
            if (l.creditQ === "oui" && l.assurQ === "non") {
              opportunites.push({
                type: "assurance_pret_a_renegocier", bien: l.nom || `bien_locatif_${i + 1}`,
                assureurActuel: l.assurAssureur || null, cotisationMensuelle: l.assurCotisation || null,
                capitalRestantDu: l.crd || null, mensualite: l.mensualite || null,
                banque: l.banque || null, note: l.assurNote || null,
              });
            }
          });
          (d.biens || []).forEach((b, i) => {
            if (b.creditQ === "oui" && b.assurQ === "non") {
              opportunites.push({
                type: "assurance_pret_a_renegocier", bien: b.nom || `autre_bien_${i + 1}`,
                assureurActuel: b.assurAssureur || null, cotisationMensuelle: b.assurCotisation || null,
                capitalRestantDu: b.crd || null, mensualite: b.mensualite || null,

              });
            }
          });
          if (marie && (d.ddvQ === "non" || d.ddvQ === "nsp")) {
            opportunites.push({
              type: "donation_dernier_vivant_a_mettre_en_place", statut: d.ddvQ,
              priorite: recomposee ? "haute" : "normale", familleRecomposee: recomposee,
              note: recomposee
                ? "Famille recomposée sans DDV — conjoint plafonné au 1/4 en pleine propriété sans option d'usufruit (art. 757 C. civ.). Rendez-vous notaire prioritaire."
                : "Couple marié sans DDV confirmée — protection du conjoint à organiser (notaire).",
            });
          }
          if (pacse && (d.testamentQ === "non" || d.testamentQ === "nsp")) {
            opportunites.push({ type: "testament_pacs_a_rediger", statut: d.testamentQ, priorite: recomposee ? "haute" : "normale", note: "Partenaires de PACS sans testament confirmé — sans testament le partenaire n'hérite de rien (notaire)." });
          }
          if (unionLibre && (d.testamentQ === "non" || d.testamentQ === "nsp")) {
            opportunites.push({ type: "testament_concubin_a_rediger", statut: d.testamentQ, priorite: "haute", note: "Concubins sans testament — le concubin n'hérite de rien et reste taxé à 60 % ; assurance-vie et testament à mettre en place (notaire)." });
          }
          if (divorce && (d.ddvAncienneQ === "oui" || d.ddvAncienneQ === "nsp")) {
            opportunites.push({ type: "ddv_revoquee_par_divorce_a_auditer", statut: d.ddvAncienneQ, note: "DDV antérieure révoquée de plein droit par le divorce (art. 265 C. civ.) — protection à reconstruire, clauses bénéficiaires à mettre à jour (notaire)." });
          }
          // Avantages fiscaux à durée limitée : chaque extinction est une opportunité datée.
          const fiscV = ncCalcFisc(d, anRef);
          fiscV.echeancier.forEach(e => {
            opportunites.push({
              type: "reduction_impot_expire", anneeFin: e.annee, aTravaillerAvant: e.annee,
              avantages: e.avantagesPerdus.map(a => ({ code: a.code, libelle: a.libelle, montantAnnuel: a.montant, mode: a.mode })),
              montantAnnuelPerdu: e.montantPerdu,
              impotActuel: fiscV.impotNet, impotApres: e.impotApres, surcoutAnnuel: e.surcout,
              priorite: e.surcout >= 1500 ? "haute" : "normale",
              note: `${e.avantagesPerdus.map(a => a.libelle).join(", ")} : dernière année d'effet ${e.annee}. À partir de ${e.annee + 1} l'impôt passe de ${fiscV.impotNet} € à ${e.impotApres} € (+${e.surcout} €). Prévoir un relais (PER, nouveau dispositif) avant l'échéance.`,
            });
          });
          if (fiscV.impotNet >= 2500 && fiscV.deductions === 0 && (d.tmi || 0) >= 0.30) {
            opportunites.push({
              type: "per_a_mettre_en_place", impotNet: fiscV.impotNet, tmi: d.tmi,
              priorite: "haute",
              note: `Foyer à ${Math.round((d.tmi || 0) * 100)} % de TMI imposé ${fiscV.impotNet} € sans aucune déduction du revenu — un versement PER génère une économie immédiate au taux marginal.`,
            });
          }
          // Synthèse d'endettement figée au moment de la validation (exploitable CRM)
          const synthese = {
            protectionConjoint: {
              situation: d.situation || null,
              donationDernierVivant: marie ? (d.ddvQ || null) : null,
              testamentPacs: pacse ? (d.testamentQ || null) : null,
              testamentConcubin: unionLibre ? (d.testamentQ || null) : null,
              ddvAnterieureAvantDivorce: divorce ? (d.ddvAncienneQ || null) : null,
              familleRecomposee: recomposee,
              enfantsNonCommuns: (d.enfants || []).filter(e => e.filiation && e.filiation !== "commun").length,
            },
            revenusMensuelsRetenus: synth.totalRevenus, chargesMensuelles: synth.totalCharges,
            tauxEndettement: synth.taux != null ? Math.round(synth.taux * 1000) / 10 : null,
            mensualiteDisponible35: synth.dispo35, capaciteEmprunt20ans: synth.cap20, capaciteEmprunt25ans: synth.cap25,
            epargneConstituee: synth.epargneConstituee, versementsProgrammesMensuels: synth.ppMensuels,
            // Détail du revenu net imposable : chaque ligne, sa base et la méthode retenue (auditable)
            revenuImposable: (() => { const det = ncDetailRNI(d); return {
              estime: det.total, saisi: ncInt(d.rniFoyer) || null, retenu: ncInt(d.rniFoyer) || det.total,
              lignes: det.lignes.map(x => ({ poste: x.label, baseAnnuelle: x.brut, methode: x.methode, retenu: x.net, regime: x.regime || null })),
            }; })(),
            // Fiscalité : base, avantages ventilés par nature et échéancier d'extinction
            fiscalite: {
              anneeReference: anRef,
              revenuImposableBrut: fiscV.rniBrut,
              parts: fiscV.parts,
              nbEnfantsHandicap: ncCalcParts(d).nbHandicap || 0,
              deductionsRevenu: fiscV.deductions,
              baseImposable: fiscV.baseImposable,
              impotBareme: fiscV.impotBareme,
              reductionsCredits: fiscV.reductions,
              impotNet: fiscV.impotNet,
              impotSansAvantage: fiscV.impotSansAvantage,
              economieAnnuelle: fiscV.gainTotal,
              tmi: fiscV.tmi, tauxMoyen: Math.round(fiscV.tauxMoyen * 1000) / 10,
              avantages: fiscV.lignes.map(x => ({
                code: x.code, libelle: x.libelle, mode: x.mode, montantAnnuel: x.montant,
                duree: x.dureeType, anneesRestantes: x.dureeRestante, derniereAnnee: x.anneeFin, note: x.note || null,
              })),
              echeancier: fiscV.echeancier.map(e => ({ annee: e.annee, montantPerdu: e.montantPerdu, impotApres: e.impotApres, surcout: e.surcout })),
              impotAExtinctionDesAvantages: fiscV.impotATerme,
              prochaineEcheance: fiscV.prochaineExpiration ? fiscV.prochaineExpiration.annee : null,
            },
            // Conformité LCB-FT : statut PPE déclaré personne par personne
            ppe: { client: d.ppe || "non", conjoint: d.conjointQ === "oui" ? (d.ppeConj || "non") : null,
                   vigilanceRenforcee: d.ppe === "oui" || (d.conjointQ === "oui" && d.ppeConj === "oui") },
            // Détention de l'épargne : qui possède quoi, et origine des fonds (propre / commun)
            epargneParDetenteur: (() => {
              const r = { client: 0, conjoint: 0, commun: 0, indivis: 0, nonPrecise: 0 };
              (d.avoirs || []).forEach(a => { const k = a.titulaire && r[a.titulaire] != null ? a.titulaire : "nonPrecise"; r[k] += ncInt(a.valeur); });
              return r;
            })(),
            epargnePropreEstimee: (d.avoirs || []).filter(a => a.origine === "avant" || a.origine === "succession").reduce((s, a) => s + ncInt(a.valeur), 0),
            // Objectifs : liste libellée + objectif prioritaire, exploitables directement en campagne CRM
            objectifs: (d.objectifs || []).map(v => { const o = NC_OBJECTIFS.find(x => x.v === v); return { code: v, libelle: o ? o.l : v, prioritaire: d.objectifPrio === v }; }),
            objectifPrioritaire: d.objectifPrio ? { code: d.objectifPrio, libelle: (NC_OBJECTIFS.find(x => x.v === d.objectifPrio) || {}).l || d.objectifPrio } : null,
            // Chiffrage des objectifs : capitaux à mobiliser et effort mensuel total demandé au client
            objectifsChiffrage: (() => {
              const od = d.objectifsDetail || {}, has = v => (d.objectifs || []).includes(v);
              const etudes = ((od.etudes && od.etudes.lignes) || []).map(x => ({
                enfant: x.nom || null, horizonAns: ncInt(x.horizon) || null, budget: ncInt(x.budget),
                effortMensuel: ncInt(x.budget) > 0 && ncInt(x.horizon) > 0 ? Math.round(ncInt(x.budget) / (ncInt(x.horizon) * 12)) : 0,
              }));
              const perso = ((od.perso && od.perso.lignes) || []).map(x => ({
                titre: x.titre || "Objectif libre", capital: ncInt(x.capital), mensuel: ncInt(x.mensuel), horizonAns: ncInt(x.horizon) || null, note: x.note || "",
              }));
              const complementRetraite = has("retraite") ? ncInt(od.retraite && od.retraite.revenu) + (d.conjointQ === "oui" ? ncInt(od.retraite && od.retraite.revenuConj) : 0) : 0;
              const effortMensuelTotal =
                (has("etudes") ? etudes.reduce((s, x) => s + x.effortMensuel, 0) : 0) +
                (has("locatif") ? ncInt(od.locatif && od.locatif.mensuel) : 0) +
                (has("fiscalite") ? ncInt(od.fiscalite && od.fiscalite.mensuel) : 0) +
                (has("perso") ? perso.reduce((s, x) => s + x.mensuel, 0) : 0);
              const capitalTotal =
                (has("locatif") ? ncInt(od.locatif && od.locatif.apport) : 0) +
                (has("fiscalite") ? ncInt(od.fiscalite && od.fiscalite.capital) : 0) +

                fiscalite: has("fiscalite") ? { capital: ncInt(od.fiscalite.capital), mensuel: ncInt(od.fiscalite.mensuel), tmi: d.tmi != null ? d.tmi : null } : null,

                objectifsLibres: has("perso") ? perso : null,

            })(),
            // Synthèse narrative : ce que le CRM doit pouvoir restituer tel quel au client

            narratif: (() => {

                  resume: n.resume,

        }
        onClose();
      };

      const accent = niveau === "complet" ? NC_ETAPES[etape - 1].c : "#0f766e";

      const content = (
        <div className={`fixed inset-0 z-50 flex items-center justify-center ${grand ? "p-2 sm:p-4" : "p-4"}`} style={{ background: "rgba(20,17,15,0.55)", backdropFilter: "blur(3px)" }}>
          <div className={`bg-white rounded-2xl shadow-2xl w-full flex flex-col overflow-hidden ${grand ? "max-w-6xl" : "max-w-3xl"}`} style={{ height: grand ? "min(96vh, 1240px)" : "min(92vh, 940px)" }}>
            {/* Liseré coloré brand */}

            <div className={`pt-5 pb-4 border-b border-stone-100 flex-shrink-0 ${grand ? "px-8" : "px-6"}`}>

                  <div className="text-[11px] uppercase tracking-widest font-bold text-red-600 mb-1">Nouveau client</div>
                  <div className="text-[18px] font-bold text-stone-900">{d.prenom || d.nom ? `${d.prenom} ${d.nom}`.trim() : "Renseigner le client"}{ageClient != null && niveau === "complet" ? <span className="num text-[13px] font-semibold text-teal-700 ml-2">· {ageClient} ans</span> : null}</div>

                    {grand ? (

                    ) : (
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>
                    )}
                    <span className="hidden sm:inline">{grand ? "Réduire" : "Agrandir"}</span>
                  </button>
                  <button onClick={onClose} className="p-1.5 text-stone-400 hover:text-stone-900 transition"><I.close/></button>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2 mt-4">
                <button type="button" onClick={() => setNiveau("rapide")}

                    <div>
                      <L>Prénom *</L>
                      <Txt v={d.prenom} on={v => set("prenom", v)} ph="Marie" />

                    </div>
                  </div>

                    <div>
                      <L>Téléphone <span className="normal-case font-normal">(facultatif)</span></L>

                    <div>
                      <L>Email <span className="normal-case font-normal">(facultatif)</span></L>

                    <div>
                      <L>Nom *</L>
                      <Txt v={d.nom} on={v => set("nom", v)} ph="DUPONT" />

                          {v:"participation_acquets",l:"Participation aux acquêts"},

                          </div>

                      </div>

                            <div>
                              <div className="text-[11.5px] font-bold text-stone-700 mb-1">Mensualité de crédit envisagée</div>

                      </div>

                    {d.logement === "proprietaire" && (

                        </div>
                        <Q q="Un crédit est-il en cours sur ce bien ?" val={d.rpCreditQ} on={v => set("rpCreditQ", v)}>
                          <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                            <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Dans quelle banque ?</div><BanqueSelect v={d.rpBanque} on={v => set("rpBanque", v)} known={banquesConnues} /></div>
                            <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Capital restant dû</div><Slider v={d.rpCrd} on={v => set("rpCrd", v)} min={0} max={ncInt(d.rpValeur) || 1500000} step={5000} /></div>
                            <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Mensualité</div><Slider v={d.rpMensualite} on={v => set("rpMensualite", v)} min={500} max={4000} step={50} unit="€/mois" /></div>

                            </div>

                  {recomposee && marie && d.ddvQ !== "oui" && (

                        Avec au moins un enfant d'une autre union, le conjoint survivant est <span className="font-bold">plafonné au ¼ en pleine propriété, sans option d'usufruit</span> (art. 757 C. civ.). Une donation au dernier vivant lui rouvre les trois options, dont l'usufruit du logement.
                      </div>

              {/* ============ ÉTAPE 3 : ACTIVITÉ & REVENUS ============ */}
              {niveau === "complet" && etape === 3 && (
                <div>
                  <NcActivitesPanel titre="Quelle est votre situation professionnelle ?" p={d} on={(k, v) => set(k, v)} onObj={(o, f, v) => setAct(o, f, v)} anRef={anRef} />

                        onObj={(o, f, v) => setD(prev => ({ ...prev, conjointRev: { ...(prev.conjointRev || {}), [o]: { ...(((prev.conjointRev || {})[o]) || {}), [f]: v } } }))}
                        anRef={anRef} />
                    </div>
                  )}


                  {/* Revenus mobiliers — juste après l'activité, avant les fonciers */}
                  <Q q="Percevez-vous des revenus mobiliers (dividendes, intérêts) ?" val={d.mobiliersQ} on={v => set("mobiliersQ", v)}>
                    <div className="flex items-center gap-4 flex-wrap mb-2">
                      <span className="text-[12px] font-semibold text-stone-700">S'agit-il de revenus exceptionnels (non récurrents) ?</span>

                    <div className="grid grid-cols-3 gap-2">
                      <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">{anRef - 1}</div><Eur v={d.mobiliersN1} on={v => set("mobiliersN1", v)} unit="€/an" /></div>

                      <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">{anRef - 3}</div><Eur v={d.mobiliersN3} on={v => set("mobiliersN3", v)} unit="€/an" /></div>
                    </div>
                    <div className="mt-2">
                      <div className="text-[11.5px] font-bold text-stone-700 mb-1">Note</div>
                      <Txt v={d.mobiliersNote} on={v => set("mobiliersNote", v)} ph="Commentaire libre…" />
                    </div>
                  </Q>

                  {/* Revenus fonciers — nue / meublée, biens détaillés */}
                  <Q q="Percevez-vous des revenus fonciers (locations) ?" val={d.fonciersQ} on={v => set("fonciersQ", v)}>
                    <div className="text-[12px] font-semibold text-stone-700 mb-1.5">Combien de logements en location ?</div>
                    <div className="flex flex-wrap gap-1.5 mb-1">
                      {[1,2,3,4,5,6,7,8].map(n => (
                        <Chip key={n} act={d.locatifs.length === n} on={() => {
                          setD(p => {
                            let l = p.locatifs.slice(0, n);
                            while (l.length < n) l.push({ id: l.length + 1, nom: "", type: "", gere: "", regime: "", imposable: "", loyer: "", creditQ: "", mensualite: "", crd: "", note: "" });

                          });
                        }}>{n}</Chip>
                      ))}
                    </div>
                    <div className="text-[10px] text-stone-400 mb-2">Pour chaque logement : nu ou meublé — et si meublé, géré ou non géré.</div>
                    <NcReveal key={d.locatifs.length} last>
                    {d.locatifs.map((l, i) => (
                      <div key={l.id} className="mb-2 bg-stone-50 border border-stone-200 rounded-lg px-3 py-2.5">

                          const saisi = l.imposable != null && String(l.imposable).trim() !== "" && String(l.imposable).trim() !== "-";

                                      <EurSigne v={l.imposable || ""} on={v => setList("locatifs", l.id, "imposable", v)} unit="€/an" ph="ex. 3 200 ou −5 000" />
                                    </div>
                                    <div className="text-[10px] text-stone-500 max-w-sm leading-snug">
                                      {saisi
                                        ? (ncInt(l.imposable) < 0

                                            : <span className="font-semibold" style={{ color: "var(--nc-accent, #6d28d9)" }}>Chiffre saisi retenu tel quel dans la projection d'impôt — l'abattement forfaitaire est ignoré.</span>)
                                        : <>Saisissez le résultat de la dernière déclaration (loyers − charges − intérêts{regL === "reel_bic" ? " − amortissements" : ""}). Un déficit se saisit avec le signe « − ». Sans saisie, l'estimation forfaitaire s'applique.</>}
                                    </div>
                                  </div>
                                </NcReveal>

                          );

                            <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Mensualité</div><Slider v={l.mensualite} on={v => setList("locatifs", l.id, "mensualite", v)} min={500} max={4000} step={50} unit="€/mois" /></div>
                            <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Capital restant dû</div><Slider v={l.crd} on={v => setList("locatifs", l.id, "crd", v)} min={0} max={ncInt(l.valeur) || 1500000} step={5000} /></div>
                            {enCouple && <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Assurance — quotités</div><Select opts={QUOTITE_OPTS} val={l.assurQuotite || ""} on={v => setList("locatifs", l.id, "assurQuotite", v)} /></div>}

                              <div className="grid grid-cols-2 gap-2">
                                <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Assureur actuel</div><Txt v={l.assurAssureur || ""} on={v => setList("locatifs", l.id, "assurAssureur", v)} ph="Ex. contrat groupe banque" /></div>
                                <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Cotisation actuelle</div><Eur v={l.assurCotisation || ""} on={v => setList("locatifs", l.id, "assurCotisation", v)} unit="€/mois" /></div>
                              </div>
                              <div className="mt-2"><div className="text-[11.5px] font-bold text-stone-700 mb-1">Note</div><Txt v={l.assurNote || ""} on={v => setList("locatifs", l.id, "assurNote", v)} ph="Commentaire libre…" /></div>
                            </div>
                          )}
                          </NcReveal>
                        )}
                        <div className="mt-2">
                          <div className="text-[11.5px] font-bold text-stone-700 mb-1">Note</div>
                          <Txt v={l.note || ""} on={v => setList("locatifs", l.id, "note", v)} ph="Commentaire libre…" />
                        </div>
                        </Details>
                      </div>
                    ))}
                    </NcReveal>
                    <div className="mt-1">
                      <div className="text-[11.5px] font-bold text-stone-700 mb-1">Note générale sur le foncier</div>
                      <Txt v={d.fonciersNote} on={v => set("fonciersNote", v)} ph="Commentaire libre…" />
                    </div>
                  </Q>
                </div>
              )}

              {/* ============ ÉTAPE 4 : FISCALITÉ ============ */}
              {niveau === "complet" && etape === 4 && (() => {
                const pc = ncCalcParts(d);
                const partsUsed = parseFloat((d.partsFiscales || "").replace(",", ".")) || pc.parts;
                const detRNI = ncDetailRNI(d);
                const rniEstime = detRNI.total;
                // Déplié automatiquement : à défaut de saisie, l'estimation issue des revenus est utilisée.
                const rni = ncInt(d.rniFoyer) || rniEstime;
                // Moteur fiscal unique : sépare les déductions du revenu (PER) des réductions d'impôt,
                // et calcule l'échéancier d'extinction des avantages à durée limitée.
                const fisc = ncCalcFisc(d, anRef);
                const ir = ncCalcIR(fisc.baseImposable, partsUsed, pc.couple);
                const reducs = fisc.reductions;
                const impotNetEstime = fisc.impotNet;
                const nf = (n) => new Intl.NumberFormat('fr-FR').format(Math.round(n || 0));
                return (
                <div>
                  {/* — Parts fiscales calculées automatiquement — */}
                  <div className="bg-stone-50 border border-stone-200 rounded-xl p-3.5 mb-4">
                    <div className="flex items-center gap-4 flex-wrap mb-1.5">
                      <div className="text-[11px] uppercase tracking-wider font-bold text-stone-500">Parts fiscales du foyer — calcul automatique</div>
                      <div className="num text-[20px] font-extrabold" style={{ color: "var(--nc-accent, #6d28d9)" }}>{String(pc.parts).replace(".", ",")} part{pc.parts > 1 ? "s" : ""}</div>

                      <div key={i} className="flex items-baseline justify-between gap-2 py-0.5">
                        <span className="text-[12px] text-stone-600">{x.l}</span>
                        <span className="num text-[12px] font-bold text-stone-800">+{String(x.p).replace(".", ",")}</span>
                      </div>
                    ))}
                    {/* Corrections & cas spécifiques (demi-parts, parts manuelles, TMI) : repliés
                        par défaut — la grande majorité des dossiers n'en a pas besoin. */}
                    <Details label="+ Corrections / cas spécifiques (demi-parts, parts, TMI)" filled={!!((d.demiParts || []).length || d.partsFiscales || d.tmiManuel)}>
                      <div className="text-[11.5px] font-bold text-stone-700 mb-1.5">Demi-parts supplémentaires éventuelles</div>
                      <MultiChips opts={[
                        {v:"isole",l:"Parent isolé (case T)"},{v:"invalide",l:"Client/conjoint invalide"},
                        {v:"charge_invalide",l:"Pers. à charge invalide"},{v:"combattant",l:"Carte combattant / +74 ans"},
                      ]} vals={d.demiParts} on={v => set("demiParts", v)} />
                      <div className="mt-2 flex items-center gap-2 flex-wrap">
                        <span className="text-[11.5px] font-bold text-stone-700">Corriger les parts :</span>

                  {/* — Simulateur : revenu imposable × parts → barème (− réductions) — */}
                  <div className="bg-stone-50 border border-stone-200 rounded-xl p-3.5 my-4">
                    <div className="text-[11px] uppercase tracking-wider font-bold text-stone-500 mb-2">Simulateur — barème {anRef} sur revenus {anRef - 1}</div>
                    <div className="grid grid-cols-2 gap-3 items-end mb-2">

                        <Eur v={d.rniFoyer} on={v => set("rniFoyer", v)} unit="€/an" ph={rniEstime > 0 ? String(rniEstime) : "0"} />
                      </div>
                      {rniEstime > 0 && ncInt(d.rniFoyer) === 0 && (
                        <div className="pb-1 text-[11px] text-stone-500">
                          <span className="font-bold" style={{ color: "var(--nc-accent, #6d28d9)" }}>Estimation automatique utilisée : {nf(rniEstime)} €</span>
                          <div className="text-[9px] text-stone-400 mt-0.5">d'après les revenus saisis (abatt. 10 %, micro-foncier 30 %) — saisissez un montant pour corriger.</div>
                        </div>
                      )}
                      {rni === 0 && (
                        <div className="pb-1 text-[11px] text-stone-400">Renseignez les revenus (étape 3) ou saisissez directement le revenu imposable.</div>

                    {/* — Détail du calcul : chaque ligne retenue, sa base et sa méthode — */}
                    {detRNI.lignes.length > 0 && (
                      <div className="rounded-xl border-2 bg-white overflow-hidden mb-3" style={{ borderColor: "var(--nc-accent, #6d28d9)" }}>
                        <button type="button" onClick={() => set("detailRNIOuvert", d.detailRNIOuvert === "non" ? "oui" : "non")}
                          className="w-full flex items-center justify-between gap-3 px-3.5 py-2.5 text-left hover:bg-stone-50 transition">
                          <span className="text-[12px] font-extrabold text-stone-900">
                            Détail du calcul — {detRNI.lignes.length} ligne{detRNI.lignes.length > 1 ? "s" : ""} de revenus retenue{detRNI.lignes.length > 1 ? "s" : ""}
                            <span className="font-normal text-stone-500"> · vérifiez et corrigez si besoin</span>
                          </span>
                          <span className="text-[11px] font-bold flex-shrink-0" style={{ color: "var(--nc-accent, #6d28d9)" }}>{d.detailRNIOuvert === "non" ? "Afficher ▾" : "Masquer ▴"}</span>

                          <div className="px-3.5 pb-3">

                              <span className="w-24 text-right">Retenu / an</span>

                                  <span className="flex-1 text-[12px] font-semibold text-stone-800">{x.label}</span>

                                <button type="button" onClick={() => set("rniFoyer", "")} className="ml-2 font-bold underline underline-offset-2">revenir à l'estimation</button>

                        <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mt-1">

                            <div className="text-[9px] uppercase tracking-wider font-bold text-stone-400">TMI</div>

                          <div className="bg-white border border-stone-200 rounded-lg px-3 py-2">

                              Effet de vos avantages fiscaux sur l'impôt {anRef}

                            <div className="px-3.5 py-2.5">
                              {[
                                { l: "Revenu net imposable", v: fisc.rniBrut, fort: false },

                                ...(fisc.reductions > 0 ? [{ l: "− Réductions et crédits d'impôt", v: -fisc.reductions, acc: true }] : []),

                                <div key={i} className="flex items-baseline justify-between gap-3 py-1 border-b border-stone-100">
                                  <span className={`text-[12px] ${x.fort ? "font-extrabold text-stone-900" : "text-stone-600"}`}>{x.l}</span>
                                  <span className="num text-[12.5px] font-bold" style={{ color: x.acc ? "#6d28d9" : "#1c1917" }}>{x.v < 0 ? "−" : ""}{nf(Math.abs(x.v))} €</span>

                                <span className="text-[13px] font-extrabold text-stone-900">Impôt net à payer</span>
                                <span className="num text-[17px] font-extrabold" style={{ color: "var(--nc-accent, #6d28d9)" }}>{nf(fisc.impotNet)} €</span>
                              </div>
                              <div className="mt-1.5 rounded-lg bg-stone-50 border border-stone-200 px-2.5 py-1.5 text-[11px] text-stone-700">
                                Sans ces avantages, l'impôt serait de <b className="num">{nf(fisc.impotSansAvantage)} €</b> — soit <b className="num" style={{ color: "var(--nc-accent, #6d28d9)" }}>{nf(fisc.gainTotal)} € d'économie</b> cette année.
                              </div>
                            </div>
                          </div>
                        )}

                        {/* — Avantages à durée limitée : ce qui s'arrête et le surcoût d'impôt — */}
                        {fisc.echeancier.length > 0 && (
                          <div className="mt-2.5 rounded-xl border-2 border-amber-300 bg-amber-50 px-3.5 py-2.5">
                            <div className="text-[11px] uppercase tracking-wider font-bold text-amber-800 mb-1.5">Opportunités à venir — avantages qui s'éteignent</div>
                            {fisc.echeancier.map((e, i) => (
                              <div key={i} className="py-1 border-b border-amber-200 last:border-b-0">
                                <div className="text-[12px] font-bold text-amber-900">
                                  Fin {e.annee} : {e.avantagesPerdus.map(a => a.libelle).join(", ")} — {nf(e.montantPerdu)} €/an
                                </div>
                                <div className="text-[11px] text-amber-800">
                                  À partir de {e.annee + 1}, impôt estimé <b className="num">{nf(e.impotApres)} €</b> au lieu de <b className="num">{nf(fisc.impotNet)} €</b> — soit <b className="num">+{nf(e.surcout)} €</b>. Solution de remplacement à préparer avant cette échéance.
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                        <div className="mt-1.5 text-[9px] text-stone-400">Simulation indicative au barème progressif 2026 (décote et plafonnement du quotient familial inclus ; hors PFU et cas particuliers). Un versement PER est une <b>déduction du revenu</b> (art. 163 quatervicies CGI), pas une réduction d'impôt.</div>
                      </NcReveal>
                    )}
                  </div>

                  <Q q="Souhaitez-vous corriger avec l'impôt réellement payé (avis d'imposition) ?" val={d.impotQ || ""} on={v => set("impotQ", v)}>
                    <div className="grid grid-cols-2 gap-3">
                      <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Impôt réel payé</div><Eur v={d.impotNet} on={v => set("impotNet", v)} unit="€/an" /></div>
                    </div>
                  </Q>
                  <Q q="Êtes-vous redevable de l'IFI ?" val={d.ifi} on={v => set("ifi", v)}>
                    <div className="grid grid-cols-2 gap-3">
                      <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Montant IFI</div><Eur v={d.ifiMontant} on={v => set("ifiMontant", v)} unit="€/an" /></div>
