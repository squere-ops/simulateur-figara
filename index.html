    // ============================================================
    // STEP 4 — RÉSULTATS — COLONNES PREMIUM
    // ============================================================
    function Step4Resultats({ inputs, setInputs, sim, scenarioLvl, setScenarioLvl, scenarios, openBuilder, removeScen, loadScen, upd, autreAV, setAutreAV }) {
      // Pour Capi PM (personne morale), le comparateur est un "Compte à terme" entreprise, pas un livret particulier
      const isCapiProduit = inputs.produit === "capi";
      const livretNom = isCapiProduit ? "Compte à terme" : (LIVRETS.find(p=>p.id===inputs.livretId)?.nom || "Livret");
      const totalVerseBrut = totalVerseBrutOf(inputs);

      // Mesure dynamique de la hauteur du bandeau "Hypothèse principale" pour positionner exactement le bandeau "Détail" juste en dessous (sans chevauchement, sans gap)
      const hypotheseRef = useRef(null);
      const [hypotheseH, setHypotheseH] = useState(60);
      useLayoutEffect(() => {
        if (!hypotheseRef.current) return;
        const update = () => {
          if (hypotheseRef.current) setHypotheseH(hypotheseRef.current.offsetHeight);
        };
        update();
        const ro = new ResizeObserver(update);
        ro.observe(hypotheseRef.current);
        window.addEventListener('resize', update);
        return () => { ro.disconnect(); window.removeEventListener('resize', update); };
      }, [scenarios.length, inputs.produit]);

      // Build columns
      // Column 1: LIVRET (figé) — uses current inputs (livretTaux, durée, versements, nbBeneficiaires)
      //  ↳ Pour PER : remplacé par "PER + Réintégration des réductions d'impôt"
      // Column 2: SOLUTION ACTUELLE — current inputs at current scenario level
      // Columns 3+: SCÉNARIOS — each scenario's inputs run at current scenario level
      const isPERProduit = inputs.produit === "per";
      const livretCol = useMemo(() => {
        // Livret A : aucune donnée de succession n'est nécessaire (transmission non chiffrée).
        const livretProj = projLivret(inputs);
        const livretFisc = fiscaliteLivret(livretProj.capitalFin);
        const renteBruteAn = renteBruteAnnuelle(livretProj.capitalFin, inputs.livretTaux);
        const renteFiscLiv = livretRenteFisc(inputs, renteBruteAn);
        // Livret A : transmission chiffrée sans fiscalité ni abattement (hypothèse retenue).
        const abattDetail = "Capital transmis sans fiscalité chiffrée";
        return {
          type: "livret",
          name: livretNom,
          subtitle: `Taux ${fmtPCT(inputs.livretTaux)}`,
          capital: livretProj.capitalFin,
          versements: livretProj.totVerse,
          plusValue: livretProj.plusValue,
          fraisSouscription: 0,
          fraisDe: 0,
          rdt: inputs.livretTaux,
          // Succession
          capitalDeces: livretProj.capitalFin,
          abattement: livretFisc.abattTotal,
          abattDetail,
          imposable: livretFisc.imposableTotal,
          taxe: livretFisc.droits,
          taxeLabel: "Droits de succession",
          netTransmis: livretFisc.net,
          // Rente
          renteBrute: renteBruteAn,
          renteImpot: renteFiscLiv.impot,
          renteImpotIR: renteFiscLiv.ir,
          renteImpotPS: renteFiscLiv.ps,
          renteAb: 0,
          rentePlus8: false,
          renteNetteAn: renteBruteAn - renteFiscLiv.impot,
          renteNetteMois: (renteBruteAn - renteFiscLiv.impot) / 12,
          renteRegime: renteFiscLiv.regime,
          // Fiscalité PROPORTIONNELLE : PFU (ou IS) sur la totalité des intérêts servis,
          // sans quote-part de plus-value ni abattement — contrairement à l'assurance vie.
          renteFiscLineaire: true,
          // Réduction d'impôt (n/a livret)
          isPER: false,
          reductionImpotAnnuelle: 0,
          reductionImpotAnnee1: 0,
          reductionImpotCumulee: 0,
          tauxIRPct: 0,
          coutReel: livretProj.totVerse,  // pas d'avantage fiscal — coût = versements
        };
      }, [inputs.versementInitial, inputs.versementMensuel, inputs.dureeAnnees, inputs.livretTaux, inputs.produit, inputs.tauxIS, inputs.nbBeneficiaires, inputs.successionLine, inputs.successionTauxIndirect, inputs.successionTauxDirect, inputs.versementsComplementaires, livretNom]);

      // === Colonne PER + Réintégration des réductions d'impôt ===
      // L'épargnant réinvestit chaque année sa réduction d'impôt dans le PER.
      // Ce réinvestissement génère lui-même une nouvelle réduction (effet levier composé).
      const perReinvestCol = useMemo(() => {
        if (!isPERProduit) return null;
        const ligne = inputs.successionLine ?? 'directe';
        const txIndirect = inputs.successionTauxIndirect ?? TX_SUCC_INDIRECT;
        const txDirect = inputs.successionTauxDirect ?? 0.30;
        const auxCap = sim.perReinvest?.auxCap || 0;
        const totReduc = sim.perReinvest?.totReduc || 0;         // total réductions (y.c. sur réinvest.)
        const totReinvesti = sim.perReinvest?.totReinvesti || 0; // montant total réinvesti dans PER
        const perCap = sim.proj.capitalFin;
        const totalCap = perCap + auxCap;
        // Réduction d'impôt : année 1 (initial + mensuel) vs années suivantes
        // Dans PER+Réintégration, la réduction de l'année précédente est réinvestie,
        // ce qui génère une réduction supplémentaire → on utilise totReduc (compoundé).
        const tmi = inputs.tauxIR || 0;
        const redAnnee1 = (inputs.versementInitial + inputs.versementMensuel * 12) * tmi;
        const redAnnuelleCourante = inputs.versementMensuel * 12 * tmi;
        // === Succession (cas décès) ===
        const fiscSucc = fiscaliteAV(totalCap, sim.proj.totVerseNet + totReinvesti, inputs.nbBeneficiaires, inputs.ageSouscripteur, txIndirect, sim.proj.totVerseBrut + totReinvesti, ligne, txDirect);
        // PER + Réintégration : la fiscalité de la rente d'un PER n'est PAS celle d'une
        // assurance-vie (pas d'abattement 4 600 €, pas de PFL 7,5 %). On restitue donc la
        // rente BRUTE perpétuelle, exactement comme la colonne Solution PER.
        const renteBrutePerR = renteBruteAnnuelle(totalCap, sim.rdt);
        return {
          type: "perReinvest",
          name: "PER + Réintégration",
          subtitle: `Réductions réinvesties · levier fiscal composé`,
          capital: totalCap,
          // Total physiquement investi dans le PER = contributions directes + réductions réinvesties
          versements: sim.proj.totVerseBrut + totReinvesti,
          // Plus-value réelle = capital total − tout ce qui a été versé (direct + réinvesti)
          plusValue: Math.max(0, totalCap - sim.proj.totVerseBrut - totReinvesti),
          fraisSouscription: sim.proj.fraisSousPay,
          fraisDe: 0,
          rdt: sim.rdt,
          // Succession
          capitalDeces: totalCap,
          abattement: fiscSucc.abattTotal,
          abattDetail: fiscSucc.av70 ? `${ABATT_AV_70.toLocaleString('fr-FR')} € × ${inputs.nbBeneficiaires} bénéf.` : `Abatt. global après 70 ans`,
          imposable: fiscSucc.imposableTotal,
          taxe: fiscSucc.taxe,
          taxeLabel: "Taxe PER+AV (art. 990 I)",
          netTransmis: fiscSucc.direct,
          renteBrute: renteBrutePerR,
          renteImpot: 0,
          renteImpotIR: 0,
          renteImpotPS: 0,
          renteAb: 0,
          rentePlus8: false,
          renteNetteAn: renteBrutePerR,
          renteNetteMois: renteBrutePerR / 12,
          renteRegime: "RVTO (PER + réinvest.)",
          // PER reinvest specifics
          isPER: true,
          auxCap,
          totReduc,
          totReinvesti,
          perCap,
          // Réduction d'impôt : l'effet de levier composé génère PLUS de réductions que le PER seul
          reductionImpotAnnee1: redAnnee1,
          reductionImpotAnnuelle: redAnnuelleCourante,
          reductionImpotCumulee: totReduc,    // total réductions (avec levier composé)
          tauxIRPct: tmi,
          // COÛT RÉEL : l'épargnant réinvestit ses réductions → il ne les "garde" pas
          // Son effort net = versements directs bruts (les réductions alimentent le système)
          coutReel: sim.proj.totVerseBrut,
          coutReelLabel: "Versements directs (réductions réinvesties)",
        };
      }, [isPERProduit, sim, inputs.versementInitial, inputs.versementMensuel, inputs.dureeAnnees, inputs.tauxIR, inputs.successionLine, inputs.successionTauxIndirect, inputs.successionTauxDirect, inputs.ageSouscripteur, inputs.nbBeneficiaires, inputs.situationFamiliale]);

      const produitLabel = inputs.produit === "per" ? "PER" : inputs.produit === "capi" ? "Capi PM" : inputs.produit === "multi" ? "PER + AV" : "Ass Vie";
      const solutionCol = useMemo(() => {
        const isPER = inputs.produit === "per";
        const isCapi = inputs.produit === "capi";
        // Détermination de l'abattement et du label de taxe selon le produit
        // Pour la phase DÉCÈS : PER comme AV → 152 500 € par bénéficiaire avant 70 ans (régime art. 990 I).
        // La fiscalité de SORTIE (TMI + PFU) s'applique en cas de VIE, pas au décès.
        let abattement = sim.fisc.abattTotal;
        let abattDetail = sim.fisc.av70 ? `${ABATT_AV_70.toLocaleString('fr-FR')} € × ${inputs.nbBeneficiaires} bénéf.` : `Abatt. global après 70 ans`;
        let taxeLabel = "Taxe AV (art. 990 I)";
        let netTransmis = sim.fisc.direct;
        if (isPER) {
          // PER en cas de décès : assimilé à l'AV — abattement 152 500 € par bénéficiaire (avant 70 ans)
          // ou 30 500 € global après 70 ans. On garde sim.fisc.* qui est calculé via fiscaliteAV().
          taxeLabel = "Taxe PER (art. 990 I)";
        } else if (isCapi) {
          abattement = 0;
          abattDetail = `Personne morale — capital brut à terme`;
          taxeLabel = "Impôt sur les sociétés";
          netTransmis = sim.fiscCapi?.netCapital || sim.fisc.direct;
        }
        // Réduction d'impôt PER :
        //   • Année 1 : (versement initial + 12 × mensuel) × TMI — le versement initial est
        //     déductible en totalité l'année de la souscription.
        //   • Années suivantes : 12 × mensuel × TMI (versements récurrents uniquement).
        //   • Cumulée : totVerseBrut × TMI (= ecoFiscEntree de fiscalitePER).
        const tmi = isPER ? inputs.tauxIR : 0;
        const reductionImpotAnnee1    = isPER ? (inputs.versementInitial + inputs.versementMensuel * 12) * tmi : 0;
        const reductionImpotAnnuelle  = isPER ? (inputs.versementMensuel * 12) * tmi : 0;
        const reductionImpotCumulee   = isPER ? (sim.fiscPER?.ecoFiscEntree || 0) : 0;
        // COÛT RÉEL Solution PER : l'épargnant GARDE chaque année sa réduction d'impôt
        // → son effort net = versements − réductions perçues sur la période.
        const coutReel = isPER ? Math.max(0, sim.proj.totVerseBrut - reductionImpotCumulee) : sim.proj.totVerseBrut;
        const coutReelLabel = isPER ? "Versements − réductions d'impôt perçues" : "Versements bruts";
        return ({
          type: "solution",
          isPER,
          isCapi,
          name: isCapi ? "Solution Capi PM" : isPER ? "Solution PER" : inputs.produit === "multi" ? "Multi-projet PER + Assurance-Vie" : `Solution assurance vie${inputs.cabinetNom ? ' · ' + inputs.cabinetNom : ''}`,
          subtitle: `Rdt ${fmtPCT(sim.rdt)} · ${scenarioLvl === "med" ? "médian" : scenarioLvl === "pess" ? "pessimiste" : "optimiste"}`,
          capital: sim.proj.capitalFin,
          versements: sim.proj.totVerseBrut,
          plusValue: Math.max(0, sim.proj.capitalFin - sim.proj.totVerseBrut),
          fraisSouscription: sim.proj.fraisSousPay,
          rdt: sim.rdt,
          capitalDeces: sim.proj.capitalFin,
          abattement,
          abattDetail,
          imposable: sim.fisc.imposableTotal,
          taxe: sim.fisc.taxe,
          taxeLabel,
          netTransmis,
          // PER : rente brute perpétuelle indicative — même valeur partout (cf. colonne solution).
          renteBrute: isPER ? renteBruteAnnuelle(sim.proj.capitalFin, sim.rdt) : sim.rente.brute,
          renteImpot: isPER ? 0 : sim.rente.imp,
          renteImpotIR: isPER ? 0 : sim.rente.impIR,
          renteImpotPS: isPER ? 0 : sim.rente.impPS,
          renteAb: isPER ? 0 : sim.rente.ab,
          rentePlus8: isPER ? false : sim.rente.plus8,
          renteNetteAn: isPER ? renteBruteAnnuelle(sim.proj.capitalFin, sim.rdt) : sim.rente.nette,
          renteNetteMois: (isPER ? renteBruteAnnuelle(sim.proj.capitalFin, sim.rdt) : sim.rente.nette) / 12,
          renteRegime: isPER ? "RVTO (PER)" : isCapi ? "Non applicable (PM)" : sim.rente.regime,
          reductionImpotAnnee1,
          reductionImpotAnnuelle,
          reductionImpotCumulee,
          tauxIRPct: tmi,
          coutReel,
          coutReelLabel,
        });
      }, [sim, scenarioLvl, inputs.nbBeneficiaires, inputs.produit, inputs.tauxIR, inputs.tauxIS, inputs.perModeSortie, inputs.versementInitial, inputs.versementMensuel, inputs.dureeAnnees, produitLabel, inputs.cabinetNom]);

      const scenarioCols = useMemo(() => scenarios.map((s, idx) => {
        const sSim = runSimulation(s.inputs, scenarioLvl);
        const sIsPER = s.inputs.produit === "per";
        const sTmi = sIsPER ? (s.inputs.tauxIR || 0) : 0;
        const sRedAnnee1   = sIsPER ? (s.inputs.versementInitial + s.inputs.versementMensuel * 12) * sTmi : 0;
        const sRedAnnuelle = sIsPER ? (s.inputs.versementMensuel * 12) * sTmi : 0;
        const sRedCumulee  = sIsPER ? (sSim.fiscPER?.ecoFiscEntree || 0) : 0;
        return {
          type: "scenario",
          colorIndex: (idx % 4) + 1,
          name: s.nom,
          subtitle: `Rdt ${fmtPCT(sSim.rdt)}`,
          idx,
          inputs: s.inputs,
          isPER: sIsPER,
          capital: sSim.proj.capitalFin,
          versements: sSim.proj.totVerseBrut,
          plusValue: Math.max(0, sSim.proj.capitalFin - sSim.proj.totVerseBrut),
          fraisSouscription: sSim.proj.fraisSousPay,
          rdt: sSim.rdt,
          capitalDeces: sSim.proj.capitalFin,
          abattement: sSim.fisc.abattTotal,
          abattDetail: sSim.fisc.av70 ? `${ABATT_AV_70.toLocaleString('fr-FR')} € × ${s.inputs.nbBeneficiaires} bénéf.` : `Abatt. global après 70 ans`,
          imposable: sSim.fisc.imposableTotal,
          taxe: sSim.fisc.taxe,
          taxeLabel: "Taxe AV (art. 990 I)",
          netTransmis: sSim.fisc.direct,
          renteBrute: sIsPER ? renteBruteAnnuelle(sSim.proj.capitalFin, sSim.rdt) : sSim.rente.brute,
          renteImpot: sIsPER ? 0 : sSim.rente.imp,
          renteImpotIR: sIsPER ? 0 : sSim.rente.impIR,
          renteImpotPS: sIsPER ? 0 : sSim.rente.impPS,
          renteAb: sIsPER ? 0 : sSim.rente.ab,
          rentePlus8: sIsPER ? false : sSim.rente.plus8,
          renteNetteAn: sIsPER ? renteBruteAnnuelle(sSim.proj.capitalFin, sSim.rdt) : sSim.rente.nette,
          renteNetteMois: (sIsPER ? renteBruteAnnuelle(sSim.proj.capitalFin, sSim.rdt) : sSim.rente.nette) / 12,
          renteRegime: sIsPER ? "Rente brute indicative (PER)" : sSim.rente.regime,
          reductionImpotAnnee1: sRedAnnee1,
          reductionImpotAnnuelle: sRedAnnuelle,
          reductionImpotCumulee: sRedCumulee,
          tauxIRPct: sTmi,
          coutReel: sIsPER ? Math.max(0, sSim.proj.totVerseBrut - sRedCumulee) : sSim.proj.totVerseBrut,
          coutReelLabel: sIsPER ? "Versements − réductions d'impôt perçues" : "Versements bruts",
        };
      }), [scenarios, scenarioLvl]);

      // === Colonne « Autre assurance vie » (comparateur concurrent, activable) ===
      // Mêmes versements / durée / bénéficiaires que la solution, mais rendement saisi
      // librement. Fiscalité AV complète (abattements 152 500 € / art. 990 I).
      const [avPop, setAvPop] = useState(false);
      const [livretActive, setLivretActive] = useState(true);
      // Multi-projet : aucune comparaison → livret + concurrence forcés OFF
      useEffect(() => {
        if (inputs.produit === "multi") {
          setLivretActive(false);
          setAutreAV(p => (p.active ? { ...p, active: false } : p));
        }
      }, [inputs.produit]);
      const autreAVCol = useMemo(() => {
        if (!autreAV.active || isPERProduit || isCapiProduit) return null;
        const aInputs = {
          ...inputs,
          produit: 'av',
          allocation: [{ id: 1, type: 'fondsEuro', poids: 1, rendement: autreAV.rdt, sri: 1 }],
        };
        const aSim = runSimulation(aInputs, scenarioLvl);
        // Rente : régime fiscal selon l'ancienneté du contrat concurrent (≥ 8 ans → PFL 7,5 %)
        const aRente = rente(aSim.proj.capitalFin, aSim.proj.totVerseNet, aSim.rdt, autreAV.plus8ans ? 8 : 0, inputs.situationFamiliale, aSim.proj.totVerseBrut);
        return {
          type: 'autreAV',
          name: 'Assurance vie concurrence',
          subtitle: `Rdt ${fmtPCT(aSim.rdt)}`,
          capital: aSim.proj.capitalFin,
          versements: aSim.proj.totVerseBrut,
          plusValue: Math.max(0, aSim.proj.capitalFin - aSim.proj.totVerseBrut),
          fraisSouscription: aSim.proj.fraisSousPay,
          rdt: aSim.rdt,
          capitalDeces: aSim.proj.capitalFin,
          abattement: aSim.fisc.abattTotal,
          abattDetail: aSim.fisc.av70 ? `${ABATT_AV_70.toLocaleString('fr-FR')} € × ${inputs.nbBeneficiaires} bénéf.` : `Abatt. global après 70 ans`,
          imposable: aSim.fisc.imposableTotal,
          taxe: aSim.fisc.taxe,
          taxeLabel: 'Taxe AV (art. 990 I)',
          netTransmis: aSim.fisc.direct,
          renteBrute: aRente.brute,
          renteImpot: aRente.imp,
          renteImpotIR: aRente.impIR,
          renteImpotPS: aRente.impPS,
          renteAb: aRente.ab,
          rentePlus8: aRente.plus8,
          renteNetteAn: aRente.nette,
          renteNetteMois: aRente.nette / 12,
          renteRegime: aRente.regime,
          reductionImpotAnnee1: 0, reductionImpotAnnuelle: 0, reductionImpotCumulee: 0, tauxIRPct: 0,
          coutReel: aSim.proj.totVerseBrut, coutReelLabel: 'Versements bruts',
        };
      }, [autreAV, inputs, scenarioLvl]);
      const removeAutreAV = () => setAutreAV(p => ({ ...p, active: false }));

      // Colonne de référence : pour PER → PER + Réintégration ; sinon → Livret/CAT
      const referenceCol = isPERProduit ? perReinvestCol : livretCol;
      // En PER : la Solution PER seul est placée à GAUCHE, le bonus « PER + Réintégration » à DROITE
      // (logique pédagogique : on part de la situation de référence puis on montre l'amélioration).
      // Dans les autres produits, l'ordre historique reste : référence (livret/CAT) à gauche.
      const autreAVArr = autreAVCol ? [autreAVCol] : [];
      const livretArr = livretActive ? [referenceCol] : [];
      // Comparateur actif pour le tableau benchmark : livret si coché, sinon l'assurance vie concurrence, sinon le livret par défaut.
      const benchRefCol = isPERProduit ? referenceCol : (livretActive ? livretCol : (autreAVCol || livretCol));
      const benchRefLabel = isPERProduit ? "PER seul" : (livretActive ? (isCapiProduit ? "CAT" : "livret") : (autreAVCol ? "ass. vie concurrence" : (isCapiProduit ? "CAT" : "livret")));
      const allCols = isPERProduit
        ? [solutionCol, referenceCol, ...autreAVArr, ...scenarioCols]
        : [...livretArr, ...autreAVArr, solutionCol, ...scenarioCols];

      // Best column for net transmis (winner badge)
      const bestNetTransmis = Math.max(...allCols.map(c => c.netTransmis));
      const bestRente = Math.max(...allCols.map(c => c.renteNetteMois));

      return (
        <div className="max-w-screen-xl mx-auto page-enter">
          <div className="text-center mb-4">
            <div className="text-[10px] tracking-widest font-semibold text-red-600 uppercase mb-1.5">Étape 4 sur 4</div>
            <h1 className="text-xl md:text-2xl font-bold text-stone-900 tracking-tightest">Comparaison des solutions</h1>
            <p className="mt-1.5 text-[13px] text-stone-500">Le {isCapiProduit ? "compte à terme" : "livret"} reste fixé. Ajoutez des scénarios pour comparer plusieurs allocations côte-à-côte.</p>
          </div>

          {/* Bandeau rappel des hypothèses — sticky permanent. Chaque ligne (base + scénarios) a le même format pour faciliter la comparaison */}
          <div ref={hypotheseRef} className="sticky mb-4 -mx-2 px-2 no-print" style={{top: '175px', zIndex: 25, background: '#fafaf9'}}>
            <div style={{paddingTop: '6px', paddingBottom: '6px', background: '#fafaf9'}}>
            <div className="bg-white border border-stone-200 rounded-xl overflow-hidden shadow-lg">
              <div className="h-[2px] bg-gradient-to-r from-red-700 via-red-500 to-red-700"></div>

              {/* Ligne base — Hypothèse principale (Solution Ass Vie) */}
              <div className="px-4 py-2.5 flex items-center gap-4 flex-wrap">
                <div className="flex items-center gap-2 flex-shrink-0 w-44">
                  <span className="inline-flex items-center justify-center w-8 h-8 rounded-full bg-red-50 text-red-600 ring-2 ring-red-200 flex-shrink-0">
                    <I.lock/>
                  </span>
                  <div className="min-w-0">
                    <div className="text-[11px] uppercase tracking-widest font-bold text-red-600 truncate">Hypothèse principale</div>
                    <div className="text-[9px] text-stone-500 truncate">Solution {produitLabel}</div>
                  </div>
                </div>
                <div className="flex items-center gap-4 md:gap-5 flex-wrap text-[12px]">
                  <div className="flex items-baseline gap-1.5">
                    <span className="text-stone-500">Initial</span>
                    <span className="num font-bold text-stone-900">{fmtEUR(inputs.produit === "multi" ? versementsMulti(inputs).vi : inputs.versementInitial)}</span>
                  </div>
                  <span className="text-stone-300">·</span>
                  <div className="flex items-baseline gap-1.5">
                    <span className="text-stone-500">Mensuel</span>
                    <span className="num font-bold text-stone-900">{fmtEUR(inputs.produit === "multi" ? versementsMulti(inputs).vm : inputs.versementMensuel)}<span className="text-[10px] text-stone-500">/mois</span></span>
                  </div>
                  <span className="text-stone-300">·</span>
                  <div className="flex items-baseline gap-1.5">
                    <span className="text-stone-500">Durée</span>
                    <span className="num font-bold text-stone-900">{inputs.dureeAnnees} ans</span>
                  </div>
                  <span className="text-stone-300">·</span>
                  <div className="flex items-baseline gap-1.5">
                    <span className="text-stone-500">Hypothèse de rendement</span>
                    <span className="num font-bold text-stone-900">{fmtPCT(sim.rdt)}</span>
                  </div>
                  <span className="text-stone-300">·</span>
                  <div className="flex items-baseline gap-1.5 border-l border-stone-200 pl-4">
                    <span className="text-emerald-700 font-bold">Total versé</span>
                    <span className="num font-extrabold text-emerald-700">{fmtEUR(totalVerseBrut)}</span>
                  </div>
                </div>
              </div>

              {/* Ligne « Autre assurance vie » — comparateur concurrent */}
              {autreAVCol && (
                <div className="border-t border-stone-100 px-4 py-2.5 flex items-center gap-4 flex-wrap">
                  <div className="flex items-center gap-2 flex-shrink-0 w-44">
                    <span className="inline-flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 text-slate-600 ring-2 ring-slate-200 flex-shrink-0">
                      <I.lock/>
                    </span>
                    <div className="min-w-0">
                      <div className="text-[11px] uppercase tracking-widest font-bold text-slate-600 truncate">Assurance vie concurrence</div>
                      <div className="text-[9px] text-stone-500 truncate">Comparateur</div>
                    </div>
                  </div>
                  <div className="flex items-center gap-4 md:gap-5 flex-wrap text-[12px]">
                    <div className="flex items-baseline gap-1.5">
                      <span className="text-stone-500">Initial</span>
                      <span className="num font-bold text-stone-900">{fmtEUR(inputs.versementInitial)}</span>
                    </div>
                    <span className="text-stone-300">·</span>
                    <div className="flex items-baseline gap-1.5">
                      <span className="text-stone-500">Mensuel</span>
                      <span className="num font-bold text-stone-900">{fmtEUR(inputs.produit === "multi" ? versementsMulti(inputs).vm : inputs.versementMensuel)}<span className="text-[10px] text-stone-500">/mois</span></span>
                    </div>
                    <span className="text-stone-300">·</span>
                    <div className="flex items-baseline gap-1.5">
                      <span className="text-stone-500">Durée</span>
                      <span className="num font-bold text-stone-900">{inputs.dureeAnnees} ans</span>
                    </div>
                    <span className="text-stone-300">·</span>
                    <div className="flex items-baseline gap-1.5">
                      <span className="text-stone-500">Hypothèse de rendement</span>
                      <span className="num font-bold text-stone-900">{fmtPCT(autreAVCol.rdt)}</span>
                    </div>
                    <span className="text-stone-300">·</span>
                    <div className="flex items-baseline gap-1.5 border-l border-stone-200 pl-4">
                      <span className="text-emerald-700 font-bold">Total versé</span>
                      <span className="num font-extrabold text-emerald-700">{fmtEUR(totalVerseBrut)}</span>
                    </div>
                    <button onClick={removeAutreAV} title="Retirer la comparaison"
                      className="ml-1 self-center p-1.5 rounded-lg text-stone-400 hover:text-red-600 hover:bg-red-50 transition no-print">
                      <I.x/>
                    </button>
                  </div>
                </div>
              )}

              {/* Lignes scénarios — même format que la base, chacun avec sa couleur d'accent */}
              {scenarios.map((s, idx) => {
                const t = s.inputs.versementInitial + s.inputs.versementMensuel * 12 * s.inputs.dureeAnnees + totalComplementaires(s.inputs);
                const color = ['#6366f1','#ec4899','#f59e0b','#06b6d4'][idx % 4];
                const colorRing = ['#c7d2fe','#fbcfe8','#fde68a','#a5f3fc'][idx % 4];
                const sRdt = scenarioCols[idx]?.rdt ?? 0;
                return (
                  <div key={idx} className="border-t border-stone-100 px-4 py-2.5 flex items-center gap-4 flex-wrap">
                    <div className="flex items-center gap-2 flex-shrink-0 w-44">
                      <span className="inline-flex items-center justify-center w-8 h-8 rounded-full text-white font-bold text-[11px] flex-shrink-0"
                        style={{background: color, boxShadow: `0 0 0 2px ${colorRing}`}}>
                        S{idx + 1}
                      </span>
                      <div className="min-w-0">
                        <div className="text-[11px] uppercase tracking-widest font-bold truncate" style={{color}}>{s.nom}</div>
                        <div className="text-[9px] text-stone-500 truncate">Scénario {idx + 1}</div>
                      </div>
                    </div>
                    <div className="flex items-center gap-4 md:gap-5 flex-wrap text-[12px]">
                      <div className="flex items-baseline gap-1.5">
                        <span className="text-stone-500">Initial</span>
                        <span className="num font-bold text-stone-900">{fmtEUR(s.inputs.versementInitial)}</span>
                      </div>
                      <span className="text-stone-300">·</span>
                      <div className="flex items-baseline gap-1.5">
                        <span className="text-stone-500">Mensuel</span>
                        <span className="num font-bold text-stone-900">{fmtEUR(s.inputs.versementMensuel)}<span className="text-[10px] text-stone-500">/mois</span></span>
                      </div>
                      <span className="text-stone-300">·</span>
                      <div className="flex items-baseline gap-1.5">
                        <span className="text-stone-500">Durée</span>
                        <span className="num font-bold text-stone-900">{s.inputs.dureeAnnees} ans</span>
                      </div>
                      <span className="text-stone-300">·</span>
                      <div className="flex items-baseline gap-1.5">
                        <span className="text-stone-500">Hypothèse de rendement</span>
                        <span className="num font-bold text-stone-900">{fmtPCT(sRdt)}</span>
                      </div>
                      <span className="text-stone-300">·</span>
                      <div className="flex items-baseline gap-1.5 border-l border-stone-200 pl-4">
                        <span className="text-emerald-700 font-bold">Total versé</span>
                        <span className="num font-extrabold text-emerald-700">{fmtEUR(t)}</span>
                      </div>
                      <button onClick={() => removeScen(idx)} title="Supprimer ce scénario"
                        className="ml-1 self-center p-1.5 rounded-lg text-stone-400 hover:text-red-600 hover:bg-red-50 transition no-print">
                        <I.x/>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
            </div>
          </div>

          {/* Top toolbar: scenario level + livret + droits succession + add scenario */}
          <div className="bg-white border border-stone-200 rounded-2xl px-4 py-3 mb-3 no-print">
            <div className="flex items-center justify-between flex-wrap gap-4">
              <div className="flex items-center gap-2">
                <div className="text-[11px] uppercase tracking-wider font-bold text-stone-800 mr-2">Niveau marché</div>
                <div className="inline-flex bg-stone-100 rounded-lg p-1">
                  {[
                    {id:"pess", label:"Pessimiste"},
                    {id:"med",  label:"Médian"},
                    {id:"opt",  label:"Optimiste"},
                  ].map(l => (
                    <button key={l.id} onClick={()=>setScenarioLvl(l.id)}
                      className={`px-3 py-1.5 rounded-md text-[12px] font-semibold transition ${scenarioLvl===l.id ? 'bg-white shadow-sm text-stone-900' : 'text-stone-500 hover:text-stone-900'}`}>
                      {l.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Droits de succession — à côté du niveau de marché */}
              {inputs.produit !== "capi" && (
                <div className="flex items-center gap-3 flex-wrap">
                  <span className="text-[11px] uppercase tracking-wider font-bold text-stone-800">Droits de succession</span>
                  <div className="inline-flex bg-stone-100 rounded-lg p-1">

                        <select value={inputs.livretId} disabled={!livretActive} onChange={e => { upd("livretId", e.target.value); upd("livretTaux", LIVRETS.find(p=>p.id===e.target.value).taux); }}

                          {LIVRETS.map(p => <option key={p.id} value={p.id}>{p.nom} — {(p.taux*100).toFixed(2)}%</option>)}

                      <div className={`flex items-center bg-white border border-stone-200 rounded-lg ${livretActive ? '' : 'opacity-60'}`}>

          {/* TABLEAU COMPARATIF — vue d'ensemble visuelle (masqué en multi : aucune comparaison) */}
          {inputs.produit !== "multi" && <BenchmarkTable allCols={allCols} livretCol={benchRefCol} refLabel={benchRefLabel} inputs={inputs} scenarioLvl={scenarioLvl} />}

          {/* DÉTAIL PAR SOLUTION — chaque phase (Vie · Décès · Rente) est wrappée dans son propre conteneur

          {(() => {
            const gridStyle = { gridTemplateColumns: `repeat(${allCols.length}, minmax(0, 1fr))` };
            const innerMinWidth = { minWidth: `${Math.max(allCols.length * 220, 600)}px` };
            const stickyTop = `${175 + hypotheseH}px`;

            // Bandeau sticky réutilisable pour chaque phase (vie / décès / rente)
            const PhaseStickyBandeau = ({ title, controls }) => (
              <div className="sticky -mx-2 px-2 no-print" style={{top: stickyTop, zIndex: 20, background: '#fafaf9', paddingTop: '5px', paddingBottom: '5px'}}>
                <div className="space-y-1">
                  {/* Bandeau titre */}
                  <div className="rounded-xl shadow-xl overflow-hidden" style={{
                    background: 'linear-gradient(180deg, rgba(68, 64, 60, 0.72) 0%, rgba(87, 83, 78, 0.65) 100%)',
                    border: '1px solid rgba(255, 255, 255, 0.20)',
                    backdropFilter: 'blur(14px)',
                    WebkitBackdropFilter: 'blur(14px)',
                  }}>
                    <div className="h-[2px] bg-gradient-to-r from-red-700 via-red-500 to-red-700"></div>
                    <div className="px-4 py-1 grid grid-cols-[1fr_auto_1fr] items-center gap-3">
                      <div></div>
                      <div className="text-center text-[12px] uppercase tracking-widest font-extrabold text-white whitespace-nowrap">{title}</div>

                  {/* Bandeau colonnes */}

                    <div className="rounded-xl shadow-lg overflow-hidden" style={{
                      background: 'linear-gradient(180deg, rgba(68, 64, 60, 0.72) 0%, rgba(87, 83, 78, 0.65) 100%)',

                      backdropFilter: 'blur(14px)',

                    }}>
                      <div className="py-1 grid gap-3" style={{gridTemplateColumns: `repeat(${allCols.length}, minmax(0, 1fr))`}}>
                        {allCols.map((col, i) => (
                          <div key={`stk-${i}`} className="text-center px-3">
                            <div className="inline-flex items-center gap-1.5 max-w-full">
                              <span className="w-1.5 h-3 rounded-full flex-shrink-0" style={{background: colAccent(col)}}></span>
                              <span className="text-[12px] font-bold text-white truncate">{col.name}</span>
                            </div>

            );

            // MULTI-PROJET : Vie + Décès côte à côte, Rente en dessous (gain de place, pas de comparaison)

              const col = allCols[0];
              const BlockTitle = ({ children }) => (
                <div className="rounded-xl px-4 py-2 mb-2 text-center text-[12px] uppercase tracking-widest font-extrabold text-white overflow-hidden" style={{ background: 'linear-gradient(180deg, rgba(68,64,60,0.9), rgba(87,83,78,0.85))' }}>
                  <div className="h-[2px] -mx-4 -mt-2 mb-2 bg-gradient-to-r from-red-700 via-red-500 to-red-700"></div>
                  {children}
                </div>
              );
              return (
                <div className="mt-5 space-y-4">
                  {/* Sélecteur de scénario */}
                  <div className="flex items-center justify-end gap-2">
                    <span className="text-[10px] uppercase tracking-wider font-semibold text-stone-500">Scénario</span>
                    <div className="inline-flex bg-stone-100 rounded-lg p-1 ring-1 ring-stone-200">
                      {[{id:"pess",label:"Pess."},{id:"med",label:"Médian"},{id:"opt",label:"Opt."}].map(l => (
                        <button key={l.id} onClick={()=>setScenarioLvl(l.id)}
                          className={`px-2.5 py-1 rounded-md text-[11px] font-bold transition ${scenarioLvl===l.id ? 'bg-stone-900 shadow-sm text-white' : 'text-stone-500 hover:text-stone-900'}`}>{l.label}</button>
                      ))}
                    </div>
                  </div>
                  {/* Vie + Décès côte à côte — hauteurs égales (carte verte étirée) */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-stretch">
                    <div className="flex flex-col">
                      <BlockTitle>En cas de vie</BlockTitle>
                      <div className="bg-white p-3 rounded-2xl shadow-lg flex-1 flex [&>div]:h-full [&>div]:w-full [&>div]:flex [&>div]:flex-col [&>div]:justify-between"><DetailHeaderInvestCell col={col} onRemove={null} /></div>
                    </div>
                    <div className="flex flex-col">
                      <BlockTitle>En cas de décès</BlockTitle>
                      <div className="bg-white p-3 rounded-2xl shadow-lg flex-1 flex [&>div]:h-full [&>div]:w-full [&>div]:flex [&>div]:flex-col [&>div]:justify-between"><DetailDecesCell col={col} isBest={false} /></div>
                    </div>
                  </div>
                  {/* Rente à vie BRUTE, séparée PER / Assurance-Vie (capital préservé) */}
                  {(() => {
                    const rm = sim.rdt > 0 ? Math.pow(1 + sim.rdt, 1 / 12) - 1 : 0;
                    const perCap = sim.multi?.per?.proj?.capitalFin || 0;
                    const avCap = sim.multi?.av?.proj?.capitalFin || 0;
                    const perRB = perCap * rm, avRB = avCap * rm;
                    const RenteBrutCard = ({ titre, accent, cap, rb }) => (
                      <div className="rounded-2xl p-5 text-center shadow-sm" style={{ background: `${accent}0c`, border: `1px solid ${accent}44` }}>
                        <div className="flex items-center justify-center gap-2 mb-2">
                          <span className="w-2.5 h-2.5 rounded-full" style={{ background: accent }} />
                          <span className="text-[12px] uppercase tracking-widest font-extrabold" style={{ color: accent }}>{titre}</span>
                        </div>
                        <div className="text-[10px] uppercase tracking-widest font-bold text-stone-500 mb-1">Rente mensuelle brute</div>
                        <div className="num text-[30px] font-extrabold tracking-tightest leading-none" style={{ color: accent }}>{fmtEUR(rb)}<span className="text-sm font-medium text-stone-400"> /mois</span></div>
                        <div className="text-[10px] text-stone-500 mt-2 pt-2 border-t border-stone-100">Capital {fmtEURc(cap)} · à vie, capital préservé</div>
                      </div>
                    );
                    return (
                      <div>
                        <BlockTitle>Rente à vie brute · par produit</BlockTitle>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <RenteBrutCard titre="PER" accent="#6d28d9" cap={perCap} rb={perRB} />
                          <RenteBrutCard titre="Assurance-Vie" accent="#0f766e" cap={avCap} rb={avRB} />
                        </div>
                        <div className="mt-3 rounded-2xl px-6 py-4 flex items-center justify-center gap-3 flex-wrap text-center" style={{ background: 'rgba(15,118,110,0.06)', border: '1px solid rgba(15,118,110,0.25)' }}>
                          <span className="text-[12px] uppercase tracking-widest font-bold text-stone-500">Rente brute totale à vie</span>
                          <span className="num text-[30px] font-extrabold tracking-tightest leading-none text-teal-700">{fmtEUR(perRB + avRB)}<span className="text-sm font-medium text-stone-400"> /mois</span></span>
                        </div>
                      </div>
                    );
                  })()}
                </div>
              );
            }
            return (
              <>
                {/* ────── PHASE VIE ────── */}
                <div className="mt-5">
                  <PhaseStickyBandeau title={isCapiProduit ? "Détail par solution" : "Détail par solution en cas de vie"} controls={null} />
                  <div className="overflow-x-auto -mx-2 px-2 mb-2">
                    <div style={innerMinWidth}>
                      <div className="grid gap-6 pt-3 items-stretch" style={gridStyle}>
                        {allCols.map((col, i) => (
                          <div key={`hi-wrap-${col.type === 'scenario' ? `s${col.idx}` : col.type}`}
                            className="bg-white p-3 rounded-2xl shadow-lg flex flex-col">
                            <DetailHeaderInvestCell
                              col={col}
                              onRemove={col.type === 'scenario' ? () => removeScen(col.idx) : col.type === 'autreAV' ? removeAutreAV : null}

                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                {/* ────── PHASE DÉCÈS ────── (AV/PER uniquement) */}
                {inputs.produit !== "capi" && (
                  <div className="mt-2">
                    <PhaseStickyBandeau title="Détail de la simulation en cas de décès" controls={null} />
                    <div className="overflow-x-auto -mx-2 px-2 mb-2">
                      <div style={innerMinWidth}>
                        <div className="grid gap-3 pt-3" style={gridStyle}>
                          {allCols.map((col, i) => (
                            <DetailDecesCell
                              key={`dec-${col.type === 'scenario' ? `s${col.idx}` : col.type}`}
                              col={col}
                              isBest={inputs.produit !== "multi" && col.netTransmis === bestNetTransmis}
                            />
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* ────── PHASE RENTE ────── (AV/PER uniquement) */}
                {!isCapiProduit && (
                  <div className="mt-2">
                    <PhaseStickyBandeau title="Rente" controls={<span className="text-[10px] text-stone-300 italic">à vie ou ajustable</span>} />
                    <div className="overflow-x-auto -mx-2 px-2 mb-2">
                      <div style={innerMinWidth}>
                        <div className="grid gap-3 pt-4" style={gridStyle}>
                          {allCols.map((col, i) => (
                            <DetailRenteCell
                              key={`rente-${col.type === 'scenario' ? `s${col.idx}` : col.type}`}

                              isBest={inputs.produit !== "multi" && col.renteNetteMois === bestRente}

                      </div>
                    </div>
                  </div>
                )}

                {/* FOOTER charger scénario */}
                {allCols.some(c => c.type === 'scenario') && (
                  <div className="overflow-x-auto -mx-2 px-2 mt-3 no-print">
                    <div style={innerMinWidth}>
                      <div className="grid gap-3" style={gridStyle}>
                        {allCols.map((col, i) => col.type === 'scenario' ? (
                          <button key={`f-s${col.idx}`} onClick={() => loadScen(scenarios[col.idx])}
                            className="text-[11px] font-semibold text-stone-700 hover:text-stone-900 hover:bg-stone-100 py-2 rounded-lg border border-stone-200 transition">
                            Charger ce scénario

                      </div>
                    </div>
                  </div>
                )}
              </>
            );
          })()}

        </div>
      );
    }

    // ============================================================
    // BUILD COMPARATIF COLS — calcul partagé des colonnes (solution / référence / scénarios)
    // ⚠️ COPIE FIDÈLE de la logique des useMemo de Step4Resultats.
    //    Garder synchronisé si les formules de l'onglet Comparatif changent.
    //    Permet à l'onglet 5 (présentation) d'afficher EXACTEMENT les mêmes chiffres.
    // ============================================================
    function buildComparatifCols(inputs, sim, scenarios, scenarioLvl) {
      const isPERProduit = inputs.produit === "per";
      const isCapiProduit = inputs.produit === "capi";
      const produitLabel = inputs.produit === "per" ? "PER" : inputs.produit === "capi" ? "Capi PM" : inputs.produit === "multi" ? "PER + AV" : "Ass Vie";
      const livretNom = isCapiProduit ? "Compte à terme" : (LIVRETS.find(p=>p.id===inputs.livretId)?.nom || "Livret");
      const refLabel = isCapiProduit ? "Compte à terme" : "Livret";
      const ligne = inputs.successionLine ?? 'directe';
      const txIndirect = inputs.successionTauxIndirect ?? TX_SUCC_INDIRECT;
      const txDirect = inputs.successionTauxDirect ?? 0.30;

      // --- LIVRET / CAT ---
      const livretProj = projLivret(inputs);
      const livretFisc = fiscaliteLivret(livretProj.capitalFin);
      const renteBruteAn = renteBruteAnnuelle(livretProj.capitalFin, inputs.livretTaux);
      const renteFiscLiv = livretRenteFisc(inputs, renteBruteAn);
      const livretCol = {
        type: "livret", name: livretNom, subtitle: `Taux ${fmtPCT(inputs.livretTaux)}`,
        capital: livretProj.capitalFin, versements: livretProj.totVerse, plusValue: livretProj.plusValue,
        rdt: inputs.livretTaux, capitalDeces: livretProj.capitalFin,
        abattement: livretFisc.abattTotal,
        abattDetail: "Capital transmis sans fiscalité chiffrée",
        imposable: livretFisc.imposableTotal, taxe: livretFisc.droits, taxeLabel: "Droits de succession",
        netTransmis: livretFisc.net, renteBrute: renteBruteAn,
        renteNetteAn: renteBruteAn - renteFiscLiv.impot, renteNetteMois: (renteBruteAn - renteFiscLiv.impot) / 12,
        renteImpot: renteFiscLiv.impot, renteImpotIR: renteFiscLiv.ir, renteImpotPS: renteFiscLiv.ps,
        renteAb: 0, rentePlus8: false,
        renteRegime: renteFiscLiv.regime, renteFiscLineaire: true, isPER: false, reductionImpotCumulee: 0, coutReel: livretProj.totVerse,
      };

      // --- PER + RÉINTÉGRATION ---
      let perReinvestCol = null;
      if (isPERProduit) {
        const auxCap = sim.perReinvest?.auxCap || 0;
        const totReduc = sim.perReinvest?.totReduc || 0;
        const totReinvesti = sim.perReinvest?.totReinvesti || 0;
        const totalCap = sim.proj.capitalFin + auxCap;
        const fiscSucc = fiscaliteAV(totalCap, sim.proj.totVerseNet + totReinvesti, inputs.nbBeneficiaires, inputs.ageSouscripteur, txIndirect, sim.proj.totVerseBrut + totReinvesti, ligne, txDirect);
        // PER + Réintégration : la fiscalité de la rente d'un PER n'est PAS celle d'une
        // assurance-vie (pas d'abattement 4 600 €, pas de PFL 7,5 %). On restitue donc la
        // rente BRUTE perpétuelle, exactement comme la colonne Solution PER.
        const renteBrutePerR = renteBruteAnnuelle(totalCap, sim.rdt);
        perReinvestCol = {
          type: "perReinvest", name: "PER + Réintégration", subtitle: "Réductions réinvesties · levier fiscal composé",
          capital: totalCap, versements: sim.proj.totVerseBrut + totReinvesti,
          plusValue: Math.max(0, totalCap - sim.proj.totVerseBrut - totReinvesti), rdt: sim.rdt, capitalDeces: totalCap,
          abattement: fiscSucc.abattTotal,
          abattDetail: fiscSucc.av70 ? `${ABATT_AV_70.toLocaleString('fr-FR')} € × ${inputs.nbBeneficiaires} bénéf.` : `Abatt. global après 70 ans`,
          imposable: fiscSucc.imposableTotal, taxe: fiscSucc.taxe, taxeLabel: "Taxe PER+AV (art. 990 I)", netTransmis: fiscSucc.direct,
          renteBrute: renteBrutePerR, renteNetteAn: renteBrutePerR, renteNetteMois: renteBrutePerR / 12,
          renteImpot: 0, renteImpotIR: 0, renteImpotPS: 0, renteAb: 0, rentePlus8: false,
          renteRegime: "RVTO (PER + réinvest.)", isPER: true,
          reductionImpotCumulee: totReduc, coutReel: sim.proj.totVerseBrut,
        };
      }

      // --- SOLUTION ACTUELLE ---
      let s_abattement = sim.fisc.abattTotal;
      let s_abattDetail = sim.fisc.av70 ? `${ABATT_AV_70.toLocaleString('fr-FR')} € × ${inputs.nbBeneficiaires} bénéf.` : `Abatt. global après 70 ans`;
      let s_taxeLabel = "Taxe AV (art. 990 I)";
      let s_netTransmis = sim.fisc.direct;
      if (isPERProduit) { s_taxeLabel = "Taxe PER (art. 990 I)"; }
      else if (isCapiProduit) {
        s_abattement = 0;
        s_abattDetail = `Personne morale — capital brut à terme`;
        s_taxeLabel = "Impôt sur les sociétés";
        s_netTransmis = sim.fiscCapi?.netCapital || sim.fisc.direct;
      }
      const s_reductionImpotCumulee = isPERProduit ? (sim.fiscPER?.ecoFiscEntree || 0) : 0;
      const s_coutReel = isPERProduit ? Math.max(0, sim.proj.totVerseBrut - s_reductionImpotCumulee) : sim.proj.totVerseBrut;
      const solutionCol = {
        type: "solution", isPER: isPERProduit, isCapi: isCapiProduit, name: `Solution ${produitLabel}`,
        subtitle: `Rdt ${fmtPCT(sim.rdt)} · ${scenarioLvl === "med" ? "médian" : scenarioLvl === "pess" ? "pessimiste" : "optimiste"}`,
        capital: sim.proj.capitalFin, versements: sim.proj.totVerseBrut,
        plusValue: Math.max(0, sim.proj.capitalFin - sim.proj.totVerseBrut), rdt: sim.rdt, capitalDeces: sim.proj.capitalFin,
        abattement: s_abattement, abattDetail: s_abattDetail, imposable: sim.fisc.imposableTotal,
        taxe: sim.fisc.taxe, taxeLabel: s_taxeLabel, netTransmis: s_netTransmis,
        // PER : la fiscalité de la rente dépend du RFR et du plafonnement de l'abattement
        // de 10 % → non chiffrable ici. On affiche donc PARTOUT la même rente BRUTE
        // perpétuelle (capital préservé), identique à celle de la diapo « Rente ».
        renteBrute: isPERProduit ? renteBruteAnnuelle(sim.proj.capitalFin, sim.rdt) : sim.rente.brute,
        renteNetteAn: isPERProduit ? renteBruteAnnuelle(sim.proj.capitalFin, sim.rdt) : sim.rente.nette,
        renteNetteMois: (isPERProduit ? renteBruteAnnuelle(sim.proj.capitalFin, sim.rdt) : sim.rente.nette) / 12,
        renteImpotPS: isPERProduit ? 0 : sim.rente.impPS, renteAb: isPERProduit ? 0 : sim.rente.ab, rentePlus8: isPERProduit ? false : sim.rente.plus8,
        renteRegime: isPERProduit ? "RVTO (PER)" : isCapiProduit ? "Non applicable (PM)" : sim.rente.regime,
        reductionImpotCumulee: s_reductionImpotCumulee, coutReel: s_coutReel,
      };

      // --- SCÉNARIOS ---
      const scenarioCols = scenarios.map((s, idx) => {
        const sSim = runSimulation(s.inputs, scenarioLvl);
        const sIsPER = s.inputs.produit === "per";
        const sRedCumulee = sIsPER ? (sSim.fiscPER?.ecoFiscEntree || 0) : 0;
        return {
          type: "scenario", name: s.nom, subtitle: `Rdt ${fmtPCT(sSim.rdt)}`, idx, isPER: sIsPER,
          capital: sSim.proj.capitalFin, versements: sSim.proj.totVerseBrut,
          plusValue: Math.max(0, sSim.proj.capitalFin - sSim.proj.totVerseBrut), rdt: sSim.rdt, capitalDeces: sSim.proj.capitalFin,
          abattement: sSim.fisc.abattTotal,
          abattDetail: sSim.fisc.av70 ? `${ABATT_AV_70.toLocaleString('fr-FR')} € × ${s.inputs.nbBeneficiaires} bénéf.` : `Abatt. global après 70 ans`,
          imposable: sSim.fisc.imposableTotal, taxe: sSim.fisc.taxe, taxeLabel: "Taxe AV (art. 990 I)", netTransmis: sSim.fisc.direct,
          renteBrute: sIsPER ? renteBruteAnnuelle(sSim.proj.capitalFin, sSim.rdt) : sSim.rente.brute,
          renteNetteAn: sIsPER ? renteBruteAnnuelle(sSim.proj.capitalFin, sSim.rdt) : sSim.rente.nette,
          renteNetteMois: (sIsPER ? renteBruteAnnuelle(sSim.proj.capitalFin, sSim.rdt) : sSim.rente.nette) / 12,
          renteRegime: sIsPER ? "Rente brute indicative (PER)" : sSim.rente.regime,
          renteImpotPS: sIsPER ? 0 : sSim.rente.impPS, renteAb: sIsPER ? 0 : sSim.rente.ab, rentePlus8: sIsPER ? false : sSim.rente.plus8,
          reductionImpotCumulee: sRedCumulee, coutReel: sIsPER ? Math.max(0, sSim.proj.totVerseBrut - sRedCumulee) : sSim.proj.totVerseBrut,
        };
      });

      const referenceCol = isPERProduit ? perReinvestCol : livretCol;
      const allCols = isPERProduit ? [solutionCol, referenceCol, ...scenarioCols] : [referenceCol, solutionCol, ...scenarioCols];
      return { isPERProduit, isCapiProduit, produitLabel, livretNom, refLabel, livretCol, perReinvestCol, solutionCol, scenarioCols, referenceCol, allCols };
    }

    // ============================================================
    // CLIENT WOW SCREEN — Mode présentation client (deck de slides plein écran)
    // Palette claire & chic. Rendu en PORTAL (document.body) pour échapper au
    // contexte d'empilement du simulateur (sinon le header/breadcrumb traverse).
    // ============================================================
    const WOW_GOLD = "#b8924e", WOW_INK = "#1d2735", WOW_TEAL = "#0f766e", WOW_SUB = "#6b7280";

    // Détail par produit d'un multi-projet PER + AV (2 cartes). variant: "screen" | "print"
    function MultiDetailCards({ inputs, sim, variant = "screen" }) {
      if (!inputs || inputs.produit !== "multi" || !sim || !sim.multi) return null;
      const isPrint = variant === "print";
      const rdtMed = sim.rdtMed != null ? sim.rdtMed : sim.rdt;
      const dureeTxt = `${inputs.dureeAnnees} an${inputs.dureeAnnees > 1 ? 's' : ''}`;
      const rdtTxt = (rdtMed != null && !isNaN(rdtMed)) ? `${(rdtMed * 100).toFixed(2).replace('.', ',')} %` : '—';
      const cards = [
        { titre: "PER", accent: "#6d28d9", s: sim.multi.per, per: true, cfg: (inputs.multi && inputs.multi.per) || {} },
        { titre: "Assurance-Vie", accent: "#0f766e", s: sim.multi.av, per: false, cfg: (inputs.multi && inputs.multi.av) || {} },
      ];
      const Row = ({ label, value, strong, accent }) => (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: isPrint ? "0.8mm 0" : "3px 0", borderTop: "1px solid rgba(0,0,0,0.06)" }}>
          <span style={{ fontSize: isPrint ? "7.5pt" : "12px", color: "#6b7280" }}>{label}</span>
          <span className="num" style={{ fontSize: isPrint ? "8.5pt" : "13px", fontWeight: strong ? 800 : 700, color: strong ? accent : "#1d2735" }}>{value}</span>
        </div>
      );
      return (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: isPrint ? "4mm" : "12px" }}>
          {cards.map(({ titre, accent, s, per, cfg }, k) => {
            const verse = s.proj.totVerseBrut;
            const capital = s.proj.capitalFin;
            const eco = per ? (s.fiscPER?.ecoFiscEntree || 0) : null;
            const transmission = s.fisc?.direct || 0;
            const renteMois = (s.rente?.nette || 0) / 12;
            return (
              <div key={k} style={{ background: `${accent}0a`, border: `1px solid ${accent}33`, borderRadius: isPrint ? "2.5mm" : "14px", padding: isPrint ? "2.6mm 3mm" : "14px 16px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "6px", marginBottom: isPrint ? "1mm" : "6px" }}>
                  <span style={{ width: 8, height: 8, borderRadius: 99, background: accent, flexShrink: 0 }} />
                  <span style={{ fontSize: isPrint ? "8pt" : "12px", fontWeight: 800, letterSpacing: "0.05em", textTransform: "uppercase", color: accent }}>{titre}</span>
                </div>
                {/* Rappel des paramètres de versement */}
                <div style={{ fontSize: isPrint ? "6.5pt" : "10.5px", color: "#6b7280", lineHeight: 1.35, marginBottom: isPrint ? "1.4mm" : "8px", paddingBottom: isPrint ? "1.2mm" : "7px", borderBottom: "1px solid rgba(0,0,0,0.06)" }}>
                  Initial <b style={{ color: "#1d2735" }}>{fmtEUR(cfg.versementInitial || 0)}</b> · Périodique <b style={{ color: "#1d2735" }}>{fmtEUR(cfg.versementMensuel || 0)}/mois</b><br />
                  Durée <b style={{ color: "#1d2735" }}>{dureeTxt}</b> · Rendement médian <b style={{ color: "#1d2735" }}>{rdtTxt}</b>
                </div>
                <Row label="Versé" value={fmtEUR(verse)} accent={accent} />
                <Row label="Capital à terme" value={fmtEUR(capital)} strong accent={accent} />
                {eco != null && <Row label="Économie d'impôt" value={fmtEUR(eco)} accent={accent} />}
                <Row label="Transmission nette" value={fmtEUR(transmission)} accent={accent} />
                <Row label="Rente estimée" value={`${fmtEUR(renteMois)}/mois`} accent={accent} />
              </div>
            );
          })}
        </div>
      );
    }

    // Défini au niveau module (et non dans le render du parent) : sinon React recrée le type
    // du composant à chaque rendu et remonte tout le graphe (survol perdu, clignotement).
    // Formatage court des montants d'axe (k€) — utilisé par ProjChart, remonté au niveau module
    // en même temps que le composant (il vivait auparavant dans ClientWowScreen, ce qui rendait
    // ProjChart non fonctionnel une fois extrait : ReferenceError sur kEUR au premier rendu).
    const kEUR = v => v == null || isNaN(v) ? "—" : (Math.abs(v) >= 1000 ? `${Math.round(v / 1000)} k€` : `${Math.round(v)} €`);
    const ProjChart = ({ height = 360, series, refLabel, heroLabel, comparLabel, scenLabel, medSub, comparSub, inputs }) => {
      const [hoverIdx, setHoverIdx] = useState(null);
      const Sx = series || { med: [], pess: [], opt: [], ref: [] };
      const rLabel = refLabel || 'Référence';
      const lastOf2 = a => (a && a.length ? a[a.length - 1] : 0);
      const medF2 = lastOf2(Sx.med), pessF2 = lastOf2(Sx.pess), optF2 = lastOf2(Sx.opt), refF2 = lastOf2(Sx.ref), comparF2 = lastOf2(Sx.compar);
      const all = [Sx.med, Sx.pess, Sx.opt, Sx.ref, Sx.compar].filter(a => a && a.length >= 2);
      if (!all.length) return null;
      const n = Math.max(...all.map(a => a.length));
      const maxV = (Math.max(...all.flatMap(a => a)) || 1) * 1.06;
      const W = 820, Hh = height, pl = 56, pr = 250, pt = 30, pb = 34;
      const x = idx => pl + (idx / (n - 1)) * (W - pl - pr);
      const y = v => Hh - pb - (v / maxV) * (Hh - pt - pb);
      const poly = d => d.map((v, idx) => `${x(idx).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const area = d => `${x(0)},${Hh - pb} ${poly(d)} ${x(d.length - 1)},${Hh - pb}`;
      const tunnel = (Sx.opt && Sx.opt.length >= 2 && Sx.pess && Sx.pess.length >= 2) ? `${poly(Sx.opt)} ${Sx.pess.map((v, idx) => `${x(Sx.pess.length - 1 - idx).toFixed(1)},${y(Sx.pess[Sx.pess.length - 1 - idx]).toFixed(1)}`).join(" ")}` : null;
      const labels = [];
      if (Sx.compar && Sx.compar.length) labels.push({ v: comparF2, t: scenLabel || comparLabel || "Médian", pp: comparSub, c: WOW_GOLD, b: true });
      if (Sx.med && Sx.med.length) labels.push({ v: medF2, t: scenLabel || "Médian", pp: medSub, c: WOW_TEAL, b: true });
      if (Sx.opt && Sx.opt.length) labels.push({ v: optF2, t: "Optimiste", c: "#16a34a", sec: true });
      if (Sx.pess && Sx.pess.length) labels.push({ v: pessF2, t: "Prudent", c: "#b45309", sec: true });
      if (Sx.ref && Sx.ref.length) labels.push({ v: refF2, t: rLabel, c: "#9a948c" });
      // Placement anti-chevauchement SÉPARÉ pour chaque colonne (primaire = médian/comparatif ; secondaire = optimiste/prudent, décalés à droite)
      const place = (arr) => { arr.sort((a, b) => b.v - a.v); let pv = -Infinity; return arr.map(l => { let yy = y(l.v); const gap = 44; if (yy < pv + gap) yy = pv + gap; pv = yy; return { ...l, yy }; }); };
      const placed = [...place(labels.filter(l => !l.sec)), ...place(labels.filter(l => l.sec))];
      const hasSec = labels.some(l => l.sec);   // scénarios (opt/prudent) affichés → zone droite occupée
      const yticks = [0, 0.5, 1];
      return (
        <svg viewBox={`0 0 ${W} ${Hh}`} className="w-full" style={{ maxHeight: height + 10, cursor: 'crosshair' }} onMouseMove={(e) => { const r = e.currentTarget.getBoundingClientRect(); const sx = (e.clientX - r.left) / r.width * W; let idx = Math.round((sx - pl) / (W - pl - pr) * (n - 1)); idx = Math.max(0, Math.min(n - 1, idx)); setHoverIdx(idx); }} onMouseLeave={() => setHoverIdx(null)}>
          <defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#0f766e" stopOpacity="0.16" /><stop offset="100%" stopColor="#0f766e" stopOpacity="0" /></linearGradient></defs>
          {yticks.map((p, k) => (<g key={k}><line x1={pl} y1={pt + (1 - p) * (Hh - pt - pb)} x2={W - pr} y2={pt + (1 - p) * (Hh - pt - pb)} stroke="rgba(29,39,53,0.09)" strokeWidth="1" /><text x={pl - 10} y={pt + (1 - p) * (Hh - pt - pb) + 4} textAnchor="end" fontSize="12" fill={WOW_SUB} className="num">{kEUR(p * maxV)}</text></g>))}
          <circle cx={W - pr} cy={Hh - pb} r="2.5" fill={WOW_SUB} />
          <text x={W - pr} y={Hh - 8} textAnchor="middle" fontSize="12" fill={WOW_SUB}>{inputs.dureeAnnees} ans</text>
          {tunnel && <polygon points={tunnel} fill="rgba(15,118,110,0.07)" />}
          {Sx.med && Sx.med.length >= 2 && <polygon points={area(Sx.med)} fill="url(#wgrad)" />}
          {Sx.ref && Sx.ref.length >= 2 && <polyline points={poly(Sx.ref)} fill="none" stroke="#b8b2a8" strokeWidth="2.2" strokeDasharray="7 5" />}
          {Sx.opt && Sx.opt.length >= 2 && <polyline points={poly(Sx.opt)} fill="none" stroke="#16a34a" strokeWidth="1.6" strokeDasharray="2 4" opacity="0.7" />}
          {Sx.pess && Sx.pess.length >= 2 && <polyline points={poly(Sx.pess)} fill="none" stroke="#b45309" strokeWidth="1.6" strokeDasharray="2 4" opacity="0.7" />}
          {Sx.med && Sx.med.length >= 2 && <polyline points={poly(Sx.med)} fill="none" stroke={WOW_TEAL} strokeWidth="4" strokeLinejoin="round" />}
          {Sx.compar && Sx.compar.length >= 2 && <polyline points={poly(Sx.compar)} fill="none" stroke={WOW_GOLD} strokeWidth="4" strokeLinejoin="round" />}
          {Sx.med && Sx.med.length >= 2 && <g><circle cx={x(0)} cy={y(Sx.med[0])} r="4.5" fill={WOW_INK} stroke="#fdfbf6" strokeWidth="1.5" /><text x={pl - 10} y={y(Sx.med[0]) + 4} textAnchor="end" fontSize="13" fontWeight="700" fill={WOW_INK} className="num">{fmtEUR(Sx.med[0])}</text></g>}
          {placed.map((l, k) => {
            const tx = l.sec ? x(n - 1) + 150 : x(n - 1) + 19;
            return (<g key={k}>
              <circle cx={x(n - 1)} cy={y(l.v)} r="4" fill={l.c} stroke="#fdfbf6" strokeWidth="1.5" />
              <line x1={x(n - 1) + 4} y1={y(l.v)} x2={x(n - 1) + 16} y2={l.yy} stroke={l.c} strokeWidth="1" opacity="0.45" />
              {l.sec && <line x1={x(n - 1) + 20} y1={l.yy} x2={tx - 6} y2={l.yy} stroke={l.c} strokeWidth="1.2" strokeDasharray="1.5 3" opacity="0.55" />}
              <text x={tx} y={l.yy - 1} fontSize="13" fontWeight={l.b ? "800" : "600"} fill={l.c} className="num">{fmtEUR(l.v)}</text>
              <text x={tx} y={l.yy + 12} fontSize="9.5" fontWeight="700" fill={l.b ? l.c : WOW_SUB}>{l.t}</text>
              {l.pp && (hasSec
                ? <text x={tx} y={l.yy + 23} fontSize="10" fontWeight="800" fill={l.c} className="num">{l.pp}</text>
                : <>
                    <line x1={tx + 96} y1={l.yy - 4} x2={W - 96} y2={l.yy - 4} stroke={l.c} strokeWidth="1.2" strokeDasharray="1.5 3" opacity="0.6" />
                    <text x={W - 8} y={l.yy} textAnchor="end" fontSize="12.5" fontWeight="800" fill={l.c} className="num">{l.pp}</text>
                  </>
              )}
            </g>);
          })}
          {/* Repères — chaque pastille placée à l'aplomb de sa ligne pointillée (année) ; décalée en ligne si collision */}
          {(() => {
            const comps = (inputs.versementsComplementaires || []).filter(v => (Number(v.montant) || 0) > 0 && (Number(v.annee) || 0) >= 0 && (Number(v.annee) || 0) <= (n - 1));
            if (!comps.length) return null;
            const by = pt;
            const hH = 17, gap = 5, pW = 78, pH = 27;
            const headerW = comps.length > 1 ? 164 : 156;
            // sommet de courbe (optimiste sinon médian) à une année
            const curveTopVal = (yr) => {
              const idx = Math.min((Sx.med ? Sx.med.length : 1) - 1, Math.round(yr));
              const cands = [Sx.opt, Sx.med].filter(s => s && s.length).map(s => s[idx] || 0);
              return cands.length ? Math.max(...cands) : 0;
            };
            const sorted = comps.map(v => ({ v, yr: Number(v.annee) || 0 })).sort((a, b) => a.yr - b.yr);
            // pastille À L'APLOMB de son année, poussée dans l'espace vide EN HAUT ; empilée si années proches ; jamais sur la courbe
            const rects = [{ x: pl + 6, y: by, w: headerW, h: hH }];
            const hitR = (a, b) => !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
            const findRow = (px, startY, maxY) => { let yy = startY; while (yy <= maxY) { const r = { x: px, y: yy, w: pW, h: pH }; if (!rects.some(q => hitR(r, q))) return yy; yy += (pH + gap); } return null; };
            const placed = sorted.map(({ v, yr }) => {
              const xc = pl + (yr / (n - 1)) * (W - pl - pr);
              const mv = (Sx.med && Sx.med.length) ? (Sx.med[Math.min(Sx.med.length - 1, Math.round(yr))] || 0) : 0;
              const yv = y(mv);
              const xt = Math.max(pl + pW / 2 + 2, Math.min(W - pr - pW / 2 - 2, xc));
              const px = xt - pW / 2;
              const maxY = y(curveTopVal(yr)) - pH - 6;      // reste au-dessus de la courbe
              let py = findRow(px, pt + 2, Math.max(pt + 2, maxY));
              if (py == null) py = pt + 2;                   // repli : tout en haut
              rects.push({ x: px, y: py, w: pW, h: pH });
              return { v, yr, xc, yv, xt, px, py };
            });
            return (
              <g>
                {/* traits de rappel VERTICAUX du bas de la pastille jusqu'au point sur la courbe */}
                {placed.map((p, k) => (
                  <g key={`cd${k}`}>
                    <line x1={p.xc} y1={p.py + pH} x2={p.xc} y2={p.yv} stroke={WOW_GOLD} strokeWidth="1.1" strokeDasharray="3 3" opacity="0.45" />
                    <circle cx={p.xc} cy={p.yv} r="4" fill={WOW_GOLD} stroke="#fdfbf6" strokeWidth="1.5" />
                  </g>
                ))}
                {/* En-tête à gauche */}
                <rect x={pl + 6} y={by} width={headerW} height={hH} rx="7" fill={WOW_GOLD} />
                <text x={pl + 6 + headerW / 2} y={by + hH / 2 + 3} textAnchor="middle" fontSize="8.5" fontWeight="700" fill="#fff" style={{ letterSpacing: '0.06em', textTransform: 'uppercase' }}>{comps.length > 1 ? 'Versements complémentaires' : 'Versement complémentaire'}</text>
                {/* Pastilles apports */}
                {placed.map((p, k) => (
                  <g key={`cp${k}`}>
                    <rect x={p.px} y={p.py} width={pW} height={pH} rx="6" fill="#fff" stroke={WOW_GOLD} strokeWidth="1.5" />
                    <text x={p.xt} y={p.py + 12} textAnchor="middle" fontSize="10.5" fontWeight="800" fill={WOW_GOLD} className="num">+{fmtEUR(Number(p.v.montant) || 0)}</text>
