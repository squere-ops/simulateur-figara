                    </div>
                  </Q>
                </div>
                );
              })()}

              {/* ============ ÉTAPE 5 : PATRIMOINE & ÉPARGNE ============ */}
              {niveau === "complet" && etape === 5 && (
                <div>
                  <div className="text-[11px] text-stone-400 mb-1">Les biens locatifs déclarés dans les revenus fonciers (étape 3) sont déjà pris en compte.</div>
                  <Q q="Possédez-vous d'autres biens immobiliers (secondaire, terrain, hors locatifs déjà déclarés) ?" val={d.biensQ} on={v => { set("biensQ", v); if (v === "oui" && d.biens.length === 0) addList("biens", { type: "rs", nom: "", valeur: "", crd: "", enLocationQ: "", loyer: "", creditQ: "", mensualite: "", venteQ: "", venteDelai: "", note: "" }); }}>
                    <NcReveal key={d.biens.length} last>
                    {d.biens.map((b, i) => (
                      <div key={b.id} className="mb-2 bg-stone-50 border border-stone-200 rounded-lg px-3 py-2.5">
                        <div className="flex items-center gap-2 mb-2">
                          <span className="text-[10px] uppercase tracking-wider font-bold text-stone-400 flex-shrink-0">Bien {i+1}</span>
                          <input type="text" value={b.nom || ""} placeholder="Nom libre (ex. terrain à Melun)" onChange={ev => setList("biens", b.id, "nom", ev.target.value)}
                            className="flex-1 min-w-0 px-2 py-1.5 text-[12px] bg-white border border-stone-200 rounded-md focus:outline-none" />
                          <button onClick={() => rmList("biens", b.id)} className="p-1 text-stone-400 hover:text-red-600 transition flex-shrink-0"><I.x/></button>
                        </div>
                        <div className="mb-2">
                          <div className="flex flex-wrap gap-3">
                            <div className="w-64"><Select opts={[{v:"rs",l:"Résidence secondaire"},{v:"locatif",l:"Locatif"},{v:"terrain",l:"Terrain"},{v:"parts_sci",l:"Parts SCI/SCPI"},{v:"autre",l:"Autre"}]} val={b.type} on={v => setList("biens", b.id, "type", v)} /></div>
                            <div className="w-64"><Select opts={[
                              { v: "pp", l: "Pleine propriété" },
                              { v: "usufruit", l: "Usufruit (démembré)" },
                              { v: "nue_propriete", l: "Nue-propriété (démembré)" },
                            ]} val={b.detention || ""} on={v => setList("biens", b.id, "detention", v)} ph="— Détention —" /></div>
                          </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          {/* Le capital restant dû se saisit une seule fois, dans le bloc crédit (ci-dessous). */}
                          <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Valeur estimée</div><Slider v={b.valeur} on={v => setList("biens", b.id, "valeur", v)} min={200000} max={1500000} step={10000} /></div>
                        </div>
                        <div className="mt-2 flex items-center gap-4 flex-wrap">
                          <span className="text-[12px] font-semibold text-stone-700">Ce bien est-il en location ?</span>
                          <OuiNon val={b.enLocationQ || ""} on={v => setList("biens", b.id, "enLocationQ", v)} />
                        </div>
                        {b.enLocationQ === "oui" && (
                          <NcReveal>
                          <div className="mt-2 grid grid-cols-2 gap-2">
                            <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Loyer encaissé</div><EurQuick v={b.loyer || ""} on={v => setList("biens", b.id, "loyer", v)} unit="€/mois" presets={[500, 700, 900, 1200, 1500]} /></div>
                          </div>
                          </NcReveal>
                        )}
                        <Details label="+ Détails (crédit, objectif de vente, note…)" filled={!!(b.creditQ === "oui" || b.venteQ === "oui" || b.crd || b.note)}>
                        <div className="flex items-center gap-4 flex-wrap">
                          <span className="text-[12px] font-semibold text-stone-700">Un crédit sur ce bien ?</span>
                          <OuiNon val={b.creditQ || ""} on={v => setList("biens", b.id, "creditQ", v)} />
                        </div>
                        {b.creditQ === "oui" && (
                          <NcReveal>
                          <div className="mt-2 grid grid-cols-3 gap-2">
                            <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Dans quelle banque ?</div><BanqueSelect v={b.banque || ""} on={v => setList("biens", b.id, "banque", v)} known={banquesConnues} /></div>
                            <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Mensualité</div><Slider v={b.mensualite || ""} on={v => setList("biens", b.id, "mensualite", v)} min={500} max={4000} step={50} unit="€/mois" /></div>
                            <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Capital restant dû</div><Slider v={b.crd || ""} on={v => setList("biens", b.id, "crd", v)} min={0} max={ncInt(b.valeur) || 1500000} step={5000} /></div>
                            {enCouple && <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Assurance — quotités</div><Select opts={QUOTITE_OPTS} val={b.assurQuotite || ""} on={v => setList("biens", b.id, "assurQuotite", v)} /></div>}
                          </div>
                          <div className="mt-2 flex items-center gap-4 flex-wrap">
                            <span className="text-[12px] font-semibold text-stone-700">Assurance de prêt renégociée ?</span>
                            <OuiNon val={b.assurQ || ""} on={v => setList("biens", b.id, "assurQ", v)} />
                          </div>
                          {b.assurQ === "non" && (
                            <div className="mt-2 rounded-lg border border-stone-200 bg-white px-3 py-2.5">
                              <div className="text-[11px] font-bold text-stone-600 mb-2">Assurance emprunteur actuelle</div>
                              <div className="grid grid-cols-2 gap-2">
                                <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Assureur actuel</div><Txt v={b.assurAssureur || ""} on={v => setList("biens", b.id, "assurAssureur", v)} ph="Ex. contrat groupe banque" /></div>
                                <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Cotisation actuelle</div><Eur v={b.assurCotisation || ""} on={v => setList("biens", b.id, "assurCotisation", v)} unit="€/mois" /></div>
                              </div>
                              <div className="mt-2"><div className="text-[11.5px] font-bold text-stone-700 mb-1">Note</div><Txt v={b.assurNote || ""} on={v => setList("biens", b.id, "assurNote", v)} ph="Commentaire libre…" /></div>
                            </div>
                          )}
                          </NcReveal>
                        )}
                        <div className="mt-2 flex items-center gap-4 flex-wrap">
                          <span className="text-[12px] font-semibold text-stone-700">Objectif de vente ?</span>
                          <OuiNon val={b.venteQ || ""} on={v => setList("biens", b.id, "venteQ", v)} />
                        </div>
                        {b.venteQ === "oui" && (
                          <NcReveal>
                          <div className="mt-2">
                            <div className="text-[11.5px] font-bold text-stone-700 mb-1">Dans combien de temps ?</div>
                            <Chips opts={[{v:"<1",l:"< 1 an"},{v:"1-3",l:"1 – 3 ans"},{v:"3-5",l:"3 – 5 ans"},{v:">5",l:"> 5 ans"}]} val={b.venteDelai || ""} on={v => setList("biens", b.id, "venteDelai", v)} />
                          </div>
                          </NcReveal>
                        )}
                        <div className="mt-2">
                          <div className="text-[11.5px] font-bold text-stone-700 mb-1">Note</div>
                          <Txt v={b.note || ""} on={v => setList("biens", b.id, "note", v)} ph="Commentaire libre…" />
                        </div>
                        </Details>
                      </div>
                    ))}
                    </NcReveal>
                    <button type="button" onClick={() => addList("biens", { type: "rs", nom: "", valeur: "", crd: "", enLocationQ: "", loyer: "", creditQ: "", mensualite: "", venteQ: "", venteDelai: "", note: "" })}
                      className="w-full border-2 border-dashed border-stone-300 hover:border-stone-900 rounded-lg px-3 py-2 text-[12px] font-bold text-stone-600 hover:text-stone-900 transition flex items-center justify-center gap-1.5"><I.plus/> Ajouter un bien</button>
                  </Q>

                  <Q q="Avez-vous d'autres crédits en cours (consommation, auto…) ?" val={d.creditsQ} on={v => { set("creditsQ", v); if (v === "oui" && d.credits.length === 0) addList("credits", { nature: "conso", mensualite: "", crd: "", fin: "" }); }}>
                    <NcReveal key={d.credits.length} last>
                    {d.credits.map(c => (
                      <div key={c.id} className="mb-2 bg-stone-50 border border-stone-200 rounded-lg px-3 py-2.5">
                        <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
                          <div className="flex items-center gap-2 flex-wrap">
                            <Chips opts={[{v:"conso",l:"Consommation"},{v:"auto",l:"Auto"},{v:"autre",l:"Autre"}]} val={c.nature} on={v => setList("credits", c.id, "nature", v)} />
                            {c.nature === "autre" && <div className="w-64"><Txt v={c.naturePrecision || ""} on={v => setList("credits", c.id, "naturePrecision", v)} ph="Préciser (prêt familial, étudiant…)" /></div>}
                          </div>
                          <button onClick={() => rmList("credits", c.id)} className="p-1 text-stone-400 hover:text-red-600 transition flex-shrink-0"><I.x/></button>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                          <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Dans quelle banque ?</div><BanqueSelect v={c.banque || ""} on={v => setList("credits", c.id, "banque", v)} known={banquesConnues} /></div>
                          <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Mensualité</div><Slider v={c.mensualite} on={v => setList("credits", c.id, "mensualite", v)} min={0} max={2000} step={25} unit="€/mois" /></div>
                          <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Capital restant dû</div><Slider v={c.crd} on={v => setList("credits", c.id, "crd", v)} min={0} max={100000} step={1000} /></div>
                          <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Fin du crédit</div><input type="month" value={c.finMois || (c.fin ? `${c.fin}-12` : "")} onChange={e => { setList("credits", c.id, "finMois", e.target.value); setList("credits", c.id, "fin", (e.target.value || "").slice(0, 4)); }} className="num w-full px-3 py-2 text-[13px] bg-stone-50 border border-stone-200 rounded-lg focus:outline-none focus:border-stone-900" /></div>
                          {enCouple && <div><div className="text-[11.5px] font-bold text-stone-700 mb-1">Assurance — quotités</div><Select opts={QUOTITE_OPTS} val={c.assurQuotite || ""} on={v => setList("credits", c.id, "assurQuotite", v)} /></div>}
                        </div>
                      </div>
                    ))}
                    </NcReveal>
                    <button type="button" onClick={() => addList("credits", { nature: "conso", mensualite: "", crd: "", fin: "" })}
                      className="w-full border-2 border-dashed border-stone-300 hover:border-stone-900 rounded-lg px-3 py-2 text-[12px] font-bold text-stone-600 hover:text-stone-900 transition flex items-center justify-center gap-1.5"><I.plus/> Ajouter un crédit</button>
                  </Q>
                  <Q q="Avez-vous de l'épargne ou des placements ?" val={d.avoirsQ} on={v => { set("avoirsQ", v); if (v === "oui" && d.avoirs.length === 0) addList("avoirs", { type: "livrets", valeur: "", etablissement: "", precision: "", titulaire: "", origine: "", ppQ: "", pp: "", objectif: "", contentQ: "", gestion: "", profil: "", note: "" }); }}>
                    <NcReveal key={d.avoirs.length} last>
                    {d.avoirs.map((a, i) => {
                      const T = NC_TYPES_AVOIR.find(x => x.v === a.type) || NC_TYPES_AVOIR[0];
                      const estLivret = a.type === "livrets";
                      // Livret : détenteur + versement, rien d'autre (jamais d'origine des fonds).
                      // Hors communauté d'acquêts (séparation, participation, PACS, union libre) :
                      // le titulaire fait foi — pas de question d'origine. L'origine ne se demande
                      // qu'en communauté d'acquêts, et jamais pour un livret.
                      const manque = [
                        !a.valeur && "encours",
                        (enCouple && (estLivret || !regimeCommunaute) && !regimeUniverselle && !a.titulaire) && "détenteur",
                        (regimeCommunaute && !estLivret && !a.origine) && "origine",
                      ].filter(Boolean);
                      return (
                      <div key={a.id} className="mb-3 rounded-xl border-2 border-stone-200 bg-white overflow-hidden">
                        {/* — Bandeau : ce que le conseiller lit d'un coup d'œil — */}
                        <div className="flex items-center gap-2.5 px-3 py-2 border-b border-stone-200" style={{ background: T.c + "0f" }}>
                          <span className="num flex items-center justify-center rounded-lg text-white text-[11px] font-extrabold flex-shrink-0"
                                style={{ width: 24, height: 24, background: T.c }}>{i + 1}</span>
                          <span className="text-[13px] font-extrabold flex-shrink-0" style={{ color: T.c }}>{a.type === "autre" && a.precision ? a.precision : T.l}</span>
                          {ncInt(a.valeur) > 0 && <span className="num text-[13px] font-extrabold text-stone-900">{new Intl.NumberFormat('fr-FR').format(ncInt(a.valeur))} €</span>}
                          {a.etablissement && <span className="text-[11px] text-stone-500 truncate">{a.etablissement}</span>}
                          <span className="flex-1"></span>
                          {manque.length > 0 && <span className="text-[9px] uppercase tracking-wider font-bold text-red-600 flex-shrink-0">à compléter : {manque.join(", ")}</span>}
                          <button onClick={() => rmList("avoirs", a.id)} className="p-1 text-stone-400 hover:text-red-600 transition flex-shrink-0"><I.x/></button>
                        </div>

                        <div className="px-3 pb-3 pt-2.5">
                          {/* 1 — Nature du placement */}
                          <div className="text-[11.5px] font-bold text-stone-700 mb-1.5">Type de placement</div>
                          <div className="flex flex-wrap gap-3">
                            <div className="w-72"><Select opts={NC_TYPES_AVOIR} val={a.type} on={v => setList("avoirs", a.id, "type", v)} /></div>
                            {estLivret && (
                              <div className="w-72"><Select opts={NC_LIVRET_TYPES} val={a.livretType || ""} on={v => setList("avoirs", a.id, "livretType", v)} ph="Quel livret ?" /></div>
                            )}
                          </div>
                          {a.type === "autre" && (
                            <div className="mt-2"><div className="text-[11.5px] font-bold text-stone-700 mb-1">De quoi s'agit-il précisément ?</div><Txt v={a.precision || ""} on={v => setList("avoirs", a.id, "precision", v)} ph="Ex. crypto, or, crowdfunding, SCPI…" /></div>
                          )}

                          {/* 2 — Montants : l'encours (vital) reste visible ; l'établissement et le
                              versement programmé passent derrière « + Détails » plus bas. */}
                          <SousSection t="Montants">
                            <div className="grid grid-cols-2 gap-8 items-start">
                              <div>
                                <div className="text-[11.5px] font-bold text-stone-700 mb-1">Encours {!a.valeur && <span className="text-red-500 font-semibold">à saisir</span>}</div>
                                <Slider v={a.valeur} on={v => setList("avoirs", a.id, "valeur", v)}
                                  min={0}
                                  max={estLivret ? ((NC_LIVRET_TYPES.find(x => x.v === a.livretType) || {}).max || 22950) : a.type === "av" ? 500000 : 100000}
                                  step={estLivret ? 500 : a.type === "av" ? 5000 : 1000} />
                                {estLivret && a.livretType && <div className="text-[10px] text-stone-400 mt-0.5">plafond de versement {new Intl.NumberFormat('fr-FR').format((NC_LIVRET_TYPES.find(x => x.v === a.livretType) || {}).max || 0)} € — dépassement possible (intérêts) via ✎</div>}
                              </div>
                              <div>
                                <div className="text-[11.5px] font-bold text-stone-700 mb-1.5">Versement mensuel ?</div>
                                <OuiNon val={a.ppQ || ""} on={v => setList("avoirs", a.id, "ppQ", v)} />
                                {a.ppQ === "oui" && <div className="mt-2 w-56"><EurQuick v={a.pp || ""} on={v => setList("avoirs", a.id, "pp", v)} unit="€/mois" presets={[100, 200, 300, 500]} /></div>}
                              </div>
                            </div>
                          </SousSection>

                          {/* 3 — Détention. Le mode de saisie suit le régime matrimonial :
                              communauté d'acquêts → seule l'origine des fonds compte (art. 1402 C. civ.) ;
                              communauté universelle → commune / propre M. / propre Mme ;
                              autres régimes → saisie complète (titulaire + origine). */}
                          {!enCouple ? null : (estLivret && !regimeUniverselle) ? (
                            <SousSection t="À qui appartient ce livret ?">
                              <div className="max-w-sm"><Select opts={[
                                { v: "client", l: d.civilite === "Mme" ? "Madame" : "Monsieur" },
                                { v: "conjoint", l: marie ? "Le conjoint" : pacse ? "Le partenaire" : "Le concubin" },
                                { v: "commun", l: "Compte joint / commun" },
                              ]} val={a.titulaire || ""} on={v => setList("avoirs", a.id, "titulaire", v)} /></div>
                            </SousSection>
                          ) : regimeCommunaute ? (
                            <SousSection t="Cette épargne date d'avant ou pendant le mariage ?" hint="communauté : c'est l'origine des fonds qui décide propre / commun, pas le nom sur le compte">
                              <div className="max-w-sm"><Select opts={[
                                { v: "union", l: "Épargné pendant le mariage (commun)" },
                                { v: "avant", l: "Détenu avant le mariage (propre)" },
                                { v: "succession", l: "Succession / donation (propre)" },
                                { v: "nsp", l: "Ne sait pas — à reconstituer" },
                              ]} val={a.origine || ""} on={v => setList("avoirs", a.id, "origine", v)} /></div>
                              {(a.origine === "avant" || a.origine === "succession") && (
                                <div className="mt-1.5 rounded-lg bg-amber-50 border border-amber-300 px-2.5 py-1.5 text-[10px] text-amber-900 leading-relaxed">
                                  <b>Bien propre.</b> Sous le régime légal il le reste — encore faut-il pouvoir le prouver : origine des fonds tracée, et clause de remploi si les fonds servent à un achat (art. 1434 C. civ.). À défaut, présomption de communauté (art. 1402 C. civ.).
                                </div>
                              )}
                              {a.origine === "nsp" && (
                                <div className="mt-1.5 text-[10px] text-stone-500">À reconstituer avec le client : l'origine des fonds décide si l'avoir est propre ou commun (divorce, succession).</div>
                              )}
                            </SousSection>
                          ) : regimeUniverselle ? (
                            <SousSection t="Cet avoir est…" hint="communauté universelle : tout est commun, sauf exclusion prévue au contrat ou par le donateur">
                              <div className="max-w-sm"><Select opts={[
                                { v: "commun", l: "Épargne commune (cas général)" },
                                { v: cliEstMme ? "conjoint" : "client", l: "Propre Monsieur (exclu de la communauté)" },
                                { v: cliEstMme ? "client" : "conjoint", l: "Propre Madame (exclu de la communauté)" },
                              ]} val={a.titulaire || ""} on={v => setList("avoirs", a.id, "titulaire", v)} /></div>
                            </SousSection>
                          ) : (
                          <SousSection t="À qui appartient cet avoir ?" hint="détermine la succession, le partage en cas de divorce et l'IFI">
                            <div className="max-w-sm"><Select opts={[
                              { v: "client", l: d.civilite === "Mme" ? "Madame" : "Monsieur" },
                              { v: "conjoint", l: marie ? "Le conjoint" : pacse ? "Le partenaire" : unionLibre ? "Le concubin" : "Le conjoint" },
                              { v: "commun", l: "Commun / joint" },
                              { v: "indivis", l: "Indivision" },
                            ]} val={a.titulaire || ""} on={v => setList("avoirs", a.id, "titulaire", v)} /></div>
                            {/* Hors communauté d'acquêts, le titulaire fait foi : aucune question
                                d'origine des fonds (séparation, participation, PACS, union libre). */}
                          </SousSection>
                          )}

                          {/* 4 — Fiche du placement : ouverte dans une fenêtre dédiée, conviviale.
                              Masquée pour les livrets (rien de plus à savoir). */}
                          {!estLivret && (
                            <button type="button" onClick={() => setFicheAvoir(a.id)}
                              className="mt-2 inline-flex items-center gap-2 rounded-full px-4 py-2 text-[12px] font-bold transition border"
                              style={(a.etablissement || a.objectif || a.gestion || a.profil || a.contentQ || a.note)
                                ? { background: "#faf6ee", borderColor: "rgba(184,146,78,0.5)", color: "#8a6d34" }
                                : { background: "#ffffff", borderColor: "rgba(184,146,78,0.5)", color: "#8a6d34" }}>
                              ✦ {(a.etablissement || a.objectif || a.gestion || a.profil || a.contentQ || a.note) ? "Fiche du placement — complétée, modifier" : "Compléter la fiche du placement"}
                            </button>
                          )}
                        </div>
                      </div>
                      );
                    })}
                    </NcReveal>
                    <button type="button" onClick={() => addList("avoirs", { type: "livrets", valeur: "", etablissement: "", precision: "", titulaire: "", origine: "", ppQ: "", pp: "", objectif: "", contentQ: "", gestion: "", profil: "", note: "" })}
                      className="w-full border-2 border-dashed border-stone-300 hover:border-stone-900 rounded-lg px-3 py-2 text-[12px] font-bold text-stone-600 hover:text-stone-900 transition flex items-center justify-center gap-1.5"><I.plus/> Ajouter un avoir</button>
                  </Q>


                </div>
              )}

              {/* ============ ÉTAPE 6 : OBJECTIFS (questions selon la nature des réponses) ============ */}
              {niveau === "complet" && etape === 6 && (
                <div>
                  {/* — Bandeau d'accroche : on parle projet, pas formulaire — */}
                  <div className="rounded-xl border-2 p-3 mb-3" style={{ borderColor: "var(--nc-accent, #047857)", background: "color-mix(in srgb, var(--nc-accent, #047857) 5%, white)" }}>
                    <div className="text-[13.5px] font-extrabold text-stone-800">Que veut faire le client de son patrimoine ?</div>
                    <div className="text-[11px] text-stone-500 leading-relaxed mt-0.5">
                      Cliquez sur tous les objectifs évoqués en rendez-vous — chaque carte ouvre les questions qui permettent de les chiffrer.{" "}
                      {nbObj > 0
                        ? <span className="font-bold" style={{ color: "var(--nc-accent, #047857)" }}>{nbObj} objectif{nbObj > 1 ? "s" : ""} retenu{nbObj > 1 ? "s" : ""}.</span>
                        : <span className="text-stone-400">Aucun objectif sélectionné pour l'instant.</span>}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-1.5">
                    {NC_OBJECTIFS.filter(o => !o.tns || estTNS || obj(o.v)).map(o => (
                      <ObjCarte key={o.v} o={o} act={obj(o.v)} prio={d.objectifPrio === o.v} on={() => toggleObjectif(o.v)} />
                    ))}
                  </div>


                  {nbObj === 0 && (
                    <div className="rounded-xl border-2 border-dashed border-stone-200 p-6 text-center mb-3">
                      <div className="text-[12px] font-bold text-stone-400">Aucun objectif sélectionné</div>
                      <div className="text-[10.5px] text-stone-400 mt-0.5">Cliquez sur une carte ci-dessus : les questions de chiffrage s'afficheront ici.</div>
                    </div>
                  )}

                  {/* — Hiérarchisation : le CGP doit savoir par quoi commencer — */}
                  {nbObj >= 2 && (
                    <div className="rounded-xl border border-stone-200 bg-stone-50 p-2.5 mb-3">
                      <div className="text-[9px] uppercase tracking-[0.12em] font-extrabold text-stone-400 mb-1.5">

                                // Chapitres : un titre ne reste jamais orphelin en bas de page —
                                // s'il ne tient pas avec son contenu, il descend en début de page suivante.
                                const TITRES = ["Les chiffres du dossier", "Problématiques à traiter", "Situation fiscale du foyer"];

                                // Largeur écran conservée puis mise à l'échelle A4 (210 mm ≈ 794 px) :
                                // le PDF reproduit EXACTEMENT la présentation à l'écran.
                                const wEcran = Math.max(720, zone.offsetWidth || 960);
                                const PAD = 28;
                                holder.style.width = wEcran + "px";

                                holder.style.position = "absolute"; holder.style.left = "-99999px"; holder.style.top = "0"; holder.style.display = "block";

                      const ageEmp = ncAgeDate(d.dateNaissance);

                      const tauxEmp = duree >= 25 ? 0.04 : 0.039;
                      const pvL = (mens, mois, ta) => { const t = ta / 12; return mens > 0 ? mens * (1 - Math.pow(1 + t, -mois)) / t : 0; };

                      return (

                              </div>
                              <div className="rounded-xl px-3 py-2.5 border border-stone-200 bg-white">

            {/* — Garde-fou : capacité d'épargne non renseignée au passage vers la synthèse — */}

            {/* — Hypothèses de la capacité d'emprunt : fenêtre dédiée — */}
            {hypoOpen && (() => {
              const ageEmp = ncAgeDate(d.dateNaissance);
              const duree = ageEmp == null ? 25 : (ageEmp + 25 <= 75 ? 25 : ageEmp + 20 <= 75 ? 20 : Math.max(5, 75 - ageEmp));
              const tauxEmp = duree >= 25 ? 0.04 : 0.039;
              const pvL = (mens, mois, ta) => { const t = ta / 12; return mens > 0 ? mens * (1 - Math.pow(1 + t, -mois)) / t : 0; };
              const F = pvL(1, duree * 12, tauxEmp);
              const capRetenu = Math.round(synth.dispo35 * F);
              // Capacité en investissement locatif — méthode cabinet : 80 % des loyers du
              // bien financé (rendement 3,90 %) s'ajoutent aux REVENUS du foyer, et
              // l'endettement doit rester ≤ 35 % de ces revenus augmentés.
              // m ≤ 0,35·(revenus + 0,8·loyer) − charges ; loyer = 3,90 %·M/12 ; M = m·F
              // ⇒ M = dispo·F / (1 − 0,35 · 0,8 · (3,90 %/12) · F)
              const RLOC = 0.039, RETENUE = 0.8, PLAF35 = 0.35;
              const capLocatif = Math.round((synth.dispo35 * F) / Math.max(0.2, 1 - PLAF35 * RETENUE * (RLOC / 12) * F));
              const apportLoc = ncInt((d.objectifsDetail.locatif || {}).apport);
              const fmt = (n) => new Intl.NumberFormat('fr-FR').format(Math.round(n || 0));

                      <div className="text-[15px] font-extrabold" style={{ color: "#8a6d34", fontFamily: "'Fraunces', 'Playfair Display', serif" }}>Capacité d'emprunt — hypothèses retenues</div>
                      <button onClick={() => setHypoOpen(false)} className="ml-auto p-1.5 text-stone-400 hover:text-stone-900 transition"><I.x/></button>
                    </div>
                    <div className="px-5 py-3">
                      <Ligne l="Mensualité disponible (plafond 35 %)" v={`${fmt(synth.dispo35)} €/mois`} />
                      <Ligne l="Durée retenue" v={`${duree} ans${ageEmp != null ? ` — terme à ${ageEmp + duree} ans (≤ 75 ans)` : ""}`} />
                      <Ligne l="Taux d'emprunt (hors assurance)" v={duree >= 25 ? "4,00 % / 25 ans" : "3,90 %"} />
                      <Ligne l="Capacité d'emprunt classique" v={`${fmt(capRetenu)} €`} />
                      <Ligne l="Rendement locatif simulé" v="3,90 %" />
                      <Ligne l="Loyers retenus pour l'endettement" v="80 %" />
                      <Ligne l="Capacité en investissement locatif" v={`${fmt(capLocatif)} €`} />
                      <Ligne l="Apport renseigné (objectif locatif)" v={apportLoc > 0 ? `${fmt(apportLoc)} €` : "—"} />
                      <div className="mt-2.5 text-[10px] text-stone-400 leading-relaxed">La capacité « investissement locatif » intègre les loyers du bien financé (rendement 3,90 %, retenus à 80 % par la banque) qui viennent augmenter la mensualité finançable. Chiffres indicatifs, hors assurance emprunteur et frais.</div>
                    </div>
                    <div className="px-5 py-3 border-t border-stone-100 flex justify-end">
                      <button onClick={() => setHypoOpen(false)} className="px-5 py-2 rounded-lg text-[13px] font-bold text-white transition hover:brightness-110" style={{ background: "#b8924e" }}>Fermer</button>
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* Pied — navigation claire : Suivant avance, l'enregistrement ne sort qu'à la fin */}
            <div className={`py-4 border-t border-stone-100 flex items-center justify-between gap-3 flex-shrink-0 bg-stone-50/60 ${grand ? "px-8" : "px-6"}`}>
              <div className="flex items-center gap-2">

                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Exporter le dossier

                {niveau === "complet" && etape > 1 && (

                    <button onClick={valider} className="text-[12px] font-semibold text-stone-400 hover:text-stone-700 underline underline-offset-2 transition" title="Vos réponses sont conservées — vous pourrez reprendre l'audit plus tard.">Enregistrer et fermer</button>
                    <button onClick={() => goEtape(etape + 1)} style={{ background: accent }}
                      className="px-6 py-2.5 rounded-xl text-[13px] font-bold text-white shadow-sm hover:brightness-110 transition">Suivant →</button>

                {niveau === "complet" && etape === NC_ETAPES.length && (

            </div>
          </div>
        </div>

      return ReactDOM.createPortal(content, document.body);
    }

                )}
                <label className="px-4 py-2 text-[12px] font-semibold text-stone-600 border border-stone-300 rounded-lg hover:border-red-400 hover:text-red-600 transition cursor-pointer">
                  {inputs.cabinetLogo ? "Changer le logo" : "Charger un logo"}
                  <input type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" className="hidden"
                    onChange={e => {
                      const file = e.target.files && e.target.files[0];
                      if (!file) return;
                      if (file.size > 2 * 1024 * 1024) { alert("Le logo doit faire moins de 2 Mo."); return; }
                      const reader = new FileReader();
                      reader.onload = () => upd("cabinetLogo", reader.result);
                      reader.readAsDataURL(file);
                      e.target.value = "";
                    }} />
                </label>
              </div>
              <p className="mt-1.5 text-[11px] text-stone-400">PNG, JPG, SVG ou WebP — utilisé dans la présentation et le PDF client.</p>
            </div>

            <label className="mt-4 flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" checked={inputs.afficherFigara !== false} onChange={e=>upd("afficherFigara", e.target.checked)} className="w-4 h-4 accent-red-600" />
              <span className="text-[12px] text-stone-600">Afficher le logo Figara sur les simulations</span>
            </label>
          </div>

          {ETUDE_PATRIMONIALE_ACTIVE && newClientOpen && <NouveauClientModal inputs={inputs} upd={upd} niveauInitial={modalNiveau} onClose={() => setNewClientOpen(false)} />}
        </div>
      );
    }

    // ============================================================
    // ============================================================
    // MODE REVERSE — calcul inverse de l'effort d'épargne
    //   Objectif : un revenu complémentaire à vie (capital préservé) à la retraite.
    //   Capital cible = revenu mensuel × 12 / rendement.
    //   On résout la prime périodique (PP) nécessaire à partir de la prime unique (PU),
    //   ou l'inverse. Reversements ponctuels possibles à l'année Y.
    // ============================================================
    function ReverseCalculator({ onClose, ageDefault }) {
      // States en chaîne de caractères pour une saisie fluide (pas de « 0 » forcé quand on efface)
      const [ageActuel, setAgeActuel] = useState(String(ageDefault && ageDefault < 65 ? ageDefault : 40));
      const [ageRetraite, setAgeRetraite] = useState('65');
      const [revenuCible, setRevenuCible] = useState('2500');
      const [rdtPct, setRdtPct] = useState('5');           // rendement par défaut = 5 %
      const [fraisPct, setFraisPct] = useState('4.75');   // frais sur versement (entrée) — 4,75 % par défaut
      const [pu, setPu] = useState(15000);
      const [pp, setPp] = useState(300);
      const [solve, setSolve] = useState('pp');            // 'pp' = fixe la PU, calcule la PP ; 'pu' = l'inverse
      const [revMode, setRevMode] = useState('vie');       // 'vie' = rente à vie capital préservé ; 'duree' = revenu sur X ans (capital consommé)
      const [dureeRetraite, setDureeRetraite] = useState('25'); // années de perception du revenu (mode 'duree')
      const [revs, setRevs] = useState([]);                // apports VALIDÉS (comptés dans le calcul) : {id, annee, montant}
      const [draftMontant, setDraftMontant] = useState('10000');
      const [draftAnnee, setDraftAnnee] = useState('5');
      const nextId = useRef(1);

      const nAge = Number(ageActuel) || 0, nRet = Number(ageRetraite) || 0;
      const rdt = (Number(rdtPct) || 0) / 100;
      const rev = Number(revenuCible) || 0;
      const N = Math.max(1, nRet - nAge);
      const i = Math.pow(1 + rdt, 1/12) - 1;
      const nMonths = N * 12;
      const annuityF = i > 0 ? (Math.pow(1 + i, nMonths) - 1) / i : nMonths;
      // Capital nécessaire à la retraite :
      //   - 'vie'   → rente perpétuelle, capital préservé : R×12 / rendement
      //   - 'duree' → revenu sur D années, capital consommé : valeur actuelle d'une annuité mensuelle
      const Dr = Math.max(1, Number(dureeRetraite) || 0);
      const Dm = Dr * 12;
      // 'vie' : capital dont les SEULS intérêts mensuels servent le revenu → cap = R / i,
      // avec i = taux mensuel équivalent. (rev × 12 / rdt sous-estimait le capital requis.)
      const capitalCible = revMode === 'vie'
        ? (i > 0 ? rev / i : rev * 12 * N)
        : (i > 0 ? rev * (1 - Math.pow(1 + i, -Dm)) / i : rev * Dm);
      // Frais sur versement : seule la part NETTE de frais est réellement investie.
      const frais = Math.min(0.5, Math.max(0, (Number(fraisPct) || 0) / 100));
      const net = 1 - frais;
      const fvRev = revs.reduce((s, r) => s + (Number(r.montant) || 0) * net * Math.pow(1 + rdt, Math.max(0, N - (Number(r.annee) || 0))), 0);

      let ppReq = pp, puReq = pu, suffit = false;
      if (solve === 'pp') {
        const fvPU = pu * net * Math.pow(1 + rdt, N);
        const reste = capitalCible - fvPU - fvRev;
        ppReq = reste > 0 && net > 0 ? reste / (net * annuityF) : 0;
        suffit = reste <= 0;
      } else {
        const fvPP = pp * net * annuityF;
        const reste = capitalCible - fvPP - fvRev;
        puReq = reste > 0 && net > 0 ? reste / (net * Math.pow(1 + rdt, N)) : 0;
        suffit = reste <= 0;
      }
      const usePP = solve === 'pp' ? ppReq : pp;
      const usePU = solve === 'pp' ? pu : puReq;
      const capitalProjete = usePU * net * Math.pow(1 + rdt, N) + usePP * net * annuityF + fvRev;
      const totalVerse = usePU + usePP * nMonths + revs.reduce((s, r) => s + (Number(r.montant) || 0), 0);
      // Revenu que le capital atteint peut réellement servir (selon le mode)
      const revGen = revMode === 'vie'
        ? capitalProjete * i
        : (i > 0 ? capitalProjete * i / (1 - Math.pow(1 + i, -Dm)) : capitalProjete / Dm);

      const validerApport = () => {
        const m = Number(draftMontant) || 0;
        if (m <= 0) return;
        setRevs(r => [...r, { id: nextId.current++, annee: draftAnnee, montant: draftMontant }]);
        setDraftMontant('10000'); setDraftAnnee(String(Math.min(5, N)));
      };
      const delRev = (id) => setRevs(r => r.filter(x => x.id !== id));

      const T = "#0f766e", GOLD = "#b8924e", INK = "#1d2735", SUB = "#6b7280";
      const inCls = "w-full num text-right text-[15px] font-bold px-3 py-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:border-teal-600 focus:bg-white transition";
      const lblCls = "text-[10.5px] uppercase tracking-widest font-bold mb-1.5";

      const content = (
        <div className="fixed inset-0 z-[2147483600] overflow-auto" style={{ background: "radial-gradient(1100px 700px at 78% -10%, #fdfbf6 0%, #f5efe3 55%, #ece3d3 100%)", color: INK }}>
          {/* Header */}
          <div className="sticky top-0 z-10 flex items-center justify-between px-6 py-3 border-b" style={{ borderColor: "rgba(29,39,53,0.08)", background: "rgba(253,251,246,0.92)", backdropFilter: "blur(8px)" }}>
            <div className="flex items-center gap-3">
              <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl text-white" style={{ background: `linear-gradient(135deg,#0b3b37,${T})` }}>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              </span>
              <div>
                <div className="text-[14px] font-extrabold tracking-tight" style={{ color: INK }}>REVERSE</div>
                <div className="text-[11px]" style={{ color: SUB }}>Quel effort d'épargne pour votre revenu de retraite ?</div>
              </div>
            </div>
            <button onClick={onClose} className="inline-flex items-center justify-center w-9 h-9 rounded-lg hover:bg-black/[0.05] transition" style={{ color: SUB }}><I.close/></button>
          </div>

          <div className="max-w-3xl mx-auto px-6 py-8">
            {/* 1 — L'objectif du client */}
            <div className="flex items-center gap-2 mb-3">
              <span className="inline-flex items-center justify-center w-6 h-6 rounded-full text-white text-[12px] font-bold" style={{ background: GOLD }}>1</span>
              <span className="text-[13px] uppercase tracking-widest font-extrabold" style={{ color: INK }}>L'objectif du client</span>
            </div>
            <div className="rounded-2xl bg-white border border-stone-200 p-5 mb-8 shadow-sm">
              <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                <div><div className={lblCls} style={{ color: SUB }}>Âge actuel</div><input type="number" inputMode="numeric" value={ageActuel} onChange={e => setAgeActuel(e.target.value)} className={inCls} /></div>
                <div><div className={lblCls} style={{ color: SUB }}>Départ retraite</div><input type="number" inputMode="numeric" value={ageRetraite} onChange={e => setAgeRetraite(e.target.value)} className={inCls} /></div>
                <div className="text-center"><div className={lblCls} style={{ color: SUB }}>Durée</div><div className="num text-[24px] font-extrabold tracking-tightest leading-none pt-1.5" style={{ color: T }}>{N}<span className="text-[13px] font-medium ml-1" style={{ color: SUB }}>ans</span></div></div>
                <div><div className={lblCls} style={{ color: SUB }}>Rendement</div><div className="flex items-center bg-stone-50 border border-stone-200 rounded-xl focus-within:border-teal-600"><input type="number" inputMode="decimal" value={rdtPct} onChange={e => setRdtPct(e.target.value)} className="num flex-1 w-full text-right text-[15px] font-bold px-3 py-2.5 bg-transparent focus:outline-none" /><span className="px-2.5 text-stone-400 text-[13px]">%</span></div></div>
                <div><div className={lblCls} style={{ color: SUB }}>Frais versement</div><div className="flex items-center bg-stone-50 border border-stone-200 rounded-xl focus-within:border-teal-600"><input type="number" inputMode="decimal" step="0.25" value={fraisPct} onChange={e => setFraisPct(e.target.value)} className="num flex-1 w-full text-right text-[15px] font-bold px-3 py-2.5 bg-transparent focus:outline-none" /><span className="px-2.5 text-stone-400 text-[13px]">%</span></div></div>
              </div>
              <div className="mt-5 rounded-2xl px-5 py-4" style={{ background: "linear-gradient(135deg, rgba(184,146,78,0.12), rgba(184,146,78,0.04))", border: "1px solid rgba(184,146,78,0.35)" }}>
                <div className="flex items-center justify-between flex-wrap gap-3">
                  <div className="flex items-center gap-3">
                    <div className={lblCls + " mb-0"} style={{ color: GOLD }}>Revenu visé à la retraite</div>
                    <div className="flex items-center bg-white border border-stone-200 rounded-xl focus-within:border-amber-500"><input type="number" inputMode="numeric" value={revenuCible} onChange={e => setRevenuCible(e.target.value)} className="num w-28 text-right text-[20px] font-extrabold px-3 py-2 bg-transparent focus:outline-none" style={{ color: INK }} /><span className="px-2.5 text-stone-400 text-[12px]">€/mois</span></div>
                  </div>
                  <div className="text-right">
                    <div className="text-[10px] uppercase tracking-widest font-bold" style={{ color: GOLD }}>Capital nécessaire</div>
                    <div className="num text-[26px] font-extrabold tracking-tightest" style={{ color: GOLD }}>{fmtEUR(capitalCible)}</div>
                    <div className="text-[10px]" style={{ color: SUB }}>{revMode === 'vie' ? 'rente à vie · capital préservé' : `sur ${Dr} ans · capital consommé`}</div>
                  </div>
                </div>
                {/* Mode de perception : à vie ou sur une durée */}
                <div className="mt-3 pt-3 flex items-center gap-3 flex-wrap" style={{ borderTop: "1px solid rgba(184,146,78,0.25)" }}>
                  <span className="text-[11px] font-bold" style={{ color: "#8a6d3a" }}>Perçu :</span>
                  <div className="inline-flex bg-white/70 rounded-lg p-1 border border-amber-200">
                    <button onClick={() => setRevMode('vie')} className={`px-3 py-1 rounded-md text-[11px] font-bold transition ${revMode === 'vie' ? 'bg-white shadow-sm' : ''}`} style={{ color: revMode === 'vie' ? GOLD : SUB }}>À vie (capital préservé)</button>
                    <button onClick={() => setRevMode('duree')} className={`px-3 py-1 rounded-md text-[11px] font-bold transition ${revMode === 'duree' ? 'bg-white shadow-sm' : ''}`} style={{ color: revMode === 'duree' ? GOLD : SUB }}>Pendant X années</button>
                  </div>
                  {revMode === 'duree' && (
                    <div className="flex items-center gap-1.5">
                      <span className="text-[11px] font-bold" style={{ color: "#8a6d3a" }}>pendant</span>
                      <div className="flex items-center bg-white border border-stone-200 rounded-lg"><input type="number" inputMode="numeric" value={dureeRetraite} onChange={e => setDureeRetraite(e.target.value)} className="num w-14 px-2 py-1.5 text-right font-bold bg-transparent focus:outline-none" /><span className="px-2 text-[11px] text-stone-400">ans</span></div>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* 2 — L'effort à fournir (le HERO) */}
            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
              <div className="flex items-center gap-2">
                <span className="inline-flex items-center justify-center w-6 h-6 rounded-full text-white text-[12px] font-bold" style={{ background: GOLD }}>2</span>
                <span className="text-[13px] uppercase tracking-widest font-extrabold" style={{ color: INK }}>L'effort à fournir</span>
              </div>
              <div className="inline-flex bg-stone-100 rounded-lg p-1">
                <button onClick={() => setSolve('pp')} className={`px-3 py-1 rounded-md text-[11px] font-bold transition ${solve === 'pp' ? 'bg-white shadow-sm text-stone-900' : 'text-stone-500'}`}>Je fixe le capital de départ</button>
                <button onClick={() => setSolve('pu')} className={`px-3 py-1 rounded-md text-[11px] font-bold transition ${solve === 'pu' ? 'bg-white shadow-sm text-stone-900' : 'text-stone-500'}`}>Je fixe l'effort mensuel</button>
              </div>
            </div>

            {/* Curseur du levier choisi — EN PREMIER (capital de départ) */}
            <div className="rounded-2xl bg-white border border-stone-200 p-5 mb-4 shadow-sm">
              {solve === 'pp' ? (
                <>
                  <div className="flex items-baseline justify-between mb-2">
                    <span className="text-[13px] font-bold" style={{ color: INK }}>Capital de départ (prime unique)</span>
                    <span className="num text-[22px] font-extrabold" style={{ color: T }}>{fmtEUR(pu)}</span>
                  </div>
                  <input type="range" min={0} max={200000} step={1000} value={pu} onChange={e => setPu(parseInt(e.target.value))} className="slider w-full" style={{ background: `linear-gradient(to right, ${T} 0%, #34d399 ${(pu/200000)*100}%, #e7e5e4 ${(pu/200000)*100}%, #e7e5e4 100%)` }} />
                  <div className="flex justify-between text-[10px] mt-1.5" style={{ color: SUB }}><span>0 €</span><span>200 000 €</span></div>
                </>
              ) : (
                <>
                  <div className="flex items-baseline justify-between mb-2">
                    <span className="text-[13px] font-bold" style={{ color: INK }}>Effort mensuel (prime périodique)</span>
                    <span className="num text-[22px] font-extrabold" style={{ color: T }}>{fmtEUR(pp)}<span className="text-[13px] font-medium" style={{ color: SUB }}>/mois</span></span>
                  </div>
                  <input type="range" min={0} max={3000} step={25} value={pp} onChange={e => setPp(parseInt(e.target.value))} className="slider w-full" style={{ background: `linear-gradient(to right, ${T} 0%, #34d399 ${(pp/3000)*100}%, #e7e5e4 ${(pp/3000)*100}%, #e7e5e4 100%)` }} />
                  <div className="flex justify-between text-[10px] mt-1.5" style={{ color: SUB }}><span>0 €</span><span>3 000 €/mois</span></div>
                </>
              )}
            </div>

            {/* HERO résultat — SOUS le curseur, compact */}
            <div className="rounded-3xl px-8 py-6 mb-4 text-center relative overflow-hidden" style={{ background: "linear-gradient(150deg,#0b3b37 0%,#0f766e 55%,#12897f 100%)", boxShadow: "0 24px 60px -30px rgba(15,118,110,0.6)" }}>
              <div className="absolute inset-0 pointer-events-none" style={{ background: "radial-gradient(420px 220px at 88% 0%, rgba(184,146,78,0.35), transparent)" }}></div>
              <div className="relative">
                {suffit ? (
                  <>
                    <div className="text-[11px] uppercase tracking-[0.2em] font-extrabold" style={{ color: "rgba(255,255,255,0.82)" }}>Objectif déjà atteint</div>
                    <div className="num serif font-extrabold tracking-tightest leading-none my-1.5 text-white" style={{ fontSize: 50 }}>{fmtEUR(usePU)}</div>
                    <div className="text-[14px]" style={{ color: "rgba(255,255,255,0.9)" }}>de prime unique suffisent — aucune épargne mensuelle nécessaire.</div>
                  </>
                ) : solve === 'pp' ? (
                  <>
                    <div className="text-[11px] uppercase tracking-[0.2em] font-extrabold" style={{ color: "rgba(255,255,255,0.82)" }}>Épargne mensuelle à prévoir</div>
                    <div className="num serif font-extrabold tracking-tightest leading-none my-1.5 text-white" style={{ fontSize: 62 }}>{fmtEUR(ppReq)}<span className="text-[22px] font-bold opacity-70"> /mois</span></div>
                    <div className="text-[14px]" style={{ color: "rgba(255,255,255,0.9)" }}>pendant <b className="text-white">{N} ans</b>, avec <b className="text-white">{fmtEUR(pu)}</b> de départ — pour toucher <b className="text-white">{fmtEUR(rev)}/mois</b> {revMode === 'vie' ? 'à vie' : `pendant ${Dr} ans`}.</div>
                  </>
                ) : (
                  <>
                    <div className="text-[11px] uppercase tracking-[0.2em] font-extrabold" style={{ color: "rgba(255,255,255,0.82)" }}>Prime unique à prévoir</div>
                    <div className="num serif font-extrabold tracking-tightest leading-none my-1.5 text-white" style={{ fontSize: 62 }}>{fmtEUR(puReq)}</div>
                    <div className="text-[14px]" style={{ color: "rgba(255,255,255,0.9)" }}>au départ, avec <b className="text-white">{fmtEUR(pp)}/mois</b> pendant <b className="text-white">{N} ans</b> — pour toucher <b className="text-white">{fmtEUR(rev)}/mois</b> {revMode === 'vie' ? 'à vie' : `pendant ${Dr} ans`}.</div>
                  </>
                )}
              </div>
            </div>

            {/* Synthèse chiffrée — remontée ici pour être visible sans scroller */}
            <div className="grid grid-cols-3 gap-3 mb-8">
              <div className="rounded-2xl px-3 py-3 text-center bg-white border border-stone-200 shadow-sm"><div className="text-[9.5px] uppercase tracking-widest font-bold" style={{ color: SUB }}>Total investi</div><div className="num text-[20px] font-extrabold tracking-tightest mt-0.5" style={{ color: INK }}>{fmtEUR(totalVerse)}</div><div className="text-[9.5px] mt-0.5" style={{ color: SUB }}>sur {N} ans</div></div>
              <div className="rounded-2xl px-3 py-3 text-center bg-white border-2 shadow-sm" style={{ borderColor: "rgba(15,118,110,0.4)" }}><div className="text-[9.5px] uppercase tracking-widest font-bold" style={{ color: T }}>Capital atteint</div><div className="num text-[20px] font-extrabold tracking-tightest mt-0.5" style={{ color: T }}>{fmtEUR(capitalProjete)}</div><div className="text-[9.5px] mt-0.5" style={{ color: SUB }}>à la retraite</div></div>
              <div className="rounded-2xl px-3 py-3 text-center bg-white border border-stone-200 shadow-sm"><div className="text-[9.5px] uppercase tracking-widest font-bold" style={{ color: GOLD }}>{revMode === 'vie' ? 'Revenu à vie' : `Revenu / ${Dr} ans`}</div><div className="num text-[20px] font-extrabold tracking-tightest mt-0.5" style={{ color: GOLD }}>{fmtEUR(revGen)}<span className="text-[11px] font-medium" style={{ color: SUB }}>/mois</span></div><div className="text-[9.5px] mt-0.5" style={{ color: SUB }}>{revMode === 'vie' ? 'capital préservé' : 'capital consommé'}</div></div>
            </div>

            {/* 3 — Apports ponctuels (saisie + Valider) */}
            <div className="flex items-center gap-2 mb-3">
              <span className="inline-flex items-center justify-center w-6 h-6 rounded-full text-white text-[12px] font-bold" style={{ background: GOLD }}>3</span>
              <span className="text-[13px] uppercase tracking-widest font-extrabold" style={{ color: INK }}>Apports ponctuels <span className="font-medium normal-case tracking-normal text-stone-400">(optionnel)</span></span>
            </div>
            <div className="rounded-2xl bg-white border border-stone-200 p-4 mb-8 shadow-sm">
              {/* Apports déjà validés */}
              {revs.length > 0 && (
                <div className="space-y-2 mb-3">
                  {revs.map(r => (
                    <div key={r.id} className="flex items-center gap-2 flex-wrap rounded-xl px-3 py-2" style={{ background: "rgba(184,146,78,0.09)", border: "1px solid rgba(184,146,78,0.3)" }}>
                      <span className="text-[12.5px] font-bold" style={{ color: "#8a6d3a" }}>Apport de <span className="num">{fmtEUR(Number(r.montant) || 0)}</span> à l'année {r.annee}</span>
                      <span className="text-[11px] px-2 py-0.5 rounded-full font-bold" style={{ background: "rgba(15,118,110,0.12)", color: T }}>pris en compte</span>
                      <button onClick={() => delRev(r.id)} className="text-[11px] font-bold text-stone-400 hover:text-red-600 transition ml-auto">Retirer</button>
                    </div>
                  ))}
                </div>
              )}
              {/* Saisie d'un nouvel apport → Valider */}
              <div className="flex items-center gap-2 flex-wrap rounded-xl px-3 py-2.5 bg-stone-50 border border-dashed border-stone-300">
                <span className="text-[12px] font-bold" style={{ color: SUB }}>Apport de</span>
                <div className="flex items-center bg-white border border-stone-200 rounded-lg"><input type="number" inputMode="numeric" value={draftMontant} onChange={e => setDraftMontant(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') validerApport(); }} className="num w-24 px-2.5 py-1.5 text-right font-bold bg-transparent focus:outline-none" /><span className="px-2 text-[11px] text-stone-400">€</span></div>
                <span className="text-[12px] font-bold" style={{ color: SUB }}>à l'année</span>
                <div className="flex items-center bg-white border border-stone-200 rounded-lg"><input type="number" inputMode="numeric" value={draftAnnee} onChange={e => setDraftAnnee(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') validerApport(); }} className="num w-14 px-2.5 py-1.5 text-right font-bold bg-transparent focus:outline-none" /></div>
                <button onClick={validerApport} className="inline-flex items-center gap-1.5 text-[12px] font-bold px-4 py-2 rounded-lg text-white hover:brightness-110 transition ml-auto" style={{ background: T }}>Valider l'apport</button>
              </div>
              {revs.length === 0 && (
                <div className="text-[11.5px] mt-2.5 text-center" style={{ color: SUB }}>Un héritage, une prime, une vente… saisissez le montant et l'année, puis <b>Valider</b> pour voir l'effort mensuel se réduire.</div>
              )}
            </div>
          </div>
        </div>
      );
      return ReactDOM.createPortal(content, document.body);
    }

    // ============================================================
    // Composant : champ de saisie rendement (% / an)
    // Utilise un état local pour permettre la saisie libre (« 5.07 », « 7.5 », etc.)
    // sans que le toFixed du parent ne ré-écrive l'input pendant la frappe.
    // Valide et propage la valeur uniquement au blur ou à Entrée.
    // ============================================================
    function RendementInput({ value, onChange }) {
      // value = rendement décimal (0.05 = 5 %). On affiche en pourcentage.
      const toDisplay = (v) => {
        if (v == null || isNaN(v)) return "";
        const pct = v * 100;
        // Affiche jusqu'à 2 décimales, sans virgule traînante (5.5 plutôt que 5.50)
        return Number.isInteger(pct) ? String(pct) : pct.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
      };
      const [text, setText] = useState(toDisplay(value));
      const [focused, setFocused] = useState(false);
      // Si le rendement change côté parent et qu'on n'est PAS en train d'éditer, on resynchronise
      useEffect(() => {
        if (!focused) setText(toDisplay(value));
      }, [value, focused]);

      const commit = () => {
        // Tolère « 5,07 » (virgule française) → « 5.07 »
        const cleaned = text.replace(",", ".").trim();
        if (cleaned === "" || cleaned === "-") {
          setText(toDisplay(value));    // restaure
          return;
        }
        const num = parseFloat(cleaned);
        if (isFinite(num)) {
          const decimal = Math.max(0, Math.min(0.50, num / 100));  // borne 0–50 %
          onChange(decimal);
          setText(toDisplay(decimal));
        } else {
          setText(toDisplay(value));
        }
      };

      return (
        <input
          type="text"
          inputMode="decimal"
          value={text}
          onChange={(e) => setText(e.target.value)}
          onFocus={(e) => { setFocused(true); e.target.select(); }}
          onBlur={() => { setFocused(false); commit(); }}
          onKeyDown={(e) => {
            if (e.key === "Enter") { e.target.blur(); }
            else if (e.key === "ArrowUp") {
              e.preventDefault();
              const step = e.shiftKey ? 0.5 : 0.1;
              const cur = parseFloat(text.replace(",", ".")) || 0;
              const next = Math.min(50, cur + step);
              setText(next.toFixed(2).replace(/0+$/, "").replace(/\.$/, ""));
              onChange(Math.max(0, Math.min(0.50, next / 100)));
            } else if (e.key === "ArrowDown") {
              e.preventDefault();
              const step = e.shiftKey ? 0.5 : 0.1;
              const cur = parseFloat(text.replace(",", ".")) || 0;
              const next = Math.max(0, cur - step);
              setText(next.toFixed(2).replace(/0+$/, "").replace(/\.$/, ""));
              onChange(Math.max(0, Math.min(0.50, next / 100)));
            }
          }}
          placeholder="0"
          className="num flex-1 min-w-0 px-3 py-2.5 text-right text-[16px] font-bold text-stone-900 bg-transparent focus:outline-none"
        />
      );
    }

    // Saisie libre d'un taux en % (draft local, commit sur blur/Entrée) — accepte « 3,25 » ou « 3.25 »
    function PctDraftInput({ value, onChange, disabled, autoFocus, maxPct = 50, className }) {
      // value = taux décimal (0.0325 = 3,25 %)
      const toDisplay = (v) => {
        if (v == null || isNaN(v)) return "";
        const pct = v * 100;
        return Number.isInteger(pct) ? String(pct) : pct.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
      };
      const [text, setText] = useState(toDisplay(value));
      const [focused, setFocused] = useState(false);
      // Resynchronise si le taux change côté parent (ex : choix d'un livret dans le select) hors édition
      useEffect(() => { if (!focused) setText(toDisplay(value)); }, [value, focused]);
      const commit = () => {
        const cleaned = text.replace(",", ".").trim();
        if (cleaned === "" || cleaned === "-") { setText(toDisplay(value)); return; }
        const num = parseFloat(cleaned);
        if (isFinite(num)) {
          const decimal = Math.max(0, Math.min(maxPct / 100, num / 100));
          onChange(decimal);
          setText(toDisplay(decimal));
        } else {
          setText(toDisplay(value));
        }
      };
      return (
        <input
          type="text"
          inputMode="decimal"
          value={text}
          disabled={disabled}
          autoFocus={autoFocus}
          onChange={(e) => setText(e.target.value)}
          onFocus={(e) => { setFocused(true); e.target.select(); }}
          onBlur={() => { setFocused(false); commit(); }}
          onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
          placeholder="0"
          className={className}
        />
      );
    }
