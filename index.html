        per: { versementInitial: 50000, versementMensuel: 300 },
        av:  { versementInitial: 50000, versementMensuel: 200 },
      },
    };

    // ============================================================
    // MOTEUR
    // ============================================================
    function rdtPondere(a) { return a.reduce((r, s) => r + s.poids * s.rendement, 0); }
    function sriPondere(a) {
      const t = a.reduce((s, x) => s + x.poids, 0);
      const w = a.reduce((s, x) => s + x.poids * x.sri, 0);
      return t > 0 ? w / t : 0;
    }
    // Somme brute des versements complémentaires programmés
    function totalComplementaires(inp) {
      return (inp.versementsComplementaires || []).reduce((s, v) => s + (v.montant || 0), 0);
    }
    // Versements consolidés d'un multi-projet (PER + AV)
    function versementsMulti(inp) {
      const per = (inp.multi && inp.multi.per) || {}, av = (inp.multi && inp.multi.av) || {};
      return {
        vi: (per.versementInitial || 0) + (av.versementInitial || 0),
        vm: (per.versementMensuel || 0) + (av.versementMensuel || 0),
      };
    }
    // Total versé brut, multi-conscient
    function totalVerseBrutOf(inp) {
      if (inp.produit === "multi") {
        const m = versementsMulti(inp);
        return m.vi + m.vm * 12 * (inp.dureeAnnees || 0);
      }
      return inp.versementInitial + inp.versementMensuel * 12 * inp.dureeAnnees + totalComplementaires(inp);
    }
    // Regroupe les versements complémentaires par mois (m = annee*12), nets de frais d'entrée,
    // pour injection dans les boucles de capitalisation mensuelles.
    function complementairesParMois(inp, fraisEntree, Nmois) {
      const map = {};
      (inp.versementsComplementaires || []).forEach(v => {
        const m = Math.round((v.annee || 0) * 12);
        if (m >= 1 && m <= Nmois) {
          map[m] = (map[m] || 0) + (v.montant || 0) * (1 - fraisEntree);
        }
      });
      return map;
    }

    // Multi-projet : construit l'inp d'un sous-produit (per|av) en héritant tout le partagé
    // (durée, âge, bénéf, allocation, frais, succession) et en n'imposant que ses versements.
    function subInp(inp, which) {
      const m = (inp.multi && inp.multi[which]) || {};
      return {
        ...inp,
        produit: which,
        versementInitial: m.versementInitial ?? 0,
        versementMensuel: m.versementMensuel ?? 0,
        // pas de versements complémentaires en multi v1 (évite le double comptage)
        versementsComplementaires: [],
      };
    }

    function projection(inp, rdtNet) {
      if (inp.produit === "multi") {
        const p = projection(subInp(inp, "per"), rdtNet);
        const a = projection(subInp(inp, "av"), rdtNet);
        return {
          capitalFin: p.capitalFin + a.capitalFin,
          totVerseBrut: p.totVerseBrut + a.totVerseBrut,
          totVerseNet: p.totVerseNet + a.totVerseNet,
          plusValue: p.plusValue + a.plusValue,
          fraisSousPay: p.fraisSousPay + a.fraisSousPay,
        };
      }
      const N = Math.round(inp.dureeAnnees * 12);
      const tm = Math.pow(1 + rdtNet, 1/12) - 1;
      const vIN = inp.versementInitial * (1 - inp.fraisSouscription);
      const vMN = inp.versementMensuel * (1 - inp.fraisSouscription);
      const compMois = complementairesParMois(inp, inp.fraisSouscription, N);
      let cap = vIN, totBrut = inp.versementInitial, totNet = vIN;
      for (let m=1; m<=N; m++) {
        cap = (cap + vMN) * (1 + tm);
        totBrut += inp.versementMensuel; totNet += vMN;
        if (compMois[m]) cap += compMois[m];
      }
      const compBrut = totalComplementaires(inp);
      totBrut += compBrut;
      totNet += compBrut * (1 - inp.fraisSouscription);
      // Plus-value affichée = capital final − versements BRUTS (ce que le client a réellement
      // sorti de sa poche, frais d'entrée inclus). Utiliser totNet surestimait la plus-value
      // du montant des frais de souscription.
      return { capitalFin: cap, totVerseBrut: totBrut, totVerseNet: totNet, plusValue: cap - totBrut, fraisSousPay: totBrut - totNet };
    }

    // fiscaliteAV — succession AV/PER en cas de décès
    // successionLine : 'directe' (taux forfaitaire barème) | 'indirecte' (60% flat)
    // txSuccDirect : taux forfaitaire ligne directe (30 % par défaut)
    function fiscaliteAV(cap, vNet, nb, age, txSuccIndirect, vBrut, successionLine, txSuccDirect) {
      const txIndirect = txSuccIndirect ?? TX_SUCC_INDIRECT;
      const txDirect = txSuccDirect ?? 0.30;
      const ligne = successionLine ?? 'directe';
      const av70 = age < 70;
      let taxe=0, partBenef=0, abattBenef=0, imposableBenef=0, taxeBenef=0, abattTotal=0, imposableTotal=0;
      if (av70) {
        // Régime art. 990 I : abattement 152 500 € par bénéficiaire, puis 20 % / 31,25 %
        partBenef = cap / nb;
        abattBenef = ABATT_AV_70;
        abattTotal = abattBenef * nb;
        imposableBenef = Math.max(0, partBenef - abattBenef);
        imposableTotal = imposableBenef * nb;
        const t1 = Math.min(imposableBenef, PLAFOND_T1);
        const t2 = Math.max(0, imposableBenef - PLAFOND_T1);
        taxeBenef = t1*TX_AV_T1 + t2*TX_AV_T2;
        taxe = taxeBenef * nb;
      } else {
        // Après 70 ans : seules les PRIMES versées après 70 ans entrent dans la succession
        // (les gains sont exonérés). Abattement global de 30 500 € sur les primes.
        // Puis droits de succession ordinaires au taux forfaitaire sélectionné.
        const primesBase = vBrut ?? vNet;   // versements bruts de préférence
        abattTotal = ABATT_AV_APRES_70;     // 30 500 € global
        const imposableGlobal = Math.max(0, primesBase - abattTotal);
        imposableTotal = imposableGlobal;
        if (ligne === 'indirecte') {
          taxe = imposableGlobal * txIndirect;
        } else {
          // Ligne directe : taux forfaitaire barème sur capital imposable (après abatt. global 30 500 € AV)
          taxe = imposableGlobal * txDirect;
          imposableTotal = imposableGlobal;
        }
      }
      const direct = cap - taxe;
      return { av70, taxe, direct, abattTotal, abattBenef, partBenef, imposableBenef, imposableTotal, taxeBenef };
    }

    // fiscaliteLivret — transmission du support de comparaison (Livret A)
    // Hypothèse retenue : on ne chiffre AUCUNE fiscalité de transmission sur le livret et on
    // n'affiche aucun abattement. Le capital est transmis tel quel, sans droits ni frais.
    // La comparaison porte donc uniquement sur l'avantage successoral propre à l'assurance vie.
    function fiscaliteLivret(cap) {
      const capital = Math.max(0, cap || 0);
      return { abatt: 0, abattTotal: 0, abattParEnfant: 0, imp: 0, imposableTotal: 0, droits: 0, net: capital };
    }

    // === Fiscalité PER — versements volontaires DÉDUITS à l'entrée ===
    //
    //  SORTIE EN CAPITAL :
    //    • Part "versements bruts" → IR au barème (TMI), SANS abattement de 10 %
    //    • Part "plus-value" (cap − versements bruts) → PFU 2026 = 12,8 % IR + 18,6 % PS = 31,4 %
    //    (option globale pour le barème possible mais généralement défavorable à 30 % de TMI)
    //
    //  SORTIE EN RENTE :
    //    • Imposée comme une pension de retraite : TMI sur rente après abattement 10 %
    //    • PS sur pensions : 0 / 4,3 / 7,4 ou 9,1 % selon le RFR du foyer
    //    → Le NET DE RENTE n'est PAS calculé par le simulateur (dépend du RFR, de la
    //      composition du foyer, du plafonnement de l'abattement 10 %, etc.).
    //      Seule la rente BRUTE estimée est restituée à titre indicatif.
    const PFU_PER_2026 = 0.314;  // 12,8 % IR + 18,6 % PS (2026)
    function fiscalitePER(cap, vNet, vBrut, tauxIR, modeSortie, ageSortie) {
      const ecoFiscEntree = vBrut * tauxIR;
      // Plus-value imposable au PFU = capital − versements bruts (la part de gains)
      const plusValue = Math.max(0, cap - vBrut);
      if (modeSortie === "rente") {
        // On ne calcule PAS la fiscalité de la rente (impossible sans RFR + plafonnement
        // de l'abattement de 10 %). Seule la rente brute annuelle indicative est restituée.
        const renteBruteAn = cap * 0.04;  // approximation tarif rente ~4 %
        return {
          modeSortie: "rente",
          ecoFiscEntree,
          plusValue,
          renteBruteAn,
          // Pas de chiffrage : fiscalité dépend du RFR et de la composition du foyer
          taxeRenteAn: null,
          renteNetteAn: null,
          netCapital: 0,
          taxe: 0, direct: cap, abattTotal: ecoFiscEntree, imposableTotal: 0,
        };
      }
      // Mode capital : IR (TMI) sur versements bruts + PFU 31,4 % sur plus-value
      const taxeCapVerse = vBrut * tauxIR;
      const taxePV = plusValue * PFU_PER_2026;
      const taxeTotale = taxeCapVerse + taxePV;
      return {
        modeSortie: "capital",
        ecoFiscEntree,
        plusValue,
        taxeCapVerse,
        taxePV,
        taxeTotale,
        netCapital: cap - taxeTotale,
        // mapping pour col schema
        taxe: taxeTotale, direct: cap - taxeTotale, abattTotal: ecoFiscEntree, imposableTotal: cap,
      };
    }

    // === Fiscalité Capi PM — IS sur la PLUS-VALUE (intérêts) au rachat ===
    // L'IS s'applique uniquement à la fraction de plus-value du contrat (cap - versements bruts),
    // pas sur le capital total. La fraction "principal" remboursée n'est pas imposable.
    function fiscaliteCapiPM(cap, vBrut, tauxIS) {
      // L'IS n'est PAS géré ici : le contrat de capitalisation est présenté en capital brut à terme
      // (la fiscalité IS est latente et dépend de la sortie effective — hors périmètre de la simulation).
      const plusValue = Math.max(0, cap - vBrut);
      return {
        plusValue,
        taxeIS: 0,
        principal: vBrut,
        netCapital: cap,       // capital brut à terme — aucun IS déduit
        taxe: 0, direct: cap, abattTotal: 0, imposableTotal: plusValue,
      };
    }

    // Rente perpétuelle « capital préservé » : chaque mois on ne prélève QUE l'intérêt
    // du mois, au taux mensuel équivalent rm = (1+rdt)^(1/12) − 1. Le capital reste
    // intact indéfiniment. On NE divise PAS le rendement annuel par 12 (cap × rdt / 12
    // sur-distribue de ~rdt/2 et éroderait lentement le capital).
    // Source unique de vérité : toutes les rentes de l'application passent par ici.
    function renteBruteAnnuelle(cap, rdt) {
      if (!(cap > 0) || !(rdt > 0)) return 0;
      return cap * (Math.pow(1 + rdt, 1/12) - 1) * 12;
    }

    // primesBrutes (optionnel) : total des primes versées, pour appliquer le seuil de
    // 150 000 € (art. 125-0 A CGI) — au-delà, la fraction correspondante est taxée à
    // 12,8 % au lieu de 7,5 %.
    function rente(cap, vNet, rdt, dur, sit, primesBrutes) {
      const brute = renteBruteAnnuelle(cap, rdt);
      const qpv = cap > 0 ? Math.max(0, cap - vNet)/cap : 0;
      const partPV = brute * qpv;
      const ab = sit === "couple" ? ABATT_RENTE_COUPLE : ABATT_RENTE_CELIB;
      // Séparation Impôt sur le revenu (impIR) / prélèvements sociaux CSG-CRDS (impPS)
      const impPS = partPV * PS;
      let impIR, regime;
      if (dur >= 8) {
        // ≥ 8 ans : IR exonéré dans la limite de l'abattement, puis PFL 7,5 % au-delà
        // (12,8 % sur la quote-part des primes excédant 150 000 €). PS toujours dus.
        const primes = primesBrutes > 0 ? primesBrutes : vNet;
        const frac128 = primes > 150000 ? (primes - 150000) / primes : 0;
        const tauxPFL = PFL_AV_8 * (1 - frac128) + 0.128 * frac128;
        impIR = Math.max(0, partPV - ab) * tauxPFL;
        regime = frac128 > 0 ? `PFL 7,5%/12,8% + PS 17,2% (≥ 8 ans)` : `PFL 7,5% + PS 17,2% (≥ 8 ans)`;
      } else {
        // < 8 ans : PFU 30 % = 12,8 % IR + 17,2 % PS
        impIR = partPV * 0.128;
        regime = `PFU 30%`;
      }
      const imp = impIR + impPS;
      return { brute, imp, impIR, impPS, nette: brute - imp, regime, qpv, ab, plus8: dur >= 8 };
    }

    // === Fiscalité du support de comparaison : LIVRET A ===
    // Hypothèse retenue pour toute l'application : le support de comparaison est un LIVRET A.
    // Ses intérêts sont TOTALEMENT exonérés d'impôt sur le revenu ET de prélèvements sociaux
    // (art. 157-7° CGI). La capitalisation se fait donc au taux BRUT = taux net, et la rente
    // servie n'est amputée d'aucun impôt.
    function livretTauxNet(inp) {
      return Math.max(0, (inp && inp.livretTaux) || 0);
    }
    // Décomposition de l'impôt sur une rente annuelle brute servie par le livret : néant.
    function livretRenteFisc(inp, brutAn) {
      return { impot: 0, ir: 0, ps: 0, regime: "Livret A — intérêts exonérés d'impôt et de prélèvements sociaux" };
    }

    function projLivret(inp) {
      const N = Math.round(inp.dureeAnnees*12); const tm = Math.pow(1+livretTauxNet(inp), 1/12)-1;
      const compMois = complementairesParMois(inp, 0, N); // livret/CAT : pas de frais d'entrée
      let cap = inp.versementInitial, tot = inp.versementInitial;
      for (let m=1; m<=N; m++) {
        cap = (cap+inp.versementMensuel)*(1+tm);
        tot += inp.versementMensuel;
        if (compMois[m]) { cap += compMois[m]; tot += compMois[m]; }
      }
      return { capitalFin: cap, totVerse: tot, plusValue: cap - tot };
    }

    // === PER + Réintégration des réductions d'impôt ===
    //
    // MÉCANIQUE CORRECTE :
    //  • Chaque année, le client verse ses contributions directes dans le PER.
    //  • La réduction d'impôt perçue l'année suivante (remboursement IR) est réinvestie
    //    dans le PER l'année d'après → elle génère elle-même une nouvelle réduction.
    //  • Cela crée un effet de levier composé année après année.
    //
    // MODÈLE :
    //  Année 1 :  versement direct V1 → réduction R1 = V1 × TMI
    //  Année 2 :  versement direct V2 + réinvesti R1 → réduction R2 = (V2+R1) × TMI
    //  Année y :  Vy + R(y-1) → Ry = (Vy + R(y-1)) × TMI
    //
    // auxCap : portion du capital PER financée par les réductions réinvesties.
    // totReduc : somme de TOUTES les réductions générées (y compris sur les réinvestissements).
    // totReinvesti : montant total effectivement réinvesti dans le PER (= totReduc - dernière année).
    function projPERReinvest(inp, rdtNet, tauxIR) {
      const Y = Math.round(inp.dureeAnnees);
      let auxCap = 0;
      let totReduc = 0;
      let totReinvesti = 0;
      let reducPrecedente = 0;  // réduction de l'année y-1, réinvestie en année y
      for (let y = 1; y <= Y; y++) {
        // Versements directs de l'investisseur cette année
        const directY = (y === 1 ? inp.versementInitial : 0) + 12 * inp.versementMensuel;
        // Réduction de l'année précédente, réinvestie dans le PER cette année
        const reinvesteY = reducPrecedente;
        totReinvesti += reinvesteY;
        // Total versé dans le PER cette année (direct + réinvesti) — les deux sont déductibles
        const totalVersY = directY + reinvesteY;
        // Réduction d'impôt générée cette année (sur le total versé)
        const reducY = totalVersY * tauxIR;
        totReduc += reducY;
        // Le capital auxiliaire (partie financée par les réinvestissements) grossit au taux net
        // et reçoit le réinvestissement de cette année
        auxCap = auxCap * (1 + rdtNet) + reinvesteY;
        // La réduction de cette année sera réinvestie l'année prochaine
        reducPrecedente = reducY;
      }
      // La dernière réduction est générée mais non réinvestie (période terminée) :
      // elle est disponible pour l'épargnant à la fin de la période.
      const derniereReduc = reducPrecedente;
      return { auxCap, totReduc, totReinvesti, derniereReduc, plusValue: Math.max(0, auxCap - totReinvesti) };
    }

    /** Year-by-year auxiliary capital series for PER reinvest (graphique) */
    function perReinvestSeries(inp, rdtNet, tauxIR) {
      const Y = Math.round(inp.dureeAnnees);
      let auxCap = 0;
      let reducPrecedente = 0;
      const series = [0];
      for (let y = 1; y <= Y; y++) {
        const directY = (y === 1 ? inp.versementInitial : 0) + 12 * inp.versementMensuel;
        const reinvesteY = reducPrecedente;
        const totalVersY = directY + reinvesteY;
        const reducY = totalVersY * tauxIR;
        auxCap = auxCap * (1 + rdtNet) + reinvesteY;
        reducPrecedente = reducY;
        series.push(auxCap);
      }
      return series;
    }

    /** Year-by-year capital series for AV projection */
    function projectionSeries(inp, rdtNet) {
      if (inp.produit === "multi") {
        const p = projectionSeries(subInp(inp, "per"), rdtNet);
        const a = projectionSeries(subInp(inp, "av"), rdtNet);
        return p.map((v, i) => v + (a[i] || 0));
      }
      const N = Math.round(inp.dureeAnnees);
      const tm = Math.pow(1 + rdtNet, 1/12) - 1;
      const vIN = inp.versementInitial * (1 - inp.fraisSouscription);
      const vMN = inp.versementMensuel * (1 - inp.fraisSouscription);
      const compMois = complementairesParMois(inp, inp.fraisSouscription, N*12);
      let cap = vIN;
      // Point de départ = versement initial NET des frais d'entrée (ex. 100 000 € − 3 % = 97 000 €).
      const series = [vIN];
      for (let m = 1; m <= N*12; m++) {
        cap = (cap + vMN) * (1 + tm);
        if (compMois[m]) cap += compMois[m];
        if (m % 12 === 0) series.push(cap);
      }
      return series;
    }
    /** Year-by-year capital series for livret */
    function livretSeries(inp) {
      const N = Math.round(inp.dureeAnnees);
      const tm = Math.pow(1 + livretTauxNet(inp), 1/12) - 1;
      const compMois = complementairesParMois(inp, 0, N*12); // livret/CAT : pas de frais d'entrée
      let cap = inp.versementInitial;
      const series = [inp.versementInitial];
      for (let m = 1; m <= N*12; m++) {
        cap = (cap + inp.versementMensuel) * (1 + tm);
        if (compMois[m]) cap += compMois[m];
        if (m % 12 === 0) series.push(cap);
      }
      return series;
    }

    /** Run full simulation for a given inputs snapshot. Returns metrics for given scenario level. */
    function runSimulation(inp, scenarioLvl = "med") {
      // Multi-projet PER + AV : deux sous-simulations exactes (fiscalité propre à chaque produit)
      // + une base consolidée (traitée comme un capital global) pour les chiffres de tête et les graphes.
      if (inp.produit === "multi") {
        const perSim = runSimulation(subInp(inp, "per"), scenarioLvl);
        const avSim  = runSimulation(subInp(inp, "av"),  scenarioLvl);
        const flat = {
          ...inp, produit: "av",
          versementInitial: (inp.multi?.per?.versementInitial || 0) + (inp.multi?.av?.versementInitial || 0),
          versementMensuel: (inp.multi?.per?.versementMensuel || 0) + (inp.multi?.av?.versementMensuel || 0),
          versementsComplementaires: [],
        };
        const base = runSimulation(flat, scenarioLvl);
        return { ...base, multi: { per: perSim, av: avSim } };
      }
      const rdtBrut = rdtPondere(inp.allocation);
      const sri = sriPondere(inp.allocation);
      const rdtPess = rdtBrut - 0.01;
      const rdtOpt = rdtBrut + 0.01;
      const rdt = scenarioLvl === "pess" ? rdtPess : scenarioLvl === "opt" ? rdtOpt : rdtBrut;
      const ligne = inp.successionLine ?? 'directe';
      const txIndirect = inp.successionTauxIndirect ?? TX_SUCC_INDIRECT;
      const txDirect = inp.successionTauxDirect ?? 0.30;

      const proj = projection(inp, rdt);
      // Dispatch fiscalité selon le produit choisi (AV / PER / Capi PM)
      let fisc, fiscPER = null, fiscCapi = null;
      if (inp.produit === "per") {
        const ageSortie = (inp.ageSouscripteur || 50) + (inp.dureeAnnees || 0);
        fiscPER = fiscalitePER(proj.capitalFin, proj.totVerseNet, proj.totVerseBrut, inp.tauxIR ?? 0.30, inp.perModeSortie ?? "capital", ageSortie);
        // Pour décès : PER assimilé AV — art. 990 I avant 70, droits succession après 70
        fisc = fiscaliteAV(proj.capitalFin, proj.totVerseNet, inp.nbBeneficiaires, inp.ageSouscripteur, txIndirect, proj.totVerseBrut, ligne, txDirect);
      } else if (inp.produit === "capi") {
        fiscCapi = fiscaliteCapiPM(proj.capitalFin, proj.totVerseBrut, inp.tauxIS ?? 0.25);
        fisc = { av70: false, taxe: fiscCapi.taxeIS, direct: fiscCapi.netCapital, abattTotal: 0, abattBenef: 0, partBenef: 0, imposableBenef: 0, imposableTotal: fiscCapi.plusValue, taxeBenef: 0 };
      } else {
        fisc = fiscaliteAV(proj.capitalFin, proj.totVerseNet, inp.nbBeneficiaires, inp.ageSouscripteur, txIndirect, proj.totVerseBrut, ligne, txDirect);
      }
      const r = rente(proj.capitalFin, proj.totVerseNet, rdt, inp.dureeAnnees, inp.situationFamiliale, proj.totVerseBrut);
      const livret = projLivret(inp);
      const livretFisc = fiscaliteLivret(livret.capitalFin);
      const livretRenteBrute = renteBruteAnnuelle(livret.capitalFin, inp.livretTaux);
      // PER + réintégration : capital auxiliaire issu du réinvestissement des réductions d'impôt
      const perReinvest = inp.produit === "per"
        ? projPERReinvest(inp, rdt, inp.tauxIR ?? 0.30)
        : null;

      return { rdtBrut, rdtPess, rdtMed: rdtBrut, rdtOpt, sri, rdt, proj, fisc, fiscPER, fiscCapi, rente: r, livret, livretFisc, livretRenteBrute, perReinvest, txSucc: txIndirect, ligne };
    }

    // === Formatters ===
    const fmtEUR = (n,d=0) => n==null||isNaN(n) ? "—" : new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:d,minimumFractionDigits:d}).format(n);
    const fmtEURc = n => {
      if (n==null||isNaN(n)) return "—";
      if (Math.abs(n)>=1e6) return `${(n/1e6).toFixed(2).replace('.',',')} M€`;
      if (Math.abs(n)>=1e3) return `${Math.round(n/1e3)} k€`;
      return `${Math.round(n)} €`;
    };
    const fmtPCT = (n,d=2) => n==null||isNaN(n) ? "—" : new Intl.NumberFormat('fr-FR',{style:'percent',minimumFractionDigits:d,maximumFractionDigits:d}).format(n);

    // === Icons ===
    const I = {
      logo: () => (
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          {/* Logo FIGARA — étoile compas à 8 branches en rouge */}
          {/* 4 branches cardinales (longues, fines, en losange) */}
          <polygon points="16,1 17,15 16,16 15,15" fill="#DC2626"/>
          <polygon points="31,16 17,17 16,16 17,15" fill="#DC2626"/>
          <polygon points="16,31 15,17 16,16 17,17" fill="#DC2626"/>
          <polygon points="1,16 15,15 16,16 15,17" fill="#DC2626"/>
          {/* 4 branches diagonales (plus courtes) */}
          <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(45 16 16)"/>
          <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(135 16 16)"/>
          <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(225 16 16)"/>
          <polygon points="16,5 17,15 16,16 15,15" fill="#DC2626" transform="rotate(315 16 16)"/>
          {/* Centre */}
          <circle cx="16" cy="16" r="0.8" fill="#DC2626"/>
        </svg>
      ),
      arrow: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>,
      back: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
      check: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
      close: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      chevron: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
      search: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
      plus: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      x: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      printer: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
      sparkle: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3 L13.5 8.5 L19 10 L13.5 11.5 L12 17 L10.5 11.5 L5 10 L10.5 8.5 Z"/></svg>,
      lock: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
      trophy: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
    };

    // ============================================================
    // FIGARA DECOR — filigranes rouges en filigrane sur toutes les étapes
    // ============================================================
    function FigaraDecor() {
      // Filigranes rouges éclatants type screenshot Figara — visibles sur fond sombre
      const lines = Array.from({length: 24}, (_, i) => i);
      const renderWaves = (key) => lines.map(i => {
        const yBase = 25 + i * 5.5;
        const opacity = Math.max(0.1, 0.85 - i * 0.03);
        return (
          <path
            key={`${key}-${i}`}
            d={`M -40 ${yBase}
                C 80 ${yBase - 38}, 180 ${yBase + 70}, 280 ${yBase - 10}
                S 420 ${yBase - 24}, 520 ${yBase + 12}`}
            stroke="#EF4444"
            strokeWidth="0.7"
            strokeOpacity={opacity}
            fill="none"
          />
        );
      });
      return (
        <div className="fixed inset-0 pointer-events-none no-print" style={{zIndex: 0}}>
          {/* Filigrane top-left — flux rouge prominent type brand Figara */}
          <svg className="absolute top-[40px] left-0" width="520" height="380" viewBox="0 0 520 380" fill="none">
            {renderWaves('tl')}
          </svg>
          {/* Filigrane bottom-right miroir */}
          <svg className="absolute bottom-0 right-0" width="520" height="380" viewBox="0 0 520 380" fill="none" style={{transform: 'scale(-1, -1)'}}>
            {renderWaves('br')}
          </svg>
        </div>
      );
    }

    // ============================================================
    // STEPS
    // ============================================================
    const STEPS = [{id:1,label:"Identité"},{id:2,label:"Produit"},{id:3,label:"Allocation"},{id:4,label:"Comparatif"},{id:5,label:"Présentation"}];

    function Breadcrumb({ current, onJump, completable }) {
      return (
        <div className="flex items-start justify-center max-w-2xl mx-auto px-6">
          {STEPS.map((s, idx) => {
            const isActive = current === s.id;
            const isDone = current > s.id;
            const canJump = s.id < current || (completable && completable[s.id]);
            return (
              <React.Fragment key={s.id}>
                <div className={`flex flex-col items-center ${canJump ? 'cursor-pointer group' : ''}`} onClick={() => canJump && onJump(s.id)}>
                  <div className={`step-dot ${isActive ? 'active' : ''} ${isDone ? 'done' : ''} ${canJump ? 'group-hover:scale-105' : ''}`}>
                    {isDone ? <I.check/> : s.id}
                  </div>
                  <div className={`step-text ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`}>{s.label}</div>
                </div>
                {idx < STEPS.length - 1 && (
                  <div className="flex-1 pt-[18px] px-3"><div className={`step-line ${current > s.id ? 'done' : ''}`}></div></div>
                )}
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    // ============================================================
    // APP
    // ============================================================
    function App({ session, onOpenAdmin, isSuperAdmin, onLogout }) {
      const [step, setStep] = useState(1);
      const [clients, setClients] = useState(() => {
        try { return JSON.parse(localStorage.getItem('figara_clients')) || CLIENTS_EXISTANTS; }
        catch { return CLIENTS_EXISTANTS; }
      });
      const [inputs, setInputs] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('figara_conseiller') || '{}');
          return { ...DEFAULT_INPUTS, conseillerNom: saved.conseillerNom || '', cabinetNom: saved.cabinetNom || '', cabinetLogo: saved.cabinetLogo || '', afficherFigara: saved.afficherFigara !== undefined ? saved.afficherFigara : true };
        } catch { return DEFAULT_INPUTS; }
      });
      const [scenarios, setScenarios] = useState([]);
      // Contrat « Autre assurance vie » (comparateur concurrent) — remonté ici pour être partagé
      // entre l'onglet Comparatif, la présentation client et le PDF (courbe « Assurance vie client »).
      const [autreAV, setAutreAV] = useState({ active: false, rdt: 0.02, plus8ans: true });
      const [scenarioLvl, setScenarioLvl] = useState("med");
      const [builderOpen, setBuilderOpen] = useState(false);
      const [builderInitial, setBuilderInitial] = useState(null);
      const [printMode, setPrintMode] = useState(false);
      // Scénario « prime périodique majorée » — partagé entre la présentation interactive et le PDF
      const [presPrime, setPresPrime] = useState(inputs.versementMensuel);
      const [presComparOn, setPresComparOn] = useState(false);

      // Remonte automatiquement en haut de page à chaque changement d'étape
      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [step]);

      // Computed simulation for current inputs
      const sim = useMemo(() => runSimulation(inputs, scenarioLvl), [inputs, scenarioLvl]);

      const totalP = useMemo(() => inputs.allocation.reduce((s,v)=>s+v.poids, 0), [inputs.allocation]);
      const totalVerseBrut = totalVerseBrutOf(inputs);
      const reductionCommerciale = (FRAIS_SOUSC_MAX - inputs.fraisSouscription) * totalVerseBrut;
      const reductionPCT = FRAIS_SOUSC_MAX > 0 ? (FRAIS_SOUSC_MAX - inputs.fraisSouscription) / FRAIS_SOUSC_MAX : 0;
      const fraisAuTarifMax = FRAIS_SOUSC_MAX * totalVerseBrut;
      const fraisActuels = inputs.fraisSouscription * totalVerseBrut;

      const completable = {
        1: inputs.mode === "select" ? !!inputs.clientSelected : (inputs.clientNom.trim() && (inputs.clientType === 'entreprise' || inputs.clientPrenom.trim())),
        2: inputs.versementInitial >= 0 && inputs.dureeAnnees > 0 && inputs.nbBeneficiaires >= 1,
        3: Math.abs(totalP - 1) < 0.001,
        4: true,
        5: true,
      };

      const upd = (k,v) => {
        setInputs(p => {
          const next = {...p, [k]: v};
          // persister le nom du conseiller/cabinet (+ logo) en temps réel
          if (k === 'conseillerNom' || k === 'cabinetNom' || k === 'cabinetLogo' || k === 'afficherFigara') {
            try { localStorage.setItem('figara_conseiller', JSON.stringify({ conseillerNom: next.conseillerNom, cabinetNom: next.cabinetNom, cabinetLogo: next.cabinetLogo, afficherFigara: next.afficherFigara })); } catch {}
          }
          return next;
        });
      };
      const saveNewClient = (client) => {
        const updated = [...clients, client];
        setClients(updated);
        try { localStorage.setItem('figara_clients', JSON.stringify(updated)); } catch {}
      };

      // Allocation : liste libre. Le poids est borné pour que la somme ne dépasse jamais 100 %.
      const updAllocItem = (id, field, v) => {
        setInputs(p => {
          if (field === "poids") {
            const otherSum = p.allocation.filter(item => item.id !== id).reduce((s, x) => s + x.poids, 0);
            const maxAllowed = Math.max(0, 1 - otherSum);
            v = Math.max(0, Math.min(maxAllowed, v));
          }
          return {
            ...p,
            allocation: p.allocation.map(item => item.id === id ? { ...item, [field]: v } : item)
          };
        });
      };
      const addAllocItem = (type = "fondsActions") => {
        setInputs(p => {
          const newId = (p.allocation.length ? Math.max(...p.allocation.map(x => x.id)) : 0) + 1;
          const meta = SUPPORT_META[type];
          return {
            ...p,
            allocation: [...p.allocation, { id: newId, type, poids: 0, rendement: meta.rdtNetDef, sri: meta.sriDef }]
          };
        });
      };
      const removeAllocItem = (id) => {
        setInputs(p => ({
          ...p,
          allocation: p.allocation.length > 1 ? p.allocation.filter(item => item.id !== id) : p.allocation
        }));
      };
      const changeAllocType = (id, newType) => {
        const meta = SUPPORT_META[newType];
        setInputs(p => ({
          ...p,
          allocation: p.allocation.map(item =>
            item.id === id
              ? { ...item, type: newType, rendement: meta.rdtNetDef, sri: meta.sriDef }
              : item
          )
        }));
      };

      // Versements complémentaires : liste libre {id, annee, montant}
      const addVersementComp = (annee = 1, montant = 10000) => {
        setInputs(p => {
          const list = p.versementsComplementaires || [];
          const newId = (list.length ? Math.max(...list.map(x => x.id)) : 0) + 1;
          return { ...p, versementsComplementaires: [...list, { id: newId, annee: Number(annee) || 0, montant: Number(montant) || 0 }] };
        });
      };
      const updVersementComp = (id, field, v) => {
        setInputs(p => ({
          ...p,
          versementsComplementaires: (p.versementsComplementaires || []).map(item => item.id === id ? { ...item, [field]: v } : item)
        }));
      };
      const removeVersementComp = (id) => {
        setInputs(p => ({
          ...p,
          versementsComplementaires: (p.versementsComplementaires || []).filter(item => item.id !== id)
        }));
      };

      const next = () => {
        if (step === 1 && inputs.mode === 'create' && inputs.clientNom.trim()) {
          const year = new Date().getFullYear();
          const id = 'AV-' + year + '-' + String(clients.length + 1).padStart(4, '0');
          const today = new Date().toLocaleDateString('fr-FR');
          saveNewClient({
            id,
            nom: inputs.clientNom.trim().toUpperCase(),
            prenom: inputs.clientPrenom.trim(),
            tel: inputs.clientTel.trim(),
            email: inputs.clientEmail.trim(),
            type: inputs.clientType,
            audit: inputs.audit || null,
            lastSim: today,
          });
        }
        setStep(s => Math.min(5, s+1));
      };
      const prev = () => setStep(s => Math.max(1, s-1));

      // Archivage Supabase : une ligne par simulation présentée au client.
      // Pas de compte requis : cabinet_nom/conseiller_nom (auto-déclarés dans "Vos informations")
      // servent d'identifiant d'usage. member_id reste rempli si un super-admin est connecté.
      const archiveSimulation = async () => {
        try {
          const { cabinetLogo, ...inputsArchives } = inputs;
          await supabase.from('simulations').insert({
            member_id: session?.user?.id || null,
            cabinet_nom: inputs.cabinetNom || null,
            conseiller_nom: inputs.conseillerNom || null,
            client_nom: inputs.clientNom || null,
            client_prenom: inputs.clientPrenom || null,
            client_email: inputs.clientEmail || null,
            produit: inputs.produit,
            inputs: inputsArchives,
            resume: {
              totalVerseBrut,
              capitalFinal: sim?.proj?.capitalFin ?? null,
              plusValue: sim?.proj?.plusValue ?? null,
              dureeAnnees: inputs.dureeAnnees,
            },
          });
        } catch (e) {
          console.error("Archivage de la simulation échoué :", e);
        }
      };
      const handleOpenPrint = () => { archiveSimulation(); setPrintMode(true); };

      const openBuilder = (sourceInputs) => {
        setBuilderInitial(JSON.parse(JSON.stringify(sourceInputs || inputs)));
        setBuilderOpen(true);
      };
      const closeBuilder = () => setBuilderOpen(false);
      const saveBuilderScen = (nom, builderInputs) => {
        setScenarios(p => [...p, { nom, date: Date.now(), inputs: JSON.parse(JSON.stringify(builderInputs)) }]);
        setBuilderOpen(false);
      };

      const removeScen = (idx) => setScenarios(p => p.filter((_,i)=>i!==idx));
      const loadScen = (s) => setInputs(s.inputs);

      const clientLabel = inputs.mode === "select" && inputs.clientSelected
        ? `${inputs.clientSelected.nom} ${inputs.clientSelected.prenom}`.trim()
        : inputs.mode === "create" && inputs.clientNom
        ? `${inputs.clientNom} ${inputs.clientPrenom}`.trim()
        : "Nouveau client";
      const clientId = inputs.mode === "select" && inputs.clientSelected ? inputs.clientSelected.id : "AV-2026-NEW";

      // Mode présentation client imprimable — overlay plein écran
      if (printMode) {
        return <ClientPresentationPrint inputs={inputs} sim={sim} scenarios={scenarios} clientLabel={clientLabel} totalVerseBrut={totalVerseBrut} autreAV={autreAV} presPrime={presComparOn ? presPrime : null} scenarioLvl={scenarioLvl} onClose={() => setPrintMode(false)} />;
      }

      return (
        <div className="min-h-screen flex flex-col relative">
          {/* FILIGRANE FIGARA — décor brand sur toutes les étapes */}
          <FigaraDecor />

          {/* STICKY HEADER + BREADCRUMB — palette Figara : sombre + serif + filigranes */}
          <div className="sticky top-0 z-30 no-print shadow-xl" style={{
            background: 'linear-gradient(180deg, rgba(28, 25, 23, 0.95) 0%, rgba(41, 37, 36, 0.92) 100%)',
            backdropFilter: 'blur(12px)',
            WebkitBackdropFilter: 'blur(12px)'
          }}>
            {/* Liseré rouge brand Figara en haut */}
            <div className="h-[3px] bg-gradient-to-r from-red-700 via-red-500 to-red-700"></div>
            {/* Filigrane rouge décoratif côté droit du header */}
            <svg className="absolute top-0 right-0 h-full pointer-events-none" width="360" height="100" viewBox="0 0 360 100" preserveAspectRatio="xMaxYMid slice" fill="none" style={{opacity: 0.4}}>
              {Array.from({length: 14}).map((_, i) => {
                const yBase = 8 + i * 6;
                return (
                  <path key={i}
                    d={`M 360 ${yBase} C 280 ${yBase - 8}, 200 ${yBase + 14}, 100 ${yBase - 4} S 0 ${yBase + 8}, -50 ${yBase}`}
                    stroke="#EF4444" strokeWidth="0.6" strokeOpacity={Math.max(0.1, 0.7 - i * 0.045)} fill="none"/>
                );
              })}
            </svg>
            <header className="border-b border-white/10 relative">
              <div className="max-w-screen-xl mx-auto px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <I.logo/>
                  <div className="serif text-[24px] font-semibold text-white tracking-[0.22em]">FIGARA</div>
                </div>
                <div className="hidden md:flex items-center gap-3 text-[12px]">
                  <span className="text-stone-400">Dossier</span>
                  <span className="mono text-white font-medium">{clientId}</span>
                  {clientLabel !== "Nouveau client" && (
                    <>
                      <span className="text-stone-600">·</span>
                      <span className="text-white font-semibold">{clientLabel}</span>
                    </>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  {isSuperAdmin && (
                    <button onClick={onOpenAdmin} className="px-3 py-1.5 text-[11px] font-semibold rounded-lg bg-white/10 text-white hover:bg-white/20 transition">
                      Vue Super-Admin
                    </button>
                  )}
                  <button onClick={onLogout} className="px-3 py-1.5 text-[11px] font-semibold rounded-lg border border-white/20 text-stone-300 hover:text-white hover:border-white/40 transition">
                    Déconnexion
                  </button>
                  <button className="text-stone-400 hover:text-white transition"><I.close/></button>
                </div>
              </div>
            </header>
            <div className="py-5 relative">
              <Breadcrumb current={step} onJump={setStep} completable={completable}/>
            </div>
          </div>

          <main className="flex-1 py-12 px-6 relative" style={{zIndex: 10}}>
            {step === 1 && <Step1Identite inputs={inputs} upd={upd} clients={clients} key="s1"/>}
            {step === 2 && <Step2Produit inputs={inputs} upd={upd} totalVerseBrut={totalVerseBrut} reductionCommerciale={reductionCommerciale} reductionPCT={reductionPCT} fraisAuTarifMax={fraisAuTarifMax} fraisActuels={fraisActuels} addVersementComp={addVersementComp} updVersementComp={updVersementComp} removeVersementComp={removeVersementComp} key="s2"/>}
            {step === 3 && <Step3Allocation inputs={inputs} updAllocItem={updAllocItem} addAllocItem={addAllocItem} removeAllocItem={removeAllocItem} changeAllocType={changeAllocType} sim={sim} totalP={totalP} key="s3"/>}
            {step === 4 && <Step4Resultats inputs={inputs} setInputs={setInputs} sim={sim} scenarioLvl={scenarioLvl} setScenarioLvl={setScenarioLvl} scenarios={scenarios} openBuilder={openBuilder} removeScen={removeScen} loadScen={loadScen} upd={upd} autreAV={autreAV} setAutreAV={setAutreAV} key="s4"/>}
            {step === 5 && <Step5Presentation inputs={inputs} sim={sim} scenarios={scenarios} scenarioLvl={scenarioLvl} setScenarioLvl={setScenarioLvl} onOpenPrint={handleOpenPrint} autreAV={autreAV} prime={presPrime} setPrime={setPresPrime} comparOn={presComparOn} setComparOn={setPresComparOn} key="s5"/>}
          </main>

          <footer className="border-t border-white/10 backdrop-blur py-5 px-6 no-print relative" style={{zIndex: 10, background: 'linear-gradient(0deg, rgba(28, 25, 23, 0.95) 0%, rgba(41, 37, 36, 0.92) 100%)'}}>
            <div className="max-w-3xl mx-auto flex items-center justify-between gap-4">
              <button onClick={prev} disabled={step===1} className="btn btn-light disabled:opacity-30 disabled:cursor-not-allowed"><I.back/> Précédent</button>
              <div className="text-[11px] uppercase tracking-wider text-stone-400 font-semibold">Étape {step}/{STEPS.length}</div>
              {step < 5 ? (
                <button onClick={next} disabled={!completable[step]} className="btn btn-dark">{step===4?"Présenter":"Continuer"} <I.arrow/></button>
              ) : (
                <button onClick={handleOpenPrint} className="btn btn-dark"><I.printer/> Générer simulation</button>
              )}
            </div>
          </footer>

          {/* SCENARIO BUILDER (slide-over) */}
          <ScenarioBuilder open={builderOpen} initialInputs={builderInitial} scenariosCount={scenarios.length} onClose={closeBuilder} onSave={saveBuilderScen} />
        </div>
      );
    }

    // ============================================================
    // NOUVEAU CLIENT — fenêtre de saisie à deux niveaux :
    //   « Fiche rapide »  : nom + prénom obligatoires, tél/email facultatifs.
    //   « Audit complet » : fiche de connaissance client saisie au maximum
    //                       par pastilles cliquables (état civil, famille,
    //                       revenus, fiscalité, immobilier, placements,
    //                       crédits, prévoyance, objectifs).
    // Le résultat est stocké dans inputs (champs de base) + inputs.audit,
    // archivé avec chaque simulation.
    // ============================================================
    const AUDIT_DEFAUT = {
      civilite: "M.", nomNaissance: "", dateNaissance: "", nationalite: "francaise", nationaliteAutre: "",
      adresseQ: "", adresse: "", codePostal: "", ville: "", ppe: "non", ppeConj: "non",
      situation: "", regime: "", regimeAutre: "",
      ddvQ: "", testamentQ: "", ddvAncienneQ: "",
      conjointQ: "", conjoint: { civilite: "Mme", nom: "", prenom: "", nomJeuneFille: "", dateNaissance: "", nationalite: "francaise", nationaliteAutre: "" },
      enfantsQ: "", enfants: [],
      pensionQ: "", pensionPercue: "", pensionVersee: "", pensionPeriode: "mois",
      activites: [],
      actSalarie: { poste: "", entreprise: "", statut: "", mode: "net", montant: "", periode: "mois", nbMois: "", variableQ: "", variableMode: "en_plus", variableBrutNet: "", variablePeriode: "an", variableN1: "", variableN2: "" },
      actIndependant: { activite: "", n1: "", n2: "", n3: "" },
      actChef: { societe: "", revenu: "", periode: "an" },
      actFonctionnaire: { poste: "", revenu: "", periode: "an" },
      actRetraite: { revenu: "", periode: "mois" },
      actAutre: { precision: "", revenu: "", periode: "an" },
      // Revenus du conjoint — même structure d'activités que le client
      conjointRev: {
        activites: [],
        actSalarie: { poste: "", entreprise: "", statut: "", mode: "net", montant: "", periode: "mois", nbMois: "", variableQ: "", variableMode: "en_plus", variableBrutNet: "", variablePeriode: "an", variableN1: "", variableN2: "" },
        actIndependant: { activite: "", n1: "", n2: "", n3: "" },
        actChef: { societe: "", revenu: "", periode: "an" },
        actFonctionnaire: { poste: "", revenu: "", periode: "an" },
        actRetraite: { revenu: "", periode: "mois" },
        actAutre: { precision: "", revenu: "", periode: "an" },
      },
      mobiliersQ: "", mobiliersExceptionnel: "", mobiliersN1: "", mobiliersN2: "", mobiliersN3: "", mobiliersNote: "",
      fonciersQ: "", fonciersTypes: [], meubleGere: "", locatifs: [], fonciersNote: "",
      tmi: null, tmiManuel: false, partsFiscales: "", impotQ: "", impotNet: "", rniFoyer: "", demiParts: [], detailRNIOuvert: "",
      reductionsQ: "", reductionsTypes: [], reductionsMontant: "", reductionsNote: "",
      // Une entrée par nature d'avantage : { montant, dureeType: "recurrent" | "limitee", duree, note }
      reductionsDetail: {},
      reductionsPer: { etablissement: "", ppQ: "", pp: "", contentPerfQ: "", contentGestionQ: "", note: "" },
      ifi: "non", ifiMontant: "", ifiTaux: "",
      banquePrincipale: "", banqueConjoint: "",
      logement: "", loyer: "",
      rpValeur: "", rpCreditQ: "", rpBanque: "", rpCrd: "", rpMensualite: "", rpTaux: "", rpDureeRestante: "", rpAssurRenegociee: "",
      rpAssurAssureur: "", rpAssurCotisation: "", rpAssurNote: "",
      biensQ: "", biens: [],
      avoirsQ: "", avoirs: [],
      creditsQ: "", credits: [],
      objectifs: [],
      objectifPrio: "",
      objectifsDetail: {
        // Retraite : une colonne par personne (âge de départ, pension estimée, complément visé)
        retraite: { age: "", pension: "", revenu: "", ageConj: "", pensionConj: "", revenuConj: "" },
        // Études : une ligne par enfant (lignes), les champs horizon/budget restent pour les anciens dossiers
        etudes: { horizon: "", budget: "", lignes: [] },
        prevoyance: { fumeur: "non", travailManuel: "non", travailRisque: "non", couvertureQ: "", note: "" },
        locatif: { budget: "", horizon: "", apport: "", mensuel: "" },
        fiscalite: { note: "", capital: "", mensuel: "" },
        transmettre: { note: "" },
        // Objectifs libres créés par le conseiller
        perso: { lignes: [] },
      },
      capaciteEpargne: "", capaciteEpargneLibre: "", epargnePrecaution: "", horizon: "", notes: "",
    };

    // Migration des audits enregistrés avec les formats précédents.
    function migrateAudit(a) {
      if (!a) return {};
      const m = { ...a };
      if (a.profession && !a.activites) {
        const map = { salarie: "salarie", salarie_cadre: "salarie", chef_entreprise: "chef", liberal: "independant", fonctionnaire: "fonctionnaire", retraite: "retraite", sans_activite: "sans", autre: "autre" };
        m.activites = [map[a.profession] || "autre"];
        delete m.profession;
      }
      if (a.actSalarie && a.actSalarie.revenu !== undefined && a.actSalarie.montant === undefined) {
        m.actSalarie = { ...AUDIT_DEFAUT.actSalarie, poste: a.actSalarie.poste || "", entreprise: a.actSalarie.entreprise || "", montant: a.actSalarie.revenu || "" };
      }
      if (a.actSalarie && a.actSalarie.montant !== undefined && a.actSalarie.nbMois === undefined) {
        m.actSalarie = { ...AUDIT_DEFAUT.actSalarie, ...a.actSalarie };
      }
      if (a.actIndependant && a.actIndependant.revenu !== undefined && a.actIndependant.n1 === undefined) {
        m.actIndependant = { activite: a.actIndependant.activite || "", n1: a.actIndependant.revenu || "", n2: "", n3: "" };
      }
      if (a.revenus) {
        if (a.revenus.salaires) m.actSalarie = { ...AUDIT_DEFAUT.actSalarie, montant: a.revenus.salaires };
        if (a.revenus.retraite) m.actRetraite = { revenu: a.revenus.retraite, periode: "an" };
        if (a.revenus.bncBicBa) m.actIndependant = { activite: "", n1: a.revenus.bncBicBa, n2: "", n3: "" };
        if (a.revenus.fonciers) { m.fonciersQ = "oui"; m.fonciersTypes = ["nue"]; m.locatifs = [{ id: 1, nom: "", type: "nue", loyer: String(Math.round((parseInt(a.revenus.fonciers, 10) || 0) / 12)), creditQ: "", mensualite: "", crd: "", note: "" }]; }
        if (a.revenus.mobiliers) { m.mobiliersQ = "oui"; m.mobiliersN1 = a.revenus.mobiliers; }
        if (a.revenus.pensionsPercues) { m.pensionQ = "oui"; m.pensionPercue = a.revenus.pensionsPercues; m.pensionPeriode = "an"; }
        if (a.revenus.pensionsVersees) { m.pensionQ = "oui"; m.pensionVersee = a.revenus.pensionsVersees; m.pensionPeriode = "an"; }
        delete m.revenus;
      }
      if (a.fonciers && !a.locatifs) { m.fonciersQ = "oui"; m.fonciersTypes = ["nue"]; m.locatifs = [{ id: 1, nom: "", type: "nue", loyer: a.fonciersPeriode === "an" ? String(Math.round((parseInt(a.fonciers, 10) || 0) / 12)) : a.fonciers, creditQ: "", mensualite: "", crd: "", note: "" }]; }
      if (a.mobiliers && a.mobiliersN1 === undefined) { m.mobiliersN1 = a.mobiliers; }
      if (Array.isArray(a.enfants) && a.enfants.length) {
        m.enfantsQ = "oui";
        m.enfants = a.enfants.map(e => ({ ...e, charge: e.charge === "oui" ? "100" : e.charge, filiation: e.filiation || "commun" }));
      }
      if ((a.fumeur || a.travailManuel || a.travailRisque) && !a.objectifsDetail) {
        m.objectifsDetail = JSON.parse(JSON.stringify(AUDIT_DEFAUT.objectifsDetail));
        m.objectifsDetail.prevoyance.fumeur = a.fumeur || "non";
        m.objectifsDetail.prevoyance.travailManuel = a.travailManuel || "non";
        m.objectifsDetail.prevoyance.travailRisque = a.travailRisque || "non";
      }
      if (a.objectifsDetail) {
        // Fusion champ par champ : un ancien objectifsDetail.etudes = {horizon,budget} ne doit pas
        // écraser les nouvelles clés (lignes, apport, mensuel…) ajoutées depuis.
        const base = JSON.parse(JSON.stringify(AUDIT_DEFAUT.objectifsDetail));
        Object.keys(a.objectifsDetail || {}).forEach(k => {
          base[k] = { ...(base[k] || {}), ...(a.objectifsDetail[k] || {}) };
        });
        m.objectifsDetail = base;
      }
      // v58 — "Revenus complémentaires" fusionné dans la retraite (doublon) et
      // "Valoriser un capital" transformé en objectif libre.
      {
        const od = m.objectifsDetail || JSON.parse(JSON.stringify(AUDIT_DEFAUT.objectifsDetail));
        const objs = Array.isArray(m.objectifs) ? [...m.objectifs] : [];
        let touche = false;
        if (objs.includes("revenus")) {
          const anc = (a.objectifsDetail && a.objectifsDetail.revenus) || {};
          if (anc.montant && od.retraite && !od.retraite.revenu) od.retraite.revenu = anc.montant;
          if (!objs.includes("retraite")) objs.push("retraite");
          if (m.objectifPrio === "revenus") m.objectifPrio = "retraite";
          touche = true;
        }
        if (objs.includes("valoriser")) {
          const anc = (a.objectifsDetail && a.objectifsDetail.valoriser) || {};
          od.perso = od.perso || { lignes: [] };
          od.perso.lignes = [...(od.perso.lignes || []), { id: (od.perso.lignes || []).length + 1, titre: "Valoriser un capital", note: anc.note || "", capital: "", mensuel: "", horizon: "" }];
          if (!objs.includes("perso")) objs.push("perso");
          if (m.objectifPrio === "valoriser") m.objectifPrio = "perso";
          touche = true;
        }
        // Anciens dossiers : le budget études unique devient la première ligne enfant.
        if (od.etudes && (od.etudes.horizon || od.etudes.budget) && !(od.etudes.lignes || []).length) {
          od.etudes.lignes = [{ id: 1, nom: "", horizon: od.etudes.horizon || "", budget: od.etudes.budget || "" }];
          od.etudes.horizon = ""; od.etudes.budget = "";
          touche = true;
        }
        if (touche) {
          m.objectifs = objs.filter(v => v !== "revenus" && v !== "valoriser");
          m.objectifsDetail = od;
        }
      }
      // v59 — le total unique de réductions devient un détail par nature (montant + durée).
      m.reductionsDetail = { ...(a.reductionsDetail || {}) };
      const dejaVentile = Object.keys(m.reductionsDetail).some(k => ncInt((m.reductionsDetail[k] || {}).montant) > 0);
      if (!dejaVentile && ncInt(a.reductionsMontant) > 0) {
        const types = (a.reductionsTypes || []);
        const cible = types.length === 1 ? types[0] : "autre";
        if (!types.includes(cible)) m.reductionsTypes = [...types, cible];
        m.reductionsDetail[cible] = {
          ...(m.reductionsDetail[cible] || {}),
          montant: String(ncInt(a.reductionsMontant)),
          dureeType: NC_REDUC_DEF(cible).dureeDefaut,
          note: types.length > 1 ? "Total repris d'un dossier antérieur — à ventiler par nature." : "",
        };
      }
      // v59 — les enfants gagnent l'indicateur de handicap (demi-part supplémentaire).
      if (Array.isArray(m.enfants)) m.enfants = m.enfants.map(e => ({ handicap: "non", ...e }));
      return m;
    }

    // Micro-composants de saisie du modal Nouveau client — définis AU NIVEAU MODULE
    // (jamais à l'intérieur du composant : un composant redéfini à chaque render
    // serait démonté/remonté par React à chaque frappe → perte du focus).
    const NcChip = ({ act, on, children }) => (
      <button type="button" onClick={on}
        style={act ? { background: "var(--nc-accent, #1c1917)", borderColor: "var(--nc-accent, #1c1917)" } : undefined}
        className={`px-3 py-1.5 rounded-full text-[12px] font-semibold border transition ${act ? "text-white shadow-sm" : "bg-white text-stone-600 border-stone-300 hover:border-stone-900"}`}>
        {children}
      </button>
    );
    const NcChips = ({ opts, val, on }) => (
      <div className="flex flex-wrap gap-1.5">{opts.map(o => <NcChip key={o.v} act={val === o.v} on={() => on(o.v)}>{o.l}</NcChip>)}</div>
    );
    const NcMultiChips = ({ opts, vals, on }) => (
      <div className="flex flex-wrap gap-1.5">{opts.map(o => <NcChip key={o.v} act={(vals||[]).includes(o.v)} on={() => on((vals||[]).includes(o.v) ? vals.filter(x => x !== o.v) : [...(vals||[]), o.v])}>{o.l}</NcChip>)}</div>
    );
    const NcOuiNon = ({ val, on }) => <NcChips opts={[{v:"non",l:"Non"},{v:"oui",l:"Oui"}]} val={val} on={on} />;
    const NcL = ({ children }) => <div className="text-[11px] uppercase tracking-wider font-bold text-stone-500 mb-1.5 mt-3">{children}</div>;
    const NcTxt = ({ v, on, ph, cls = "" }) => (
      <input type="text" value={v} placeholder={ph || ""} onChange={e => on(e.target.value)}
        className={`w-full px-3 py-2 text-[13px] bg-stone-50 border border-stone-200 rounded-lg focus:outline-none focus:border-stone-900 ${cls}`} />
    );
    const NcEur = ({ v, on, unit = "€", ph = "0" }) => (
      <div className="flex items-center bg-stone-50 border border-stone-200 rounded-lg">
        <input type="text" inputMode="numeric" value={v ? new Intl.NumberFormat('fr-FR').format(parseInt(v, 10)) : ""} placeholder={ph}
          onChange={e => on(e.target.value.replace(/[^\d]/g, ""))}
          className="num w-full px-3 py-2 text-right text-[13px] font-bold text-stone-900 bg-transparent focus:outline-none" />
        <span className="px-2.5 text-[11px] text-stone-400 whitespace-nowrap flex-shrink-0">{unit}</span>
      </div>
    );
    // Montant signé : accepte un résultat négatif (déficit foncier, résultat BIC déficitaire).
    const NcEurSigne = ({ v, on, unit = "€", ph = "0", cls = "" }) => {
      const s = v == null ? "" : String(v);
      const neg = s.trim().charAt(0) === "-";
      const n = parseInt(s.replace(/[^\d]/g, ""), 10);
      const aff = isFinite(n) ? (neg ? "−" : "") + new Intl.NumberFormat('fr-FR').format(n) : (neg ? "−" : "");
      return (
        <div className={`flex items-center bg-stone-50 border border-stone-200 rounded-lg ${cls}`}>
          <input type="text" inputMode="numeric" value={aff} placeholder={ph}
            onChange={e => { const raw = e.target.value; const m = /^\s*[-−]/.test(raw); on((m ? "-" : "") + raw.replace(/[^\d]/g, "")); }}
            className="num w-full px-3 py-2 text-right text-[13px] font-bold text-stone-900 bg-transparent focus:outline-none" />
          <span className="px-2.5 text-[11px] text-stone-400 whitespace-nowrap flex-shrink-0">{unit}</span>
        </div>
      );
    };
    // Montant avec bascule de période €/mois ⇄ €/an intégrée — plus d'ambiguïté d'unité.
    const NcEurP = ({ v, on, per, onPer, ph = "0" }) => {
      const n = parseInt(v, 10);
      const p0 = per || "an";
      return (
        <div>
          <div className="flex items-center bg-stone-50 border border-stone-200 rounded-lg">
            <input type="text" inputMode="numeric" value={v ? new Intl.NumberFormat('fr-FR').format(parseInt(v, 10)) : ""} placeholder={ph}
              onChange={e => on(e.target.value.replace(/[^\d]/g, ""))}
              className="num w-full px-3 py-2 text-right text-[13px] font-bold text-stone-900 bg-transparent focus:outline-none" />
            <span className="pl-1 text-[11px] text-stone-400 flex-shrink-0">€</span>
            <div className="flex items-center gap-1 px-1.5 flex-shrink-0">
              {["mois","an"].map(p => (
                <button key={p} type="button" onClick={() => onPer(p)} title={p === "mois" ? "Montant PAR MOIS" : "Montant PAR AN"}
                  style={p0 === p ? { background: "var(--nc-accent, #1c1917)", borderColor: "var(--nc-accent, #1c1917)" } : undefined}
                  className={`px-2 py-1 rounded-md text-[11px] font-extrabold border transition ${p0 === p ? "text-white shadow-sm" : "bg-white text-stone-400 border-stone-300 hover:border-stone-900 hover:text-stone-700"}`}>/{p}</button>
              ))}
            </div>
          </div>
          {/* Garde-fou anti-confusion mois/an : l'équivalence est toujours affichée en clair. */}
          {isFinite(n) && n > 0 && (
            <div className="text-[10px] text-stone-400 mt-0.5 text-right">
              {p0 === "mois"
                ? <>saisi PAR MOIS — soit <b className="text-stone-600">{new Intl.NumberFormat('fr-FR').format(n * 12)} €/an</b></>
                : <>saisi PAR AN — soit <b className="text-stone-600">{new Intl.NumberFormat('fr-FR').format(Math.round(n / 12))} €/mois</b></>}
            </div>
          )}
        </div>
      );
    };
    const NcPct = ({ v, on, ph = "0", unit = "%" }) => (
      <div className="flex items-center bg-stone-50 border border-stone-200 rounded-lg">
        <input type="text" inputMode="decimal" value={v} placeholder={ph}
          onChange={e => on(e.target.value.replace(/[^\d.,]/g, ""))}
          className="num w-full px-3 py-2 text-right text-[13px] font-bold text-stone-900 bg-transparent focus:outline-none" />
        <span className="px-2.5 text-[11px] text-stone-400 whitespace-nowrap flex-shrink-0">{unit}</span>
      </div>
    );
    // --- Saisie rapide -------------------------------------------------------
    // Pastilles de montants ronds sous un champ € : un clic remplit le champ,
    // qui reste modifiable au clavier pour les dossiers exigeants.
    const ncKfmt = (p) => p >= 1000000 ? `${String(p / 1000000).replace('.', ',')} M` : p >= 1000 ? `${Math.round(p / 1000)} k` : String(p);
    const NcEurQuick = ({ v, on, unit = "€", ph = "0", presets = [] }) => (
      <div>
        <NcEur v={v} on={on} unit={unit} ph={ph} />
        {presets.length > 0 && (
          <div className="flex flex-wrap gap-1 mt-1">
            {presets.map(p => (
              <button key={p} type="button" onClick={() => on(String(p))}
                style={ncInt(v) === p ? { background: "var(--nc-accent, #1c1917)", borderColor: "var(--nc-accent, #1c1917)" } : undefined}
                className={`px-2 py-0.5 rounded-full text-[10px] font-bold border transition ${ncInt(v) === p ? "text-white shadow-sm" : "bg-white text-stone-500 border-stone-200 hover:border-stone-900"}`}>{ncKfmt(p)}</button>
            ))}
          </div>
        )}
      </div>
    );
    // Bloc « + Détails » repliable : l'essentiel d'un bien / placement reste visible,
    // le reste (crédit, assurance, gestion, notes) se déplie à la demande.
    // S'ouvre tout seul si des données y sont déjà renseignées (dossier existant).
    const NcDetails = ({ label = "+ Détails (crédit, notes…)", filled = false, children }) => {
      const [open, setOpen] = useState(!!filled);
      if (!open) return (
        <button type="button" onClick={() => setOpen(true)}
          className="mt-2 text-[11px] font-bold text-stone-500 hover:text-stone-900 border border-dashed border-stone-300 hover:border-stone-900 rounded-full px-3 py-1 transition">{label}</button>
      );
      return (
        <div className="mt-2 rounded-lg border border-dashed border-stone-300 px-3 py-2.5 relative">
          <button type="button" onClick={() => setOpen(false)} className="absolute top-1.5 right-2 text-[10px] font-bold text-stone-400 hover:text-stone-700 transition">Réduire</button>
          {children}
        </div>
      );
    };
    // Curseur de saisie : la valeur se règle au doigt, sans clavier. Un petit bouton ✎
    // (discret, rarement utile) bascule sur la saisie libre pour les valeurs hors plage.
    const NcSlider = ({ v, on, min, max, step = 1, unit = "€", dec = false, empty = "à régler" }) => {
      const [libre, setLibre] = useState(false);
      const num = dec ? parseFloat(String(v == null ? "" : v).replace(",", ".")) : parseInt(String(v == null ? "" : v).replace(/[^\d]/g, ""), 10);
      const val = isFinite(num) ? num : null;
      const aff = val == null ? null : dec
        ? `${String(Math.round(val * 100) / 100).replace(".", ",")} ${unit}`
        : `${new Intl.NumberFormat('fr-FR').format(val)} ${unit}`;
      const commit = (x) => on(dec ? String(x).replace(".", ",") : String(x));
      return (
        <div>
          <div className="flex items-center justify-between gap-2">
            <span className="num text-[13px] font-bold text-stone-900">{aff != null ? aff : <span className="text-[11px] text-stone-300 font-normal italic">{empty}</span>}</span>
            <button type="button" title="Saisie libre au clavier" onClick={() => setLibre(x => !x)}
              className={`px-1.5 py-0.5 rounded text-[11px] font-bold leading-none transition ${libre ? "bg-stone-900 text-white" : "text-stone-300 hover:text-stone-700"}`}>✎</button>
          </div>
          <input type="range" min={min} max={max} step={step} value={val != null ? Math.min(max, Math.max(min, val)) : min}
            onChange={e => commit(e.target.value)} className="w-full cursor-pointer block" style={{ accentColor: "var(--nc-accent, #1c1917)", height: 20 }} />
          {libre && (
            <div className="mt-1">
              {dec ? <NcPct v={v || ""} on={on} unit={unit} /> : <NcEur v={v || ""} on={on} unit={unit} />}
            </div>
          )}
        </div>
      );
    };
    // Menu déroulant générique : remplace les longues rangées de cases quand
    // les options sont nombreuses — un clic, une liste, terminé.
    const NcSelect = ({ opts, val, on, ph = "— Choisir —" }) => (
      <select value={val == null ? "" : String(val)} onChange={e => on(e.target.value)}
        className="w-full px-3 py-2 text-[13px] bg-stone-50 border border-stone-200 rounded-lg focus:outline-none focus:border-stone-900 cursor-pointer">
        <option value="">{ph}</option>
        {opts.map(o => <option key={o.v} value={o.v}>{o.l}{o.d ? ` — ${o.d}` : ""}</option>)}
      </select>
    );
    // Banque : menu déroulant des enseignes courantes + banques déjà citées dans le
    // dossier en tête de liste. « Autre… » bascule sur la saisie libre.
    const NC_BANQUES = ["Crédit Agricole", "BNP Paribas", "Société Générale", "Caisse d'Épargne", "Banque Populaire", "Crédit Mutuel", "CIC", "LCL", "La Banque Postale", "BoursoBank", "Fortuneo", "Hello bank!", "AXA Banque", "Sofinco", "Cetelem", "Cofidis"];
    const NcBanqueSelect = ({ v, on, known = [] }) => {
      const [libre, setLibre] = useState(false);
      const list = [];
      [...(known || []), ...NC_BANQUES].forEach(b => { const t = (b || "").trim(); if (t && !list.some(x => x.toLowerCase() === t.toLowerCase())) list.push(t); });
      const horsListe = v && !list.some(x => x.toLowerCase() === v.toLowerCase());
      if (libre || horsListe) return (
        <div className="flex items-center gap-1">
          <div className="flex-1 min-w-0"><NcTxt v={v || ""} on={on} ph="Nom de la banque" /></div>
          <button type="button" title="Revenir à la liste" onClick={() => { setLibre(false); if (horsListe && !v) on(""); }}
            className="px-1.5 py-2 text-[11px] font-bold text-stone-300 hover:text-stone-700 transition flex-shrink-0">▾</button>
        </div>
      );
      return (
        <select value={v || ""} onChange={e => { if (e.target.value === "__libre") { setLibre(true); } else on(e.target.value); }}
          className="w-full px-3 py-2 text-[13px] bg-stone-50 border border-stone-200 rounded-lg focus:outline-none focus:border-stone-900 cursor-pointer">
          <option value="">— Choisir —</option>
          {list.map(b => <option key={b} value={b}>{b}</option>)}
          <option value="__libre">Autre…</option>
        </select>
      );
    };

    // Champ banque avec les banques déjà citées dans le dossier en pastilles :
    // une banque ne se tape qu'une seule fois.

          try { if (window.__ncStepTs && Date.now() - window.__ncStepTs < 900) return; } catch (e) {}
          // Pour une liste (last), on descend vers la DERNIÈRE ligne (celle qu'on vient d'ajouter),

          const el = (last && ref.current.lastElementChild) ? ref.current.lastElementChild : ref.current;

    // Sous-section d'une fiche : titre discret + filet, pour aérer les cartes longues.

    // Types de placement — libellé, couleur et exemples

    const NcObjCarte = ({ o, act, prio, on }) => (

    const NcObjBloc = ({ o, children }) => (

    // Bloc de détail d'une activité (salarié, indépendant…) — défile à l'apparition
    const NcBloc = ({ t, children }) => {

    };
    // Âge calculé depuis une date ISO ou une année
    // Un client (ou son conjoint) est nécessairement majeur : le sélecteur de date de
    // naissance est plafonné à aujourd'hui − 18 ans — le calendrier s'ouvre directement
    // sur les années plausibles au lieu de proposer l'année en cours.
    const NC_NAISSANCE_MAX = (() => {
      const t = new Date();
      return `${t.getFullYear() - 18}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
    })();
    const ncAgeDate = (iso) => {
      if (!iso) return null;
      const dt = new Date(iso);
      if (isNaN(dt.getTime())) return null;
      const now = new Date();
      let a = now.getFullYear() - dt.getFullYear();
      const mm = now.getMonth() - dt.getMonth();
      if (mm < 0 || (mm === 0 && now.getDate() < dt.getDate())) a--;
      return a > 0 && a < 110 ? a : null;
    };
    const ncAgeAnnee = (annee) => {
      const y = parseInt(annee, 10);
      if (!y || String(annee).length < 4) return null;
      const a = new Date().getFullYear() - y;
      return a >= 0 && a < 110 ? a : null;
    };
    const NcAge = ({ a }) => a == null ? null : (
      <span className="num text-[12px] font-bold text-teal-700 whitespace-nowrap flex-shrink-0">{a} an{a > 1 ? "s" : ""}</span>
    );

    // ============================================================
    // MATRICE D'ENDETTEMENT — règles bancaires appliquées à l'audit.
    //   · Salaire fixe : annualisé (12 ou 13 mois), converti en net si saisi brut.
    //   · Part variable : moyenne des 2 dernières années, sauf si en baisse → dernière année.
    //   · Indépendant (BNC/BIC/BA) : moyenne des 3 dernières années, sauf si en baisse → dernière année.
    //   · Dividendes : même règle que l'indépendant ; s'ils sont exceptionnels → non retenus.
    //   · Loyers encaissés : retenus à 80 % (règle bancaire).
    //   · Logé à titre gratuit : loyer fictif de 600 €/mois en charge.
    //   Les montants sont mensualisés. Matrice indicative, affinable au cas par cas.
    // ============================================================
    const ncInt = (v) => { const n = parseInt(v, 10); return isFinite(n) ? n : 0; };
    const ncMens = (montant, periode) => { const m = ncInt(montant); return periode === "an" ? m / 12 : m; };
    function ncCalcEndettement(d) {
      const revenus = []; const charges = [];
      // meta = { qui: "client" | "conjoint" | "foyer", cat: "activite" | "patrimoine" | "pension" }
      // La ventilation par personne alimente la synthèse (disparité de revenus, scénario décès).
      const push = (arr, label, mensuel, regle, meta) => { if (mensuel > 0.5) arr.push({ label, mensuel: Math.round(mensuel), regle: regle || null, qui: (meta && meta.qui) || "foyer", cat: (meta && meta.cat) || "patrimoine" }); };
      // — Revenus d'activité (client puis conjoint, mêmes règles) —
      const calcPersonne = (pd, sfx, qui) => {
        const A = { qui, cat: "activite" };
        const has = (v) => ((pd || {}).activites || []).includes(v);
        if (!pd) return;
        if (has("salarie")) {
          const s = pd.actSalarie || {};
          const coef = s.statut === "cadre" ? 0.75 : 0.78;
          const m = ncInt(s.montant);
          // Part variable : convertie en net si saisie en brut, règle moyenne 2 ans sauf baisse.
          let varRetenu = 0, varRegle = null, v1n = 0;
          if (s.variableQ === "oui") {
            const vBrutNet = s.variableBrutNet || s.mode;
            const kPer = s.variablePeriode === "mois" ? 12 : 1;   // variable saisi en €/mois → annualisé
            const conv = (x) => (vBrutNet === "brut" ? x * coef : x) * kPer;
            const v1 = conv(ncInt(s.variableN1)), v2 = conv(ncInt(s.variableN2));
            v1n = v1;
            if (v1 && v2) {
              if (v1 < v2) { varRetenu = v1; varRegle = "en baisse → dernière année"; }
              else { varRetenu = (v1 + v2) / 2; varRegle = "moyenne 2 ans"; }
            } else varRetenu = v1 || v2;
            if (vBrutNet === "brut") varRegle = (varRegle ? varRegle + " · " : "") + "converti en net";
          }
          if (m) {
            const nbM = parseInt(s.nbMois, 10) || 12;
            let annuel = s.periode === "mois" ? m * nbM : m;
            if (s.mode === "brut") annuel = Math.round(annuel * coef);
            // « Dont » : le salaire saisi inclut le variable → on isole le fixe (− variable dernière année).
            const dont = s.variableQ === "oui" && s.variableMode === "dont";
            if (dont) annuel = Math.max(0, annuel - v1n);
            push(revenus, "Salaire fixe" + (nbM > 12 ? ` (${nbM} mois)` : "") + (dont ? " (hors variable)" : "") + sfx, annuel / 12, s.mode === "brut" ? "converti en net" : null, A);
          }
          if (s.variableQ === "oui") push(revenus, "Part variable" + sfx, varRetenu / 12, varRegle, A);
        }
        if (has("independant")) {
          const i = pd.actIndependant || {};
          const n1 = ncInt(i.n1), n2 = ncInt(i.n2), n3 = ncInt(i.n3);
          const present = [n1, n2, n3].filter(x => x > 0);
          let retenu = 0, regle = null;
          if (present.length) {
            if (n1 && n2 && n1 < n2) { retenu = n1; regle = "en baisse → dernière année"; }
            else { retenu = present.reduce((x, y) => x + y, 0) / present.length; regle = present.length > 1 ? `moyenne ${present.length} ans` : null; }
          }
          push(revenus, "BNC / BIC / BA" + sfx, retenu / 12, regle, A);
        }
        if (has("chef")) push(revenus, "Rémunération dirigeant" + sfx, ncMens((pd.actChef || {}).revenu, (pd.actChef || {}).periode), null, A);
        if (has("fonctionnaire")) push(revenus, "Traitement" + sfx, ncMens((pd.actFonctionnaire || {}).revenu, (pd.actFonctionnaire || {}).periode), null, A);
        if (has("retraite")) push(revenus, "Retraite" + sfx, ncMens((pd.actRetraite || {}).revenu, (pd.actRetraite || {}).periode), null, A);
        if (has("autre")) push(revenus, "Autre activité" + sfx, ncMens((pd.actAutre || {}).revenu, (pd.actAutre || {}).periode), null, A);
      };
      // Libellés des lignes de revenus : Monsieur / Madame plutôt que « (conjoint) ».
      const civRevC = d.civilite === "Mme" ? "Madame" : "Monsieur";
      const civRevJ = (((d.conjoint || {}).civilite) || (d.civilite === "Mme" ? "M." : "Mme")) === "Mme" ? "Madame" : "Monsieur";
      calcPersonne(d, d.conjointQ === "oui" ? ` — ${civRevC}` : "", "client");
      if (d.conjointQ === "oui") calcPersonne(d.conjointRev, ` — ${civRevJ}`, "conjoint");
      // — Dividendes / revenus mobiliers —
      if (d.mobiliersQ === "oui") {
        if (d.mobiliersExceptionnel === "oui") {
          revenus.push({ label: "Revenus mobiliers", mensuel: 0, regle: "exceptionnels → non retenus" });
        } else {
          const m1 = ncInt(d.mobiliersN1), m2 = ncInt(d.mobiliersN2), m3 = ncInt(d.mobiliersN3);
          const present = [m1, m2, m3].filter(x => x > 0);
          let retenu = 0, regle = null;
          if (present.length) {
            if (m1 && m2 && m1 < m2) { retenu = m1; regle = "en baisse → dernière année"; }
            else { retenu = present.reduce((x, y) => x + y, 0) / present.length; regle = present.length > 1 ? `moyenne ${present.length} ans` : null; }
          }
          push(revenus, "Dividendes / mobiliers", retenu / 12, regle);
        }
      }
      // — Loyers (fonciers + autres biens en location) : 80 % —
      const loyersLoc = (d.locatifs || []).reduce((s, l) => s + ncInt(l.loyer), 0);
      if (loyersLoc) push(revenus, "Loyers encaissés × 80 %", loyersLoc * 0.8, "règle bancaire 80 %");
      const loyersBiens = (d.biens || []).filter(b => b.enLocationQ === "oui").reduce((s, b) => s + ncInt(b.loyer), 0);
      if (loyersBiens) push(revenus, "Autres loyers × 80 %", loyersBiens * 0.8, "règle bancaire 80 %");
      // — Pensions —
      if (d.pensionQ === "oui") {
        push(revenus, "Pension perçue", ncMens(d.pensionPercue, d.pensionPeriode), null, { qui: "foyer", cat: "pension" });
        push(charges, "Pension versée", ncMens(d.pensionVersee, d.pensionPeriode));
      }
      // — Logement & crédits —
      if (d.logement === "locataire") push(charges, "Loyer résidence principale", ncInt(d.loyer));
      if (d.logement === "gratuit") push(charges, "Loyer fictif (logé à titre gratuit)", 600, "forfait 600 €");
      if (d.logement === "proprietaire" && d.rpCreditQ === "oui") push(charges, "Crédit résidence principale", ncInt(d.rpMensualite));
      (d.locatifs || []).forEach((l, i) => { if (l.creditQ === "oui") push(charges, `Crédit locatif ${l.nom || "n° " + (i + 1)}`, ncInt(l.mensualite)); });
      (d.biens || []).forEach((b, i) => { if (b.creditQ === "oui") push(charges, `Crédit ${b.nom || "bien " + (i + 1)}`, ncInt(b.mensualite)); });
      (d.credits || []).forEach((c, i) => push(charges, `Crédit ${c.nature === "conso" ? "consommation" : c.nature || ""}`.trim() + ` ${i + 1}`, ncInt(c.mensualite)));
      const totalRevenus = Math.round(revenus.reduce((s, r) => s + r.mensuel, 0));
      const totalCharges = Math.round(charges.reduce((s, c) => s + c.mensuel, 0));
      const taux = totalRevenus > 0 ? totalCharges / totalRevenus : null;
      const dispo35 = Math.max(0, Math.round(totalRevenus * 0.35 - totalCharges));
      const pv = (mens, mois, tauxAnnuel = 0.04) => { const t = tauxAnnuel / 12; return mens > 0 ? mens * (1 - Math.pow(1 + t, -mois)) / t : 0; };
      const epargneConstituee = (d.avoirs || []).reduce((s, a) => s + ncInt(a.valeur), 0);
      const ppMensuels = (d.avoirs || []).filter(a => a.ppQ === "oui").reduce((s, a) => s + ncInt(a.pp), 0);
      // — Patrimoine net : actif (immobilier + épargne) − passif (capitaux restant dus) —
      const actifImmo = ncInt(d.rpValeur)
        + (d.locatifs || []).reduce((s, l) => s + ncInt(l.valeur), 0)
        + (d.biens || []).reduce((s, b) => s + ncInt(b.valeur), 0);
      const passif = (d.logement === "proprietaire" && d.rpCreditQ === "oui" ? ncInt(d.rpCrd) : 0)
        + (d.locatifs || []).reduce((s, l) => s + (l.creditQ === "oui" ? ncInt(l.crd) : 0), 0)
        + (d.biens || []).reduce((s, b) => s + (b.creditQ === "oui" ? ncInt(b.crd) : 0), 0)
        + (d.credits || []).reduce((s, c) => s + ncInt(c.crd), 0);
      const actifTotal = actifImmo + epargneConstituee;
      const patrimoineNet = actifTotal - passif;
      const revActivite = (qui) => Math.round(revenus.filter(r => r.cat === "activite" && r.qui === qui).reduce((s, r) => s + r.mensuel, 0));
      // Hypothèses cabinet : 3,90 % sur 20 ans, 4,00 % sur 25 ans (hors assurance).
      return { revenus, charges, totalRevenus, totalCharges, taux, dispo35, cap20: Math.round(pv(dispo35, 240, 0.039)), cap25: Math.round(pv(dispo35, 300, 0.04)), epargneConstituee, ppMensuels, actifImmo, actifTotal, passif, patrimoineNet,
               revActiviteClient: revActivite("client"), revActiviteConjoint: revActivite("conjoint") };
    }

    // ============================================================
